почти будничным. Она скользила пальцами по голографическому интерфейсу, вызывая на экраны потоки данных."}, {"type": "dialogue", "speaker": "Рэй", "text": "Как скажешь, док. Очередной техосмотр. Нужно держать инструменты в идеальном порядке."}, {"type": "dialogue", "speaker": "Доктор Касс Арден", "text": "Именно. «Эгида» не жалеет ресурсов на своих лучших оперативников."}, {"type": "dialogue", "speaker": "Рэй", "text": "Потому что кто-то должен противостоять этим... аномалиям. Мы — щит, который корпорация дала человечеству."}, {"type": "thought", "speaker": "Рэй", "text": "И я горжусь тем, что я его острие."}, {"type": "narration", "speaker": null, "text": "Диагностические циклы сменяли друг друга. По телу пробегали едва заметные электрические импульсы, тестируя отклик нейроинтерфейса и мышечных сервоприводов."}, {"type": "narration", "speaker": null, "text": "Мой взгляд был прикован к главному монитору, где бежали строки логов и строились графики производительности."}, {"type": "thought", "speaker": "Рэй", "text": "Все в зеленой зоне. Как и всегда. Но что, если?.. Что, если однажды они найдут что-то не то? Микротрещину. Сбой протокола."}, {"type": "narration", "speaker": null, "text": "Неприятный холодок пробежал по спине, не имеющий ничего общего с температурой в отсеке."}, {"type": "thought", "speaker": "Рэй", "text": "Отстранение от операций. Кабинетная работа. Анализ данных... Это не жизнь. Это хуже смерти."}, {"type": "dialogue", "speaker": "Доктор Касс Арден", "text": "Напряжен, Рэй? Не стоит. Твои системы держат нагрузку лучше, чем после той заварушки в Багровых Шпилях. Помню, как тебя тогда притащили."}, {"type": "narration", "speaker": null, "text": "Ее слова немного успокоили. Багровые Шпили. Да, это была славная охота."}, {"type": "dialogue", "speaker": "Рэй", "text": "Тогда пришлось попотеть. Но железо выдержало."}, {"type": "dialogue", "speaker": "Доктор Касс Арден", "text": "Еще как. Ты всегда был образцом стабильности."}, {"type": "narration", "speaker": null, "text": "Основной цикл диагностики завершился протяжным сигналом. Арден просматривала итоговые отчеты, и на мгновение ее брови сошлись у переносицы."}, {"type": "narration", "speaker": null, "text": "Она задержала взгляд на одном из экранов, где светились какие-то малопонятные мне диаграммы."}, {"type": "thought", "speaker": "Рэй", "text": "Она что-то увидела. Вот оно."}, {"type": "narration", "speaker": null, "text": "Сердце, мое, настоящее, пропустило удар. Я сжал подлокотники кресла."}, {"type": "dialogue", "speaker": "Рэй", "text": "В чем дело, док? Есть проблема?"}, {"type": "narration", "speaker": null, "text": "Арден вздрогнула, словно я вывел ее из транса, и быстро тряхнула головой, натягивая на лицо профессиональную улыбку."}, {"type": "dialogue", "speaker": "Доктор Касс Арден", "text": "Нет-нет, все в порядке. Просто... артефакт данных. Забудь. Все показатели в зеленой зоне. Идеально."}, {"type": "narration", "speaker": null, "text": "Она нажала кнопку на консоли."}, {"type": "dialogue", "speaker": "Доктор Касс Арден", "text": "Поздравляю, Чистильщик. Ты полностью готов к службе."}, {"type": "narration", "speaker": null, "text": "Волна облегчения прокатилась по телу, смывая напряжение. Я выдохнул."}, {"type": "thought", "speaker": "Рэй", "text": "Пронесло."}, {"type": "narration", "speaker": null, "text": "Доктор Арден тем временем извлекла из щели терминала тонкую пластиковую карту — сертификат о боеготовности."}, {"type": "narration", "speaker": null, "text": "Она протянула его мне, когда я уже начал отсоединять кабели."}, {"type": "dialogue", "speaker": "Доктор Касс Арден", "text": "Держи. Хотя, знаешь, что любопытно?"}, {"type": "dialogue", "speaker": "Рэй", "text": "Что?"}, {"type": "dialogue", "speaker": "Доктор Касс Арден", "text": "В твоих системах есть несколько... недокументированных особенностей. Очень эффективных, судя по тестам. Должно быть, новое обновление для элитных оперативников."}, {"type": "narration", "speaker": null, "text": "Слово 'недокументированных' повисло в стерильном воздухе, нарушая его идеальную чистоту."}, {"type": "thought", "speaker": "Рэй", "text": "Недокументированных? Что это значит?"}, {"type": "dialogue", "speaker": "Рэй", "text": "Я не получал уведомлений об обновлениях. Что за особенности?"}, {"type": "dialogue", "speaker": "Доктор Касс Арден", "text": "Понятия не имею. Это выше моего уровня допуска. Наверное, что-то от R&D. Не бери в голову, показатели-то отличные."}, {"type": "narration", "speaker": null, "text": "Она пожала плечами, но избегала смотреть мне в глаза."}, {"type": "narration", "speaker": null, "text": "Я взял сертификат. Пластик казался тяжелее обычного. Цель была достигнута, я снова в строю."}, {"type": "thought", "speaker": "Рэй", "text": "Но почему тогда это чувство... тревоги? Словно в идеально отлаженный механизм попала песчинка."}, {"type": "narration", "speaker": null, "text": "Я поднял свою кибернетическую руку, рассматривая переплетение синтетических мышц и серых бронепластин."}, {"type": "thought", "speaker": "Рэй", "text": "Что в тебе скрыто, о чем я не знаю? Что скрывает 'Эгида'?"}, {"type": "narration", "speaker": null, "text": "Я кивнул Арден на прощание и направился к выходу из отсека."}, {"type": "narration", "speaker": null, "text": "Облегчение испарилось без следа, оставив после себя холодное, липкое подозрение."}, {"type": "narration", "speaker": null, "text": "Слова доктора крутились в голове, запуская процесс, который я еще не мог ни осознать, ни остановить."}], "choices": [], "summary": "Рэй успешно проходит плановое техобслуживание, подтверждая свою боеготовность. Однако, доктор Арден упоминает 'недокументированные особенности' в его имплантах, что зарождает в Рэе первое семя сомнения и тревоги, несмотря на полученный допуск к службе.", "branch_id": "main", "branch_order": 1}, "scene_002": {"id": "scene_002", "location": "Кабинет директора Валериуса", "pov_character": "Рэй", "present_characters": ["Рэй", "Валериус"], "lines": [{"type": "narration", "speaker": null, "text": "Я кивнул Арден на прощание и направился к выходу из технического отсека. Облегчение от диагностики испарилось без следа, оставив после себя холодное, липкое подозрение."}, {"type": "thought", "speaker": "Рэй", "text": "«Недокументированные особенности»... Слова доктора крутились в голове, запуская процесс, который я еще не мог ни осознать, ни остановить."}, {"type": "narration", "speaker": null, "text": "Вызов от директора Валериуса пришел на мой нейроинтерфейс — сухой и безапелляционный. Я сменил стерильные коридоры медблока на полированный хром и стекло корпоративных этажей. Скоростной лифт беззвучно вознес меня на самый верхний уровень башни 'Эгиды', туда, где воздух был разрежен от власти."}, {"type": "narration", "speaker": null, "text": "Двери в кабинет директора разъехались с едва слышным шипением. Пространство было огромным и почти пустым. Одну стену полностью заменяло панорамное окно, за которым в неоновом мареве тонул ночной город. Символ абсолютного контроля."}, {"type": "narration", "speaker": null, "text": "Директор Валериус стоял спиной ко мне, темным силуэтом на фоне огней мегаполиса. Его внимание было приковано к голографическому дисплею, парящему в воздухе."}, {"type": "dialogue", "speaker": "Валериус", "text": "Чистильщик Рэй. Прошел техобслуживание. Статус: боеготов."}, {"type": "narration", "speaker": null, "text": "Он говорил это не мне, а пустоте. Констатация факта, будто зачитывал инвентарную ведомость."}, {"type": "thought", "speaker": "Рэй", "text": "Ни приветствия. Ни вопроса о самочувствии. Я — просто актив на балансе корпорации."}, {"type": "dialogue", "speaker": "Валериус", "text": "Есть работа."}, {"type": "narration", "speaker": null, "text": "Жестом он развернул ко мне часть дисплея. На нем возникло досье: фотография бледного мужчины с аристократическими чертами лица и горящими глазами. Под фото мигала красная надпись: 'АНОМАЛИЯ. КЛАСС: АРИСТОКРАТ'."}, {"type": "dialogue", "speaker": "Валериус", "text": "Эта особь появилась в Нижнем Гелиосе неделю назад. Вампир. Аналитики связывают его появление с недавней серией исчезновений людей в этом секторе. Пропало двенадцать гражданских. Чистая работа, никаких следов."}, {"type": "thought", "speaker": "Рэй", "text": "«Связывают»... Это предположение или факт?"}, {"type": "narration", "speaker": null, "text": "Валериус смахнул досье, и дисплей погас. Он медленно повернулся. Его глаза, усиленные дорогими имплантами, были холодными и пустыми, как космос за окном."}, {"type": "dialogue", "speaker": "Валериус", "text": "Приказ: найти и ликвидировать цель."}, {"type": "narration", "speaker": null, "text": "Он сделал паузу, давая словам впитаться в тишину кабинета."}, {"type": "dialogue", "speaker": "Валериус", "text": "Любой ценой."}, {"type": "narration", "speaker": null, "text": "Последние два слова прозвучали как щелчок затвора. Вопреки годам тренировок и вшитым в подкорку протоколам, я помедлил с ответом."}, {"type": "dialogue", "speaker": "Рэй", "text": "Сэр... есть подтверждение, что именно он виновен, а не другая аномалия? Разведка предоставила прямые доказательства?"}, {"type": "narration", "speaker": null, "text": "Вопрос сорвался с языка прежде, чем я успел его остановить. Воздух в кабинете мгновенно похолодел. Выражение лица Валериуса не изменилось, но что-то в его взгляде стало острее, опаснее."}, {"type": "dialogue", "speaker": "Валериус", "text": "Твоя задача — исполнять приказы, Чистильщик, а не проводить дознание."}, {"type": "narration", "speaker": null, "text": "Он сделал шаг ко мне, сокращая дистанцию."}, {"type": "dialogue", "speaker": "Валериус", "text": "Или техобслуживание выявило проблемы с твоими протоколами лояльности?"}, {"type": "thought", "speaker": "Рэй", "text": "Угроза. Прямая и неприкрытая. Он связывает мои сомнения с неисправностью имплантов. Значит, Арден была права."}, {"type": "narration", "speaker": null, "text": "Холод пробежал по моей кибернетической руке. Я сжал ее в кулак, ощущая, как сервоприводы напряглись под синтетической кожей."}, {"type": "dialogue", "speaker": "Валериус", "text": "Корпорации нужны результаты, Рэй. А мне нужны исполнители, а не философы. От успеха этой миссии зависит не только безопасность сектора, но и твоя дальнейшая карьера."}, {"type": "thought", "speaker": "Рэй", "text": "Он загнал меня в угол. Либо подчиняйся, либо станешь проблемой, которую нужно устранить."}, {"type": "narration", "speaker": null, "text": "Я подавил поднимающуюся волну протеста. Выпрямился, принимая стойку 'смирно'."}, {"type": "dialogue", "speaker": "Рэй", "text": "Так точно, директор. Приказ принят."}, {"type": "narration", "speaker": null, "text": "Мой голос прозвучал ровно и четко. Голос идеального солдата. На долю секунды на губах Валериуса промелькнуло нечто похожее на удовлетворенную улыбку."}, {"type": "dialogue", "speaker": "Валериус", "text": "Вот и хорошо. Не разочаруй корпорацию, Рэй. Свободен."}, {"type": "narration", "speaker": null, "text": "Он отвернулся, снова устремив взгляд на город. Я развернулся и молча вышел из кабинета, чувствуя его холодный взгляд на своей спине."}, {"type": "thought", "speaker": "Рэй", "text": "Приказ принят. Но впервые за всю службу я чувствовал не праведный гнев, а тяжесть чужой лжи на своих плечах."}, {"type": "narration", "speaker": null, "text": "Двери за моей спиной закрылись, отрезая меня от вершины власти. Впереди был спуск вниз, в неоновые джунгли Нижнего Гелиоса."}], "choices": [], "summary": "После тревожного разговора с доктором, Рэй вызван к директору Валериусу. В его подавляющем кабинете Рэй получает приказ ликвидировать вампира-аристократа, которого бездоказательно связывают с исчезновениями людей. Когда Рэй проявляет малейшее сомнение, Валериус угрожающе ставит под вопрос его лояльность, намекая на контроль через импланты. Загнанный в угол, Рэй принимает миссию, но его подозрения в отношении 'Эгиды' перерастают в уверенность, что корпорация скрывает правду.", "branch_id": "main", "branch_order": 2}, "scene_003": {"id": "scene_003", "location": "Бронетранспортер 'Чистильщиков'", "pov_character": "Рэй", "present_characters": ["Рэй", "Элиас Грей", "Гриз", "Водитель"], "lines": [{"type": "narration", "speaker": null, "text": "Спуск из парящего в облаках кабинета Валериуса был похож на падение. Грави-лифт бесшумно нес меня сквозь десятки этажей корпоративного рая в сырое, гудящее чрево города."}, {"type": "narration", "speaker": null, "text": "Внизу, в стерильном ангаре, уже ждал бронетранспортер «Химера». Мой отряд был в сборе. Молчаливые фигуры в черной тактической броне, лица скрыты за глухими шлемами. Я кивнул им, и мы погрузились внутрь."}, {"type": "narration", "speaker": null, "text": "Тяжелая рампа с лязгом закрылась, отсекая мир штаб-квартиры. Машина тронулась, вливаясь в бесконечный поток огней Нижнего Гелиоса."}, {"type": "thought", "speaker": "Рэй", "text": "«Протоколы лояльности». Слова Валериуса стучали в висках в такт с мерным гулом двигателя. Он не угрожал. Он констатировал факт. Моя верность — это просто программа, которую можно отладить."}, {"type": "narration", "speaker": null, "text": "Я смотрел в узкую бойницу на проносящиеся мимо неоновые вывески. Дождь размазывал их по бронестеклу, превращая город в калейдоскоп кроваво-красных и ядовито-зеленых пятен. Внутри было тесно и пахло озоном от работающей электроники и перегретым металлом."}, {"type": "narration", "speaker": null, "text": "Напряженное молчание давило. Каждый боец был погружен в себя, проверяя оружие и системы. Рутина перед погружением в ад."}, {"type": "narration", "speaker": null, "text": "Тишину нарушил щелчок предохранителя. Новичок, Элиас Грей, нервно передернул затвор своей винтовки."}, {"type": "dialogue", "speaker": "Элиас Грей", "text": "Командир… то, что говорят о них… об аристократах… это правда? Что они могут… залезть в голову?"}, {"type": "narration", "speaker": null, "text": "Его голос, усиленный воксом шлема, звучал слишком молодо. Слишком неуверенно."}, {"type": "narration", "speaker": null, "text": "Сидящий напротив ветеран по прозвищу Гриз хмыкнул. Его шлем был испещрен царапинами — следами десятков таких вылазок."}, {"type": "dialogue", "speaker": "Гриз", "text": "Сказки для необработанных, салага. Промывка мозгов — это наш профиль, а не их. Наши импланты блокируют любую ментальную дрянь. Эта тварь даже пискнуть в твоей башке не сможет."}, {"type": "narration", "speaker": null, "text": "Элиас не выглядел убежденным. Он повернул шлем ко мне, и я почувствовал его взгляд, ищущий поддержки, а не насмешки."}, {"type": "thought", "speaker": "Рэй", "text": "Он ждет от меня правды. А у меня ее нет. Только ложь, в которую я и сам перестаю верить. Ложь, которая защищает его."}, {"type": "narration", "speaker": null, "text": "Я заставил себя выпрямиться, надевая маску уверенности, которую так ждал увидеть новичок."}, {"type": "dialogue", "speaker": "Рэй", "text": "Гриз прав. Все эти россказни про гипноз и магию — суеверия из темных веков. У нас есть технология. Она — наше превосходство. Запомни это."}, {"type": "narration", "speaker": null, "text": "Произнося эти слова, я невольно коснулся пальцами своей кибернетической руки. Гладкий, холодный металл. Моя сила. Моя клетка."}, {"type": "thought", "speaker": "Рэй", "text": "Превосходство... Какое лицемерие. Я сам цепной пес, и поводок от этой руки ведет прямо в кабинет Валериуса. И сейчас я навязываю этот же ошейник новичку."}, {"type": "dialogue", "speaker": "Рэй", "text": "Повторим данные. Цель — вампир-аристократ, класс угрозы «Альфа». По данным «Эгиды», он ответственен за серию недавних исчезновений в этом секторе. Жертв находят полностью обескровленными."}, {"type": "dialogue", "speaker": "Гриз", "text": "Значит, очередной дикий монстр. Выследить, ликвидировать. Работа как работа. Главное, чтобы салага штаны не намочил, когда увидит, что от людей остается."}, {"type": "thought", "speaker": "Рэй", "text": "«По данным 'Эгиды'». Ни одного доказательства. Ни одной улики. Просто приказ. Просто очередная 'аномалия', которую нужно стереть. А что, если они снова лгут? Что, если там не монстр?"}, {"type": "narration", "speaker": null, "text": "Я снова посмотрел на Элиаса. Его страх был реален. И он был моей ответственностью. Если он погибнет, следуя моей лжи, это будет на мне."}, {"type": "dialogue", "speaker": "Рэй", "text": "Элиас."}, {"type": "dialogue", "speaker": "Элиас Грей", "text": "Да, командир?"}, {"type": "dialogue", "speaker": "Рэй", "text": "Забудь слухи и забудь Гриза. Доверяй своему сканеру и моим приказам. Держись рядом со мной, как тень. Прикрывай мой сектор. Не стреляй, пока я не скомандую. Понял?"}, {"type": "dialogue", "speaker": "Элиас Грей", "text": "Так точно, командир. Понял."}, {"type": "narration", "speaker": null, "text": "В его голосе прозвучало облегчение. Я дал ему простой, четкий приказ. То, что спасает жизни, в отличие от корпоративных мантр."}, {"type": "thought", "speaker": "Рэй", "text": "И то, что сделает его ранение моей виной, если что-то пойдет не так. Я только что поставил на него свою метку."}, {"type": "narration", "speaker": null, "text": "Бронетранспортер резко качнулся и сбавил ход, съезжая с основной магистрали в темный, заваленный мусором переулок."}, {"type": "dialogue", "speaker": "Водитель", "text": "Прибыли в точку высадки. Нижний Гелиос. Добро пожаловать в канаву."}, {"type": "narration", "speaker": null, "text": "Красные лампы в салоне замигали, сигнализируя о готовности к высадке. Бойцы поднялись, оружие наизготовку. Лязгнули магнитные замки на ботинках."}, {"type": "narration", "speaker": null, "text": "С гидравлическим шипением аппарель пошла вниз, впуская в стерильный салон какофонию ночного города: шум дождя, гул неона и далекий вой сирен."}, {"type": "dialogue", "speaker": "Рэй", "text": "Пошли. Движемся."}], "choices": [], "summary": "По пути на миссию в Нижний Гелиос, Рэй сталкивается с напряжением в отряде. Он успокаивает напуганного новичка Элиаса, используя корпоративную пропаганду, но внутренне страдает от собственного лицемерия и растущих сомнений в 'Эгиде'. Чтобы защитить Элиаса и подготовиться к предстоящему выбору, Рэй берет его под личную опеку, приказывая держаться рядом. Сцена заканчивается прибытием отряда на место и подготовкой к высадке.", "branch_id": "main", "branch_order": 3}, "scene_004": {"id": "scene_004", "location": "Заброшенный готический театр", "pov_character": "Рэй", "present_characters": ["Рэй", "Элиас Грей", "Боец Гамма"], "lines": [{"type": "narration", "speaker": null, "text": "С шипением гидравлики аппарель бронетранспортера опустилась, выплюнув отряд в неоновый сумрак. Дождь тут же вцепился в тактическую броню холодными иглами. Мы оставили ревущий проспект позади, углубившись в переулок, где свет рекламных вывесок тонул, не в силах одолеть тьму."}, {"type": "narration", "speaker": null, "text": "Перед нами возвышался он. Заброшенный готический театр. Клык досингулярной эпохи, впившийся в кибернетические десны мегаполиса. Его каменные горгульи, изъеденные кислотными дождями, слепо взирали на нас со своих карнизов."}, {"type": "thought", "speaker": "Рэй", "text": "Чужеродное тело. Как и мы здесь."}, {"type": "dialogue", "speaker": "Рэй", "text": "Группа, построение «Клин». Входим. Полный спектр сканирования. Игнорировать фантомные сигналы, ищу только стабильную био-сигнатуру. Четко."}, {"type": "narration", "speaker": null, "text": "Тяжелые дубовые двери, окованные почерневшим металлом, поддались с протяжным, мучительным стоном. В нос ударил густой, спертый воздух — смесь вековой пыли, гниющего бархата и озона, странного послевкусия работающей электроники в древнем склепе."}, {"type": "thought", "speaker": "Рэй", "text": "Тихо. Слишком тихо для логова зверя. Звери не любят тишину."}, {"type": "narration", "speaker": null, "text": "Лучи наших фонарей были хирургами, вскрывающими мрак. Они выхватывали из темноты обрывки былой роскоши: истлевшие кресла в партере, позолоту, покрытую седой паутиной, разбитые зеркала, отражавшие лишь наши искаженные силуэты."}, {"type": "dialogue", "speaker": "Рэй", "text": "Элиас, ко мне. В двух метрах, не дальше. Дублируй мой сектор. Никакой самодеятельности, понял?"}, {"type": "narration", "speaker": null, "text": "Новичок торопливо кивнул, его дыхание срывалось в комм-канале. Зеленый огонек его сканера нервно метался по сторонам."}, {"type": "dialogue", "speaker": "Элиас Грей", "text": "Есть, командир. Сильные помехи... будто само здание... живое."}, {"type": "dialogue", "speaker": "Рэй", "text": "Здания не бывают живыми, Элиас. Это просто статика. Фильтруй шум, доверяй только приборам. И мне."}, {"type": "thought", "speaker": "Рэй", "text": "Он напуган до смерти. Я привел его сюда. И я должен его отсюда вывести. Живым. Это теперь мой единственный приказ."}, {"type": "narration", "speaker": null, "text": "Продвигаясь по главному фойе, я заметил на одном из бархатных кресел то, что выбивалось из общей картины разрухи. Не кости, не следы борьбы."}, {"type": "narration", "speaker": null, "text": "Старая книга в кожаном переплете. Раскрытая. Я провел по ней лучом фонаря. Стихи."}, {"type": "thought", "speaker": "Рэй", "text": "«Кровожадная аномалия», значит? Та, что читает стихи в тишине? Валериус бы сжег это место вместе с книгами, даже не открыв их. Просто потому, что мог."}, {"type": "narration", "speaker": null, "text": "Я невольно коснулся пальцами своей кибернетической руки. Холодный, чужой металл. Моя цепь. Моя клетка."}, {"type": "thought", "speaker": "Рэй", "text": "«Ликвидировать любой ценой». Приказ директора звучал в голове как вирус, как строка вредоносного кода, который я не могу стереть."}, {"type": "narration", "speaker": null, "text": "На мгновение мне показалось, что сервоприводы в предплечье свело едва заметным спазмом. Просто фантомное ощущение. Наверное."}, {"type": "dialogue", "speaker": "Рэй", "text": "Группы, разделиться. Альфа — левый фланг, Гамма — правый. Мы с Элиасом идем к сцене. Докладывать по контакту."}, {"type": "narration", "speaker": null, "text": "Внезапно Элиас резко вскинул винтовку, целясь в темноту бокового прохода."}, {"type": "dialogue", "speaker": "Элиас Грей", "text": "Движение! Справа!"}, {"type": "narration", "speaker": null, "text": "Я молниеносно положил руку на ствол его оружия, жестко, но плавно опуская его вниз."}, {"type": "dialogue", "speaker": "Рэй", "text": "Отставить. Это тень от портьеры колыхнулась от сквозняка. Смотри на тактический дисплей, Элиас. Он пуст. Дыши. Медленно."}, {"type": "thought", "speaker": "Рэй", "text": "Еще один такой срыв в бою, и он покойник. Или я. Валериусу будет все равно, чей мешок привезут на базу."}, {"type": "narration", "speaker": null, "text": "Одна из боковых дверей вела в гримерку. Здесь запах пыли смешивался с ароматом старого дерева и пудры. Никаких следов бойни. Никакой крови."}, {"type": "narration", "speaker": null, "text": "На пыльном столике перед треснувшим зеркалом лежала скрипка. Рядом — несколько хрустальных бокалов с высохшими остатками темно-красной жидкости."}, {"type": "thought", "speaker": "Рэй", "text": "Вино? Или... неважно. Это не логово. Это дом. Убежище."}, {"type": "narration", "speaker": null, "text": "В этот момент сомнения, грызшие меня с самого брифинга, кристаллизовались в холодную, острую уверенность. Пропаганда «Эгиды» — ложь. Наглая, циничная ложь, которую я сам повторял Элиасу всего час назад."}, {"type": "thought", "speaker": "Рэй", "text": "Нас послали не на зачистку. Нас послали на убийство. И я тот, кто должен нажать на курок."}, {"type": "narration", "speaker": null, "text": "Внезапный, чистый сигнал в общем комм-канале прервал мои мысли. Все сканеры отряда синхронно ожили, показывая одну и ту же точку."}, {"type": "dialogue", "speaker": "Боец Гамма", "text": "Командир, есть контакт! Сильная, стабильная био-сигнатура. Одна. Не движется."}, {"type": "dialogue", "speaker": "Рэй", "text": "Координаты?"}, {"type": "dialogue", "speaker": "Боец Гамма", "text": "Центр главной сцены. Прямо за занавесом."}, {"type": "thought", "speaker": "Рэй", "text": "Оно не прячется. Оно ждет."}, {"type": "dialogue", "speaker": "Рэй", "text": "Всем группам — ко мне. Занять позиции в партере. Огонь только по моей команде. Повторяю, ТОЛЬКО по моей команде."}, {"type": "narration", "speaker": null, "text": "Через минуту отряд бесшумно рассредоточился среди истлевших кресел, держа под прицелом тяжелый, пыльный бархатный занавес."}, {"type": "narration", "speaker": null, "text": "Я обернулся к Элиасу. В его глазах, расширенных за стеклом визора, я увидел не просто страх. Там была отчаянная надежда, направленная на меня."}, {"type": "thought", "speaker": "Рэй", "text": "Вера в командира, который знает, что делает. Вера, которую я вот-вот предам, выполнив приказ. Или предам, не выполнив его."}, {"type": "narration", "speaker": null, "text": "Это чувство — ответственности за чужую жизнь — оказалось тяжелее любого оружия и сильнее любого приказа «Эгиды»."}, {"type": "narration", "speaker": null, "text": "Я снова посмотрел на сцену. На занавес, за которым нас ждала цель, читающая стихи и играющая на скрипке."}, {"type": "narration", "speaker": null, "text": "Я поднял руку, сжав кулак — универсальный жест готовности к штурму."}, {"type": "thought", "speaker": "Рэй", "text": "Представление начинается. И я не знаю, кто здесь зритель, а кто — актер."}, {"type": "narration", "speaker": null, "text": "Пальцы замерли в миллиметре от кнопки, активирующей штурм. Тишина в зале стала оглушающей, звенящей, как натянутая струна."}], "choices": [], "summary": "Отряд Рэя входит в заброшенный готический театр. Вместо ожидаемого логова монстра они находят признаки цивилизованной жизни — книги и музыкальные инструменты. Это открытие превращает сомнения Рэя в уверенность, что миссия — не зачистка, а убийство. Его чувство ответственности за новичка Элиаса обостряется до предела, вступая в конфликт с долгом. В финале сцены отряд обнаруживает, что цель ждет их за занавесом главной сцены, и готовится к столкновению.", "branch_id": "main", "branch_order": 4}, "scene_005": {"id": "scene_005", "location": "Заброшенный готический театр", "pov_character": "Рэй", "present_characters": ["Рэй", "Элара", "Элиас Грей"], "lines": [{"type": "narration", "speaker": null, "text": "Я сделал шаг вперед, пересекая невидимую границу между зрительным залом и сценой. Пыль, потревоженная моими ботинками, закружилась в единственном луче света, пробивавшемся откуда-то сверху."}, {"type": "narration", "speaker": null, "text": "Мои аудиосенсоры улавливали лишь шелест пыли и гул собственных систем. Чужеродный звук в этом царстве тишины."}, {"type": "narration", "speaker": null, "text": "Там, в центре сцены, она ждала. Не пряталась, не скалилась, как на агитплакатах 'Эгиды'."}, {"type": "narration", "speaker": null, "text": "Женщина в длинном темном платье, которое, казалось, было соткано из тех же теней, что сгущались по углам. Элара. Ее осанка была аристократичной, а на лице играла легкая, почти скучающая улыбка."}, {"type": "thought", "speaker": "Рэй", "text": "Никаких клыков, никакой звериной ярости. Только спокойствие, которое пугало больше, чем любой боевой клич."}, {"type": "narration", "speaker": null, "text": "Протокол требовал действовать. Сомнения — роскошь. Я рванулся вперед, сокращая дистанцию за долю секунды. Кибернетическая рука, гудя сервоприводами, пошла на перехват."}, {"type": "narration", "speaker": null, "text": "Удар, способный пробить бронепластину, рассек лишь воздух."}, {"type": "narration", "speaker": null, "text": "Элара не отпрыгнула — она утекла в сторону, ее движение было плавным и нечеловечески быстрым, словно кадр, вырезанный из реальности. Она оказалась в паре метров от меня, изящно поправив складку на платье."}, {"type": "dialogue", "speaker": "Элара", "text": "Как предсказуемо. Все твои выпады просчитаны, каждая мышца движется по команде."}, {"type": "dialogue", "speaker": "Элара", "text": "Железная кукла."}, {"type": "thought", "speaker": "Рэй", "text": "Ее слова — яд. Точный укол в самое сердце моих собственных сомнений."}, {"type": "dialogue", "speaker": "Элара", "text": "Скажи, ты хоть помнишь, как двигаться без их команд? Или в тебе не осталось ничего, кроме проводов?"}, {"type": "narration", "speaker": null, "text": "Злость придала движениям ярости. Я снова атаковал, серия быстрых, выверенных ударов, каждый из которых отточен тысячами часов тренировок. Но это был танец, в котором я был неуклюжим механическим партнером."}, {"type": "narration", "speaker": null, "text": "Мой тактический визор не успевал обновить траекторию. Цель мерцала, рассыпаясь на пиксели помех, а потом снова возникала там, где ее быть не должно."}, {"type": "narration", "speaker": null, "text": "Она порхала вокруг, используя декорации. Скользнула за бархатную кулису, и мои сканеры на мгновение потеряли цель. Метнулась в тень на галерке, заставив меня впустую разрядить плазменный заряд в вековую пыль."}, {"type": "thought", "speaker": "Рэй", "text": "Она не сражается. Она играет. Изучает. Тестирует пределы моей клетки из хрома и проводов."}, {"type": "narration", "speaker": null, "text": "Внезапно в ухе щелкнул комм. Тревожный, срывающийся голос Элиаса."}, {"type": "dialogue", "speaker": "Элиас Грей", "text": "Командир, у вас проблемы! Я иду на помощь!"}, {"type": "dialogue", "speaker": "Рэй", "text": "Элиас, стоять! Это приказ!"}, {"type": "narration", "speaker": null, "text": "Но было поздно. Тяжелая дверь в зрительный зал со скрипом отворилась, и силуэт новичка, сжимающего винтовку, появился в проеме."}, {"type": "thought", "speaker": "Рэй", "text": "Черт. Нет. Только не он."}, {"type": "narration", "speaker": null, "text": "Мое внимание на долю секунды метнулось к парню. Этого хватило. Элара, до этого момента лишь игравшая, замерла. Ее скучающее выражение сменилось хищным интересом."}, {"type": "dialogue", "speaker": "Элара", "text": "А вот и слабое звено в твоей цепи."}, {"type": "narration", "speaker": null, "text": "Ярость затопила все. Протоколы, сомнения, страх — все сгорело в огне, раздутом угрозой Элиасу."}, {"type": "thought", "speaker": "Рэй", "text": "Я не дам ей его тронуть."}, {"type": "narration", "speaker": null, "text": "Я форсировал питание имплантов, выжимая из них максимум. И по нейроинтерфейсу ударил разряд статики. Не боль, а... ошибка. Неверный код. На мгновение визор подернулся рябью, а в кибер-руке прошел ледяной спазм."}, {"type": "thought", "speaker": "Рэй", "text": "Держись. Только продержись."}, {"type": "narration", "speaker": null, "text": "Я ринулся на нее для последнего, решающего удара. Рука занесена, пальцы сжимаются в кулак, способный проломить стену."}, {"type": "narration", "speaker": null, "text": "И в этот самый момент всё замерло."}, {"type": "narration", "speaker": null, "text": "Гудение сервоприводов оборвалось так резко, что в ушах зазвенела тишина. Индикаторы на предплечье погасли. Рука, моя гордость и главное оружие, безвольно повисла, мертвым куском металла."}, {"type": "narration", "speaker": null, "text": "Волна паралича от экстренного отключения системы сковала все тело."}, {"type": "thought", "speaker": "Рэй", "text": "Сбой... Нет... Это не сбой..."}, {"type": "narration", "speaker": null, "text": "Элара не стала тратить время на меня. С грацией, от которой по спине пробежал холод, она проскользнула мимо моей застывшей фигуры."}, {"type": "narration", "speaker": null, "text": "Элиас не успел даже вскрикнуть. Короткое, как взмах крыла, движение — и на его форме расцвело темное пятно. Он рухнул на пол, выронив винтовку."}, {"type": "narration", "speaker": null, "text": "Прежде чем исчезнуть в тенях, Элара наклонилась к моему уху. Ее дыхание было холодным, как склеп."}, {"type": "dialogue", "speaker": "Элара", "text": "Они лгут тебе, железный человек. Твои цепи крепче моих."}, {"type": "narration", "speaker": null, "text": "И она исчезла."}, {"type": "narration", "speaker": null, "text": "В тот же миг в руку вернулась жизнь. Системы перезагрузились с резким толчком, вырвав меня из паралича."}, {"type": "narration", "speaker": null, "text": "Я рухнул на одно колено, тяжело дыша. Взгляд метнулся от лужи крови, растекающейся под Элиасом, к пустому месту на сцене, где только что была она."}, {"type": "thought", "speaker": "Рэй", "text": "Миссия провалена. Боец ранен. Из-за меня. Из-за них."}, {"type": "narration", "speaker": null, "text": "Я смотрел на Элиаса, на его кровь, впитывающуюся в вековую пыль сцены."}, {"type": "thought", "speaker": "Рэй", "text": "Протокол требует доложить и ждать эвакуации. Вернуться к ним. К тем, кто дергает за ниточки. К тем, кто только что чуть не убил меня, а теперь будет 'спасать' его?"}, {"type": "thought", "speaker": "Рэй", "text": "Ее слова — 'твои цепи крепче моих' — горели в мозгу, как клеймо. Нет. Не к ним."}], "choices": [], "summary": "В заброшенном театре Рэй сталкивается с вампиром Эларой. Она оказывается не монстром, а грациозной противницей, которая насмехается над его 'механической' природой. Появление новичка Элиаса заставляет Рэя пойти на риск, но в решающий момент его кибернетическая рука отключается. Элара использует это, чтобы ранить Элиаса и, прежде чем исчезнуть, шепчет Рэю, что 'Эгида' лжет ему, оставляя его с раненым товарищем и тяжелым выбором.", "branch_id": "main", "branch_order": 5}, "scene_006": {"id": "scene_006", "location": "Заброшенный готический театр", "pov_character": "Рэй", "present_characters": ["Рэй", "Элиас Грей", "Элара"], "lines": [{"type": "narration", "speaker": null, "text": "Тишина. Густая, как бархат старых кулис. Она поглотила все — и шепот вампира, и эхо боя."}, {"type": "narration", "speaker": null, "text": "В воздухе смешались запахи: вековая пыль, резкий озон от перегретого металла моей руки и густой, тошнотворно-сладкий аромат крови."}, {"type": "thought", "speaker": "Рэй", "text": "Ее слова... 'Твои цепи крепче моих'... Они не просто звучат в голове. Они отпечатались на моих нейросхемах, как вирус."}, {"type": "narration", "speaker": null, "text": "Я посмотрел на свою левую руку. Хромированная сталь, обычно безупречная, сейчас казалась тусклой и чужой. Я послал мысленный импульс, простейший из всех: сжать кулак."}, {"type": "narration", "speaker": null, "text": "Ответа не последовало. Ни малейшего движения. Словно я пытался отдать приказ статуе."}, {"type": "thought", "speaker": "Рэй", "text": "Давай же, кусок железа."}, {"type": "narration", "speaker": null, "text": "Я сконцентрировался, вложив в команду всю свою волю, как делал тысячи раз до этого."}, {"type": "narration", "speaker": null, "text": "Рука содрогнулась в чудовищном спазме. Пальцы скрючились, будто под разрядом тока. Острая, рваная боль пронзила все предплечье, заставив меня скрипнуть зубами."}, {"type": "thought", "speaker": "Рэй", "text": "Не сбой. Не поломка. Это... пульт управления. Кто-то дернул за невидимый рычаг. Мое тело — не мое."}, {"type": "narration", "speaker": null, "text": "Цепь. Вот она. Я ее почувствовал."}, {"type": "narration", "speaker": null, "text": "Тихий, сдавленный стон вернул меня в реальность. Я резко обернулся."}, {"type": "narration", "speaker": null, "text": "Элиас. Он лежал на сцене, в центре расползающегося темного пятна. Слишком большого. Слишком быстро растущего."}, {"type": "narration", "speaker": null, "text": "Я рухнул рядом на колени, не обращая внимания на протестующую боль в руке. Рана на его боку была жуткой, не похожей ни на что, что я видел."}, {"type": "thought", "speaker": "Рэй", "text": "Никаких рваных краев от клинка. Никакого входного отверстия от пули."}, {"type": "narration", "speaker": null, "text": "Ткань его униформы и плоть под ней почернели, словно их коснулось что-то абсолютно холодное, выжигающее саму жизнь. Края раны мерцали слабым, маслянистым светом."}, {"type": "thought", "speaker": "Рэй", "text": "Магия. Чистая, неприкрытая. Наши инструкции — посмешище против такого."}, {"type": "narration", "speaker": null, "text": "Моя здоровая правая рука сорвала с пояса аптечку. Я вскрыл ампулу с коагулянтом, вогнал инъектор ему в шею. Затем, пытаясь прижать рану парализованной левой рукой, я почувствовал, как она снова дернулась, едва не ударив его."}, {"type": "narration", "speaker": null, "text": "Я отдернул ее, с ненавистью глядя на бесполезный металл. Правой рукой я выдавил на рану герметизирующую пену."}, {"type": "narration", "speaker": null, "text": "Пена зашипела, но вместо того, чтобы застыть, она пошла черными пузырями и опала, превратившись в серую, бесполезную жижу."}, {"type": "thought", "speaker": "Рэй", "text": "Не работает. Стандартный протокол 'Эгиды' бесполезен. Они послали нас сюда, зная это?"}, {"type": "narration", "speaker": null, "text": "Глаза Элиаса распахнулись. В них больше не было страха, только боль и подступающая пустота."}, {"type": "dialogue", "speaker": "Элиас Грей", "text": "Ком... командир... холодно... Вы же... вы же говорили... держаться рядом..."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я здесь, Элиас. Я рядом. Держись."}, {"type": "thought", "speaker": "Рэй", "text": "Я лгу. Лгу ему в лицо, как 'Эгида' лгала мне годами. Он умирает. Из-за меня."}, {"type": "narration", "speaker": null, "text": "Его слова стали последним щелчком. Пазл сложился в уродливую, чудовищную картину."}, {"type": "thought", "speaker": "Рэй", "text": "Сбой моей руки. Точно в тот момент, когда я мог блокировать удар. Когда Элиас был беззащитен."}, {"type": "thought", "speaker": "Рэй", "text": "Ранение Элиаса. Не меня. Его. Новичка, за которого я отвечаю. Чтобы вина была максимальной."}, {"type": "thought", "speaker": "Рэй", "text": "Слова Элары. 'Они лгут тебе'. Это было не хвастовство. Это было предупреждение."}, {"type": "thought", "speaker": "Рэй", "text": "Это не бой. Это была казнь. И я был инструментом."}, {"type": "narration", "speaker": null, "text": "Холодная, острая ярость вытеснила боль и страх. Вина легла на плечи свинцовым плащом."}, {"type": "narration", "speaker": null, "text": "Моя правая рука поднялась к запястью, где под кожей светился интерфейс комлинка. Протокол 11-Б: 'При потере боеспособности члена отряда, доложить и ожидать эвакуации'."}, {"type": "narration", "speaker": null, "text": "Палец замер над светящимся логотипом 'Эгиды'."}, {"type": "thought", "speaker": "Рэй", "text": "Доложить. И что? Прилетит шаттл. Они заберут его тело... или то, что от него останется. Заберут меня."}, {"type": "thought", "speaker": "Рэй", "text": "Я уже слышу голос Валериуса, гладкий и холодный, как полированная сталь. 'Сожалею о потере, командир. Боец Грей — еще одна жертва в войне с аномалиями. Его смерть не будет напрасной'."}, {"type": "thought", "speaker": "Рэй", "text": "Они заберут мою руку на 'диагностику'. Найдут 'скрытый дефект'. Сотрут логи. И вернут мне ее, затянув цепи еще туже."}, {"type": "thought", "speaker": "Рэй", "text": "А Элиас? Он станет оправданием. 'Смотрите, как опасны эти твари! Нам нужно больше чистильщиков! Больше контроля!' Его жизнь — просто рекламный ролик для 'Эгиды'."}, {"type": "narration", "speaker": null, "text": "Я посмотрел на Элиаса. Его дыхание стало едва заметным, прерывистым. Он уже не смотрел на меня. Он смотрел сквозь меня, в пустоту."}, {"type": "thought", "speaker": "Рэй", "text": "Отдать его им? Системе, которая использовала его как приманку? Вернуться в клетку и ждать, когда дернут за мои ниточки в следующий раз?"}, {"type": "thought", "speaker": "Рэй", "text": "Нет. Никогда."}, {"type": "narration", "speaker": null, "text": "В глубине памяти, в мусоре из барных сплетен и уличных слухов, всплыло слово: 'риппердоки'."}, {"type": "narration", "speaker": null, "text": "Подпольные хирурги Нижнего Гелиоса. Гении и мясники, работающие в подвалах, залитых неоном и антисептиками. Говорили, они могут всё. Снять корпоративные замки с имплантов. Починить нелегальный хром. И... справиться с ранами, которые не берут стандартные медикаменты."}, {"type": "thought", "speaker": "Рэй", "text": "Это безумие. Прямое нарушение десятка протоколов. Дезертирство. Через час 'Эгида' повесит на меня красную метку. За мной пошлют отряд. Лучший отряд."}, {"type": "narration", "speaker": null, "text": "Тело Элиаса мелко задрожало в предсмертной агонии."}, {"type": "thought", "speaker": "Рэй", "text": "Но это шанс. Единственный. Для него. И, может быть, для меня. Шанс снять эти цепи по-настоящему."}, {"type": "narration", "speaker": null, "text": "Два пути. Два ада на выбор."}, {"type": "narration", "speaker": null, "text": "Первый — подчиниться. Нажать на кнопку. Вернуться в штаб-квартиру 'Эгиды' и отдать им Элиаса. Это путь протокола. Путь раба, который знает своего хозяина."}, {"type": "narration", "speaker": null, "text": "Второй — взбунтоваться. Стать дезертиром. Взвалить Элиаса на плечи и уйти в грязные, беззаконные переулки Нижнего Гелиоса. Это путь в никуда. Путь мишени. Но это мой путь."}, {"type": "thought", "speaker": "Рэй", "text": "Приказ или совесть? Цепи или свобода?"}, {"type": "narration", "speaker": null, "text": "Мой палец так и висел над светящимся комлинком. Я смотрел на умирающего парня, за которого был в ответе. Выбор перестал быть выбором. Он стал необходимостью."}], "choices": [{"id": "choice_03", "appears_after_line": 48, "options": [{"id": "opt_main", "text": "Каэл возвращается с проваленной миссией и раненым бойцом", "leads_to_scene_id": "scene_007", "leads_to_branch_id": "main", "is_fake": false}, {"id": "opt_branch_03", "text": "Цена спасения", "leads_to_scene_id": "branch_03_scene_001", "leads_to_branch_id": "branch_03", "is_fake": false}]}], "summary": "После отказа кибернетической руки и ранения Элиаса, Рэй осознает, что 'Эгида' намеренно подставила его отряд. Стандартные медикаменты бессильны против магической раны, и Рэй понимает, что следование протоколу равносильно смертному приговору для новичка. Разрываясь между яростью, виной и отчаянием, он стоит перед решающим выбором: подчиниться и вернуться на базу к своим тюремщикам или стать дезертиром и попытаться спасти Элиаса в подпольных клиниках.", "branch_id": "main", "branch_order": 6}, "scene_007": {"id": "scene_007", "location": "Штаб-квартира корпорации 'Эгида'", "pov_character": "Рэй", "present_characters": ["Рэй", "Валериус"], "lines": [{"type": "narration", "speaker": null, "text": "Переход из готической тени театра в неоновый блеск башни 'Эгиды' был резким, как удар. Глайдер несся сквозь дождливые каньоны города, а я мог думать лишь о хриплом дыхании Элиаса у меня на плече."}, {"type": "thought", "speaker": "Рэй", "text": "Держись, парень. Просто держись. Они должны помочь. У них должны быть средства..."}, {"type": "narration", "speaker": null, "text": "С визгом тормозов мы остановились у подножия корпоративного монолита. Я вывалился из глайдера, почти роняя обмякшее тело напарника. Его кровь, пугающе темная, пропитала мой тактический жилет."}, {"type": "narration", "speaker": null, "text": "Автоматические двери разъехались, впуская меня в стерильную, оглушающую тишину. Белый мрамор, холодный свет, тихий гул систем. Ни единой души."}, {"type": "thought", "speaker": "Рэй", "text": "Логотип 'Эгиды' на стене — щит, оберегающий человечество. Какая ирония. Я принес сюда кровь и грязь, и этому месту это явно не нравится."}, {"type": "dialogue", "speaker": "Рэй", "text": "Медика! Срочно! Чистильщик ранен!"}, {"type": "narration", "speaker": null, "text": "Мой крик утонул в огромном пространстве. Я осторожно опустил Элиаса на ледяной пол."}, {"type": "dialogue", "speaker": "Рэй", "text": "Рана магическая! Стандартные регенераторы бесполезны! Ему нужен специалист по аномальным воздействиям!"}, {"type": "narration", "speaker": null, "text": "Цокот дорогих ботинок по мрамору. Из бокового коридора вышел он. Директор Валериус. В идеально отглаженном костюме, с лицом, высеченным из камня."}, {"type": "thought", "speaker": "Рэй", "text": "Он даже не смотрит на Элиаса. Его взгляд прикован ко мне. Словно я — грязь, которую занесли в его храм."}, {"type": "dialogue", "speaker": "Валериус", "text": "Оперативник Рэй. Объясните это нарушение эстетики моего холла."}, {"type": "dialogue", "speaker": "Рэй", "text": "Сэр, миссия провалена. Цель ушла. Элиас ранен. Моя рука... она отказала в бою."}, {"type": "narration", "speaker": null, "text": "Я поднял свой хромированный кулак, который всего час назад был бесполезным куском металла."}, {"type": "dialogue", "speaker": "Рэй", "text": "Имплант полностью отключился. В критический момент."}, {"type": "dialogue", "speaker": "Валериус", "text": "Мне уже поступил предварительный отчет с вашего комлинка, Рэй. Я в курсе."}, {"type": "narration", "speaker": null, "text": "Его голос был ровным, как поверхность замерзшего озера. Ни капли удивления или сочувствия."}, {"type": "dialogue", "speaker": "Валериус", "text": "Сбой классифицирован как ожидаемое боевое повреждение. Результат мощной магической интерференции. Это прописано в стандартных рисках."}, {"type": "thought", "speaker": "Рэй", "text": "Ложь. Наглая, ледяная, заготовленная заранее ложь. Вампирша... Элара... она предупреждала. 'Они лгут тебе'. Я не слушал."}, {"type": "narration", "speaker": null, "text": "Ярость вскипела, сметая остатки дисциплины."}, {"type": "dialogue", "speaker": "Рэй", "text": "Ожидаемое повреждение?!"}, {"type": "narration", "speaker": null, "text": "Я ткнул пальцем в сторону Элиаса, в его бледное лицо и чернеющую рану."}, {"type": "dialogue", "speaker": "Рэй", "text": "Вот это по-вашему 'ожидаемое'?! Нас отправили в ловушку! Вы знали, что импланты откажут!"}, {"type": "narration", "speaker": null, "text": "Валериус сделал едва заметный шаг ко мне. Его взгляд стал жестким, как сталь."}, {"type": "dialogue", "speaker": "Валериус", "text": "А вот это, Рэй, называется истерикой. Потерей контроля. Некомпетентностью."}, {"type": "narration", "speaker": null, "text": "Словно по команде, из коридора бесшумно выкатились медики в герметичных костюмах, с антигравитационными носилками."}, {"type": "dialogue", "speaker": "Валериус", "text": "Ваша эмоциональная нестабильность, оперативник, ставит под сомнение не только вашу лояльность, но и целостность вашей аугментации."}, {"type": "thought", "speaker": "Рэй", "text": "Вот оно. Угроза."}, {"type": "dialogue", "speaker": "Валериус", "text": "Дефекты проявляются по-разному. Сначала сбои в бою, затем... паранойя и обвинения в адрес командования. Мы списываем дефектные активы, Рэй. Без сожалений."}, {"type": "narration", "speaker": null, "text": "Удар. Точный, выверенный, прямо в самое больное место. Он не просто лгал. Он превращал правду в симптом моей неисправности."}, {"type": "thought", "speaker": "Рэй", "text": "Он говорит: 'Я знаю, что ты знаешь. И я могу объявить тебя бракованным и списать в утиль'."}, {"type": "narration", "speaker": null, "text": "Я сжал зубы так, что заскрипели сервоприводы в челюсти. Ярость сменилась холодным, кристальным пониманием."}, {"type": "dialogue", "speaker": "Валериус", "text": "Медики, заберите бойца в карантинный блок. Для изучения аномальных воздействий."}, {"type": "dialogue", "speaker": "Рэй", "text": "Но ему нужна помощь! А не изучение!"}, {"type": "dialogue", "speaker": "Валериус", "text": "Это приказ, Рэй. Вы еще помните, что это такое?"}, {"type": "narration", "speaker": null, "text": "Медики окружили Элиаса, их безликие шлемы были повернуты к нему, меня для них не существовало. Носилки взмыли в воздух и бесшумно унесли моего напарника вглубь коридора."}, {"type": "thought", "speaker": "Рэй", "text": "Они забрали его. Забрали единственного свидетеля. И теперь он просто... образец для изучения. Я не смог его защитить."}, {"type": "dialogue", "speaker": "Валериус", "text": "Ваш шлем. И личное оружие. Сдайте для полного анализа инцидента."}, {"type": "narration", "speaker": null, "text": "Я молча снял шлем, отстегнул кобуру с пистолетом и протянул ему. Мои руки дрожали от сдерживаемого гнева."}, {"type": "thought", "speaker": "Рэй", "text": "Забирает запись. Забирает доказательства. Заметает следы. Я отдаю ему единственное доказательство. Запись сбоя. Слова Элары. Всё."}, {"type": "narration", "speaker": null, "text": "Валериус принял их, не коснувшись моей руки, и положил на подлетевшего сервисного дрона, который тут же улетел."}, {"type": "dialogue", "speaker": "Валериус", "text": "Возвращайтесь в свою квартиру. И ждите особого распоряжения. Подумайте о своей лояльности, Рэй. И о последствиях ее отсутствия."}, {"type": "narration", "speaker": null, "text": "Он развернулся и ушел, не оборачиваясь, оставив меня одного посреди огромного, холодного холла."}, {"type": "thought", "speaker": "Рэй", "text": "Это не приказ ждать. Это домашний арест. И последнее предупреждение."}, {"type": "narration", "speaker": null, "text": "Безоружный, униженный и полный решимости. Я развернулся и пошел к выходу, чувствуя на себе невидимые взгляды сотен камер."}, {"type": "thought", "speaker": "Рэй", "text": "Хорошо. Будет вам анализ инцидента. Только проводить его буду я. И не по вашим правилам."}], "choices": [], "summary": "Рэй доставляет тяжело раненого Элиаса в штаб 'Эгиды', но сталкивается с ледяным безразличием директора Валериуса. Валериус списывает сбой импланта на 'магическую интерференцию' и, в ответ на обвинения Рэя, угрожает объявить его 'дефектным активом'. Элиаса забирают в карантин для 'изучения', а Рэя, лишив оружия и записи с камеры, фактически сажают под домашний арест. Эта встреча превращает подозрения Рэя в уверенность, что 'Эгида' ведет двойную игру и готова его устранить.", "branch_id": "main", "branch_order": 7}, "scene_008": {"id": "scene_008", "location": "Штаб-квартира корпорации 'Эгида'", "pov_character": "Рэй", "present_characters": ["Рэй"], "lines": [{"type": "narration", "speaker": null, "text": "Дверь за моей спиной закрылась с тихим шипением пневматики. Я остался один в стерильной белизне корпоративных апартаментов, выделенных для 'Чистильщиков' высшего ранга."}, {"type": "thought", "speaker": "Рэй", "text": "Домашний арест. Позолоченная клетка с панорамным видом на город, который я должен защищать."}, {"type": "narration", "speaker": null, "text": "Жгучая ярость после разговора с Валериусом уступила место ледяной, концентрированной решимости. Каждая гладкая поверхность, каждый безликий предмет интерьера кричал о тотальном контроле 'Эгиды'."}, {"type": "thought", "speaker": "Рэй", "text": "Они забрали моё оружие. Забрали запись миссии. Забрали Элиаса. Думают, что оставили меня ни с чем. Они ошибаются."}, {"type": "narration", "speaker": null, "text": "Я подошел к встроенному в стену терминалу. Гладкая черная панель ожила, сканируя мою сетчатку и подтверждая личность."}, {"type": "narration", "speaker": null, "text": "Запрос на доступ к официальному отчету по миссии №734. Отклонено."}, {"type": "narration", "speaker": null, "text": "Запрос на доступ к записи с нашлемной камеры. Отклонено."}, {"type": "narration", "speaker": null, "text": "На экране загорелась холодная красная надпись: «ДОСТУП ЗАБЛОКИРОВАН. НЕДОСТАТОЧНЫЙ УРОВЕНЬ ДОПУСКА»."}, {"type": "thought", "speaker": "Рэй", "text": "Конечно. Они уже подчищают следы. Стирают правду."}, {"type": "narration", "speaker": null, "text": "В тишине комнаты эхом прозвучал шепот вампира. Насмешливый, но теперь пугающе пророческий."}, {"type": "thought", "speaker": "Рэй", "text": "«Они лгут тебе, железный человек». Элара... Она предупреждала. Или это часть её игры?"}, {"type": "thought", "speaker": "Рэй", "text": "Официальные каналы — тупик. Но у меня остался один источник, который Валериус не смог у меня отнять. Я сам."}, {"type": "narration", "speaker": null, "text": "Я сел в кресло. На виске нащупал скрытый порт прямого интерфейса. Нарушение протокола А-1. Несанкционированный доступ к собственным системам. Преступление, караемое списанием."}, {"type": "thought", "speaker": "Рэй", "text": "Плевать на протоколы. Меня уже списали, просто еще не сообщили об этом."}, {"type": "narration", "speaker": null, "text": "Тонкий кабель со щелчком вошел в разъем. Мир на мгновение померк, а затем на экране терминала возникло окно прямого доступа к буферу памяти моего кибернетического глаза."}, {"type": "narration", "speaker": null, "text": "Я запустил последнюю сохраненную запись. Необработанные, нефильтрованные данные. То, что видел я, а не то, что 'Эгида' хотела бы сохранить."}, {"type": "narration", "speaker": null, "text": "Вот он. Заброшенный театр. Пыль в лучах фонарей. Мой отряд. Изящный силуэт Элары, появляющийся из-за бархатного занавеса."}, {"type": "narration", "speaker": null, "text": "Снова этот бой. Я видел его своими глазами, но теперь он был разложен на потоки данных: звук, видео, телеметрия моих систем."}, {"type": "thought", "speaker": "Рэй", "text": "«Твои цепи крепче моих», — снова прошептала она на записи. Тогда это звучало как насмешка. Теперь — как диагноз."}, {"type": "narration", "speaker": null, "text": "Вот Элиас делает шаг вперед. Вот я бросаюсь ему наперерез, чтобы защитить."}, {"type": "narration", "speaker": null, "text": "Стоп. Перемотка. Кадр за кадром."}, {"type": "narration", "speaker": null, "text": "Я замедлил воспроизведение до сотых долей секунды. Моя кибернетическая рука замерла в замахе."}, {"type": "thought", "speaker": "Рэй", "text": "Валериус говорил про «магическую интерференцию». Ложь. Наглая, беспардонная ложь."}, {"type": "narration", "speaker": null, "text": "Поток телеметрии был чист. Никаких внешних энергетических всплесков. Никаких сообщений о перегреве или механическом повреждении. Все системы в норме."}, {"type": "narration", "speaker": null, "text": "А потом я увидел это."}, {"type": "narration", "speaker": null, "text": "За 0.07 секунды до отказа. Крошечный, почти незаметный входящий пакет данных по защищенному каналу."}, {"type": "narration", "speaker": null, "text": "Я выделил его. Команда была зашифрована, но её заголовок был кристально ясен."}, {"type": "thought", "speaker": "Рэй", "text": "SYS.ARM.DEACTIVATE_FORCED."}, {"type": "thought", "speaker": "Рэй", "text": "Принудительное отключение. Не сбой. Не авария. Приказ."}, {"type": "narration", "speaker": null, "text": "Холод прошел по позвоночнику, не имеющий ничего общего с температурой в комнате. Я запустил трассировку пакета."}, {"type": "narration", "speaker": null, "text": "Шифрование было уровня 'Омега', взломать его с этого терминала было невозможно. Но мне и не нужно было."}, {"type": "narration", "speaker": null, "text": "Сигнатура канала-носителя была безошибочной."}, {"type": "thought", "speaker": "Рэй", "text": "AEGIS_INTRANET_SECURE_CHANNEL."}, {"type": "thought", "speaker": "Рэй", "text": "Внутренний. Защищенный. Корпоративный. Это не просто предательство одного человека. Это система. Система, частью которой я был."}, {"type": "narration", "speaker": null, "text": "Осознание обрушилось, как тонна бетона. Меня не просто подставили. Меня использовали как марионетку и оборвали нить в самый нужный момент."}, {"type": "thought", "speaker": "Рэй", "text": "Валериус... Он знал. Он всё знал. Его угрозы... «дефектный актив»... Это была не угроза. Это был приговор."}, {"type": "narration", "speaker": null, "text": "Я сидел, глядя на доказательство предательства моей корпорации. Ярость сменилась чем-то более холодным и опасным."}, {"type": "narration", "speaker": null, "text": "Но тут же, на периферии сознания, зародилось сомнение. Профессиональная паранойя, вбитая годами тренировок."}, {"type": "thought", "speaker": "Рэй", "text": "А что, если?.. Что, если это именно то, что я должен был подумать?"}, {"type": "thought", "speaker": "Рэй", "text": "Элара. Вампир, проживший века. Мастер иллюзий и обмана. Могла ли она, или кто-то еще более могущественный, подделать сигнал так, чтобы он выглядел как внутренний?"}, {"type": "thought", "speaker": "Рэй", "text": "Заставить меня повернуться против своих? Посеять хаос в рядах 'Чистильщиков'? Это был бы гениальный ход."}, {"type": "narration", "speaker": null, "text": "На экране застыли две несовместимые истины. Предательство 'Эгиды' — очевидное, подкрепленное ложью Валериуса. И возможность вражеской диверсии — хитроумной, рассчитанной на мою реакцию."}, {"type": "thought", "speaker": "Рэй", "text": "Кто мой настоящий враг? Корпорация, которой я служил всю жизнь, или существо, которое открыло мне глаза на её ложь?"}, {"type": "narration", "speaker": null, "text": "Я посмотрел на часы. Времени мало. Мой несанкционированный доступ к импланту наверняка уже вызвал тревогу где-то в недрах системы безопасности 'Эгиды'."}, {"type": "thought", "speaker": "Рэй", "text": "Нужно действовать. Сейчас. И от этого решения зависит всё."}, {"type": "thought", "speaker": "Рэй", "text": "Поверить своим глазам и пойти против 'Эгиды', взломав их архивы в поисках ответа? Это путь предателя, без шанса на возвращение. Но это путь к правде."}, {"type": "thought", "speaker": "Рэй", "text": "Или списать всё на врага, сохранив крупицы веры в систему? Это путь лояльного солдата. Но если я ошибусь, то останусь слепым оружием в руках предателей."}, {"type": "narration", "speaker": null, "text": "Два пути. Оба ведут в неизвестность. И оба требуют немедленного решения."}], "choices": [{"id": "choice_01", "appears_after_line": 47, "options": [{"id": "opt_main", "text": "Взломать архив 'Эгиды' и найти правду.", "leads_to_scene_id": "scene_009", "leads_to_branch_id": "main", "is_fake": false}, {"id": "opt_branch_01", "text": "Списать сбой на вражескую атаку.", "leads_to_scene_id": "branch_01_scene_001", "leads_to_branch_id": "branch_01", "is_fake": false}]}], "summary": "Находясь под домашним арестом, Рэй вскрывает буфер памяти своего импланта и обнаруживает, что сбой руки был вызван командой принудительного отключения, отправленной по внутреннему каналу 'Эгиды'. Это открытие подтверждает его подозрения в предательстве, но также порождает сомнение: не могла ли это быть хитроумная диверсия врага. Сцена заканчивается на пороге немедленного выбора: кому верить и как действовать дальше.", "branch_id": "main", "branch_order": 8}, "scene_009": {"id": "scene_009", "location": "Штаб-квартира корпорации 'Эгида'", "pov_character": "Рэй", "present_characters": ["Рэй"], "lines": [{"type": "narration", "speaker": null, "text": "Стерильно-белые стены жилого отсека больше не казались убежищем. Они были стенами камеры. Единственным окном в мир оставался холодный синий свет голографического терминала, отбрасывающий резкие тени на лицо Рэя."}, {"type": "thought", "speaker": "Рэй", "text": "Точка невозврата. Этот шаг превращает меня из солдата в предателя. Но другого способа нет."}, {"type": "narration", "speaker": null, "text": "Его пальцы, не знающие усталости, замерли над виртуальной клавиатурой. Он собирался использовать старую лазейку в системе безопасности — уязвимость, о которой никогда не докладывал. Риск, прибережённый на самый крайний случай."}, {"type": "thought", "speaker": "Рэй", "text": "И этот случай настал."}, {"type": "narration", "speaker": null, "text": "Короткая команда, и система откликнулась. Несколько мучительно долгих секунд тишины, и на экране вспыхнуло окно доступа к защищённому техническому архиву «Эгиды». Воздух в комнате стал гуще."}, {"type": "narration", "speaker": null, "text": "Рэй не медлил. Его запрос был точен, как выстрел снайпера."}, {"type": "thought", "speaker": "Рэй", "text": "Поиск по идентификатору. Моему. Временной маркер — бой в театре. Ключ: SYS.ARM.DEACTIVATE_FORCED."}, {"type": "narration", "speaker": null, "text": "Терминал беззвучно просеивал петабайты данных. Строки кода неслись по экрану, сливаясь в сплошной поток. Мгновение, и поиск завершён."}, {"type": "narration", "speaker": null, "text": "Вот они. Нужные файлы. Он открыл лог-запись, соответствующую моменту сбоя."}, {"type": "narration", "speaker": null, "text": "Телеметрия, показатели жизнедеятельности, состояние систем... всё на месте. Но самый важный блок, тот, что должен был содержать источник команды и протоколы авторизации, был скрыт."}, {"type": "narration", "speaker": null, "text": "Вместо информации — сплошная стена искажённых символов, помеченная багровым значком замка."}, {"type": "thought", "speaker": "Рэй", "text": "Запечатано. Конечно. Они бы не оставили такие улики на видном месте. Слишком просто."}, {"type": "narration", "speaker": null, "text": "Он запустил стандартные дешифраторы «Чистильщиков». Программы, способные вскрыть защиту большинства известных систем."}, {"type": "narration", "speaker": null, "text": "Индикатор выполнения едва дёрнулся и замер. На экране высветилось короткое сообщение: `ОШИБКА. ШИФРОВАНИЕ КЛАССА 'ОМЕГА'.`"}, {"type": "thought", "speaker": "Рэй", "text": "«Омега»... Высший уровень корпоративной защиты. На это уйдут недели, которых у меня нет. Они скрывают нечто очень важное."}, {"type": "narration", "speaker": null, "text": "Пульс стучал в висках, отмеряя уходящие секунды. Петля затягивалась."}, {"type": "thought", "speaker": "Рэй", "text": "Каждый щелчок внутренних часов терминала звучит как шаг охраны в коридоре."}, {"type": "thought", "speaker": "Рэй", "text": "Есть ещё один способ. Запрещённый скрипт. «Чёрный» инструмент, который я раздобыл на всякий случай."}, {"type": "thought", "speaker": "Рэй", "text": "Его использование — не просто нарушение. Это прямое признание вины. Сигнал, который система не сможет проигнорировать. Но выбора нет."}, {"type": "narration", "speaker": null, "text": "Дрогнувшей рукой он загрузил файл. Интерфейс терминала окрасился в агрессивные тёмно-красные тона. Рэй нажал «Выполнить»."}, {"type": "narration", "speaker": null, "text": "Реакция системы была мгновенной, хищной. Не успел скрипт начать работу, как по экрану заметались тревожные флаги."}, {"type": "narration", "speaker": null, "text": "Пронзительный электронный визг ударил по ушам."}, {"type": "narration", "speaker": null, "text": "`ВНИМАНИЕ! ОБНАРУЖЕНА ВРЕДОНОСНАЯ АКТИВНОСТЬ!`"}, {"type": "narration", "speaker": null, "text": "`ВНИМАНИЕ! ЗАПУЩЕНА ПРОЦЕДУРА ОТСЛЕЖИВАНИЯ ИСТОЧНИКА!`"}, {"type": "narration", "speaker": null, "text": "В углу экрана появился таймер, отсчитывающий секунды до полной блокировки. Десять. Девять. Восемь."}, {"type": "thought", "speaker": "Рэй", "text": "Чёрт! Они знают. Они уже здесь."}, {"type": "thought", "speaker": "Рэй", "text": "Взломать не успею. Но я не могу уйти ни с чем!"}, {"type": "narration", "speaker": null, "text": "Рэй резким движением прервал атаку. Пальцы метнулись, выделяя небольшой, случайный на вид кусок зашифрованного блока. Копировать в локальный буфер."}, {"type": "narration", "speaker": null, "text": "Пять. Четыре."}, {"type": "narration", "speaker": null, "text": "Полоска копирования заполнилась за долю секунды до того, как таймер дошел до тройки."}, {"type": "narration", "speaker": null, "text": "В тот же миг экран погас. А затем на нём вспыхнуло финальное сообщение, выведенное холодным корпоративным шрифтом."}, {"type": "narration", "speaker": null, "text": "`ДОСТУП ЗАБЛОКИРОВАН. ПОДОЗРИТЕЛЬНАЯ АКТИВНОСТЬ ЗАРЕГИСТРИРОВАНА. АКТИВИРОВАН ПРОТОКОЛ БЕЗОПАСНОСТИ 7.`"}, {"type": "narration", "speaker": null, "text": "Соединение было разорвано. Тишина в комнате стала оглушающей, давящей."}, {"type": "thought", "speaker": "Рэй", "text": "Попался. Теперь я не просто подозреваемый. Я — подтверждённая угроза. Скоро за мной придут."}, {"type": "narration", "speaker": null, "text": "Он откинулся на спинку стула, тяжело дыша. Адреналин отступил, оставив ледяную пустоту. Я проиграл. Но... я не ушёл с пустыми руками."}, {"type": "narration", "speaker": null, "text": "Рэй заставил себя снова сесть прямо. В изолированном буфере его личного процессора теперь хранился крошечный фрагмент кода. Единственная зацепка."}, {"type": "thought", "speaker": "Рэй", "text": "Нужно посмотреть. Нужно знать, что я украл, пока у меня не отняли и эту возможность."}, {"type": "narration", "speaker": null, "text": "Он открыл файл. На экране появилась бессмысленная мешанина из букв и цифр шифра «Омега». Поток данных, который невозможно было прочесть."}, {"type": "narration", "speaker": null, "text": "Рэй вглядывался, пытаясь найти хоть какую-то закономерность. И вдруг замер."}, {"type": "narration", "speaker": null, "text": "Прямо посреди цифрового хаоса, словно клеймо на металле, проступал символ. Он не принадлежал ни одному языку программирования. Витиеватый, чужеродный, он будто светился изнутри."}, {"type": "thought", "speaker": "Рэй", "text": "Что это... Это не код. Это... магия?"}, {"type": "narration", "speaker": null, "text": "Холод пробежал по его спине, не имеющий ничего общего с кибернетикой. Память услужливо подбросила образ."}, {"type": "narration", "speaker": null, "text": "Заброшенный готический театр. Пыль, запах тлена и крови. И этот же самый символ, вырезанный на бархате старой ложи, где он впервые столкнулся с Эларой."}, {"type": "thought", "speaker": "Рэй", "text": "Она... Вампир... Этот знак — её? Или чего-то, с чем она связана?"}, {"type": "narration", "speaker": null, "text": "Осознание ударило с силой физического разряда. Заговор «Эгиды» был глубже, чем он мог себе представить."}, {"type": "thought", "speaker": "Рэй", "text": "Они не просто скрывают корпоративные преступления. Они используют в своих самых защищённых системах... мистические символы. Технология и магия, переплетенные в одно целое."}, {"type": "narration", "speaker": null, "text": "В коридоре послышались тихие, размеренные шаги. Они приближались. Тяжелая поступь службы безопасности."}, {"type": "thought", "speaker": "Рэй", "text": "Время вышло. Они здесь."}, {"type": "narration", "speaker": null, "text": "Рэй посмотрел на терминал, где светился чужеродный знак, а затем на дверь своей комнаты."}, {"type": "thought", "speaker": "Рэй", "text": "Я загнал себя в угол. С одной стороны — корпорация, которая идёт за мной, чтобы 'списать'. С другой — вампир, которая пыталась меня убить, но которая, возможно, единственная знает, что означает этот символ."}, {"type": "thought", "speaker": "Рэй", "text": "Довериться палачам, которые лгали мне с самого начала? Или искать ответы у монстра, чьи слова о лжи 'Эгиды' оказались правдой?"}, {"type": "narration", "speaker": null, "text": "Выбор стал не просто сложным. Он стал невозможным. И сделать его нужно было прямо сейчас."}], "choices": [], "summary": "Рэй проникает в архивы «Эгиды» и находит логи своего импланта, но они защищены шифром высшего класса. Его отчаянная попытка взлома проваливается, активируя тревогу, но в последний момент он успевает скопировать фрагмент данных. Изучая его, Рэй обнаруживает странный мистический символ, который он видел в театре во время боя с вампиром Эларой. Осознав, что заговор 'Эгиды' связан с магией, и слыша приближение охраны, Рэй оказывается перед невозможным выбором: сдаться корпорации или искать ответы у своего врага.", "branch_id": "main", "branch_order": 9}, "scene_010": {"id": "scene_010", "location": "Штаб-квартира корпорации 'Эгида'", "pov_character": "Рэй", "present_characters": ["Рэй", "Элара"], "lines": [{"type": "narration", "speaker": null, "text": "Приглушенный вой сирены затих, оставив после себя звенящую тишину, которую тут же поглотили гулкие технические коридоры. Рэй вжался в тень за толстым жгутом оптоволоконных кабелей, замерев."}, {"type": "narration", "speaker": null, "text": "Воздух в его укрытии — узкой сервисной нише — был спертым, пах озоном и пылью. По его внутреннему комм-каналу прорывались искаженные помехами голоса охраны. Охота началась."}, {"type": "thought", "speaker": "Рэй", "text": "Они прочесывают сектор за сектором. Вопрос времени. Я — цель. Уже не агент, а 'субъект'."}, {"type": "narration", "speaker": null, "text": "Он прислонился к холодной металлической стене, пальцы здоровой руки вызвали к жизни экран личного датапада. Его лицо озарилось холодным, тревожным светом."}, {"type": "narration", "speaker": null, "text": "На дисплее бежали столбцы данных, которые он вырвал из архива. Непроницаемая стена корпоративного шифра."}, {"type": "thought", "speaker": "Рэй", "text": "Бессмыслица. Я поставил на кон всё, чтобы украсть этот шум..."}, {"type": "narration", "speaker": null, "text": "Он пролистывал код, пока его оптический имплант не подал сигнал. Аномалия. Один-единственный элемент, чужеродный строгой логике шифра."}, {"type": "thought", "speaker": "Рэй", "text": "Вот ты где. Не часть алфавита. Не процедурный глиф. Что-то... иное."}, {"type": "narration", "speaker": null, "text": "Изогнутые, переплетающиеся линии, больше похожие на ритуальный сигил, чем на элемент кода. Он, казалось, едва заметно пульсировал на экране, нарушая цифровую статику."}, {"type": "thought", "speaker": "Рэй", "text": "Я видел это раньше. Но где?"}, {"type": "narration", "speaker": null, "text": "Память ударила наотмашь, резкая и болезненная. Заброшенный театр. Запах старого бархата, пыли и меди."}, {"type": "narration", "speaker": null, "text": "Элара. Ее хищная грация. И едва заметное алое марево магии, окутывающее ее."}, {"type": "narration", "speaker": null, "text": "В тот момент, когда она нанесла удар, ранив Элиаса, эта аура на долю секунды сгустилась, вспыхнув именно этим символом. Один в один."}, {"type": "thought", "speaker": "Рэй", "text": "Невозможно... Этого не может быть."}, {"type": "narration", "speaker": null, "text": "Осознание обрушилось на него, холодное и тяжелое, как могильная плита. Дыхание застряло в горле."}, {"type": "thought", "speaker": "Рэй", "text": "'Эгида'... Корпорация, построенная на крестовом походе против магии, на идее её полного уничтожения... использует магический символ."}, {"type": "thought", "speaker": "Рэй", "text": "Они используют его в своих самых защищенных протоколах. В коде, который управляет жизнями 'Чистильщиков'."}, {"type": "thought", "speaker": "Рэй", "text": "Команда на отключение моей руки. Она была запечатана этим. Этим шифром. Этим сигилом."}, {"type": "narration", "speaker": null, "text": "Лицемерие было настолько чудовищным, что к горлу подкатила тошнота. Вся его жизнь, вся служба, все, в кого он верил и кого потерял — всё было построено на колоссальной лжи."}, {"type": "thought", "speaker": "Рэй", "text": "И я никогда не взломаю это. Никакой ледокол не справится с тем, что не подчиняется законам технологии."}, {"type": "narration", "speaker": null, "text": "В этом мире было лишь одно существо, которое могло знать, что это за знак. Ключ к разгадке."}, {"type": "thought", "speaker": "Рэй", "text": "Элара."}, {"type": "narration", "speaker": null, "text": "Ее слова, брошенные в театре, теперь звучали в его голове не насмешкой, а констатацией факта."}, {"type": "thought", "speaker": "Рэй", "text": "«Они лгут тебе»."}, {"type": "narration", "speaker": null, "text": "И вот он, загнанный в угол, сжимает в руке ключ от замка, который находится у его злейшего врага."}, {"type": "thought", "speaker": "Рэй", "text": "Что теперь? У меня есть приманка. Как ее использовать?"}, {"type": "narration", "speaker": null, "text": "Скрип ботинок по металлическому полу. Тяжелые, размеренные шаги патруля безопасности. Они приближались."}, {"type": "thought", "speaker": "Рэй", "text": "Думай, Рэй. Вариант первый: путь солдата. Верного пса 'Эгиды'."}, {"type": "thought", "speaker": "Рэй", "text": "Я могу доложить Валериусу. Сказать, что нашел способ выманить вампира. Устроить засаду, используя этот символ как наживку."}, {"type": "thought", "speaker": "Рэй", "text": "Это шанс вернуть доверие. А потом выбить ответы из неё силой. По уставу."}, {"type": "thought", "speaker": "Рэй", "text": "Но это значит — снова довериться им. Тем, кто нажал на кнопку. Отдать им свой единственный козырь. Они просто заберут его и 'спишут' меня без лишних вопросов."}, {"type": "narration", "speaker": null, "text": "Он перевел взгляд на экран датапада. На чужеродный, магический сигил. Был и другой путь."}, {"type": "thought", "speaker": "Рэй", "text": "Вариант второй: путь предателя. Дезертира."}, {"type": "thought", "speaker": "Рэй", "text": "Я могу пойти к ней сам. В 'Серые Зоны', где не действуют законы корпорации. Найти её в её мире."}, {"type": "thought", "speaker": "Рэй", "text": "Попросить помощи у 'аномалии'. У монстра, которого я поклялся уничтожать. Которая покалечила Элиаса."}, {"type": "thought", "speaker": "Рэй", "text": "Это безумие. Она убьет меня на месте. Но она — единственная, кто знает правду. И она была права насчет лжи 'Эгиды'."}, {"type": "narration", "speaker": null, "text": "Шаги стали громче. Двое, судя по звуку. Они методично проверяли каждую нишу, каждый люк. Остались считанные метры."}, {"type": "thought", "speaker": "Рэй", "text": "Времени нет. Нужно решать. Прямо сейчас."}, {"type": "narration", "speaker": null, "text": "Два пути. Две пропасти. С одной стороны — ловушка для врага, которая может стать ловушкой для него самого. С другой — союз с монстром, который может стоить ему жизни и души."}, {"type": "thought", "speaker": "Рэй", "text": "Вернуться в логово лжецов и молить о прощении... или шагнуть в темноту навстречу правде, которая может меня сожрать?"}, {"type": "narration", "speaker": null, "text": "Голос из комм-канала патруля прозвучал совсем близко, без помех: «Сектор семь-гамма, технический коридор. Проверить все сервисные отсеки. Субъект resourceful»."}, {"type": "thought", "speaker": "Рэй", "text": "Находчивый субъект... Вот и всё. Я для них уже не человек."}, {"type": "narration", "speaker": null, "text": "Он погасил экран датапада, и темнота снова сомкнулась вокруг. Выбор перестал быть абстракцией."}, {"type": "thought", "speaker": "Рэй", "text": "Десятилетия службы против одной искры правды... Хватит лжи."}, {"type": "thought", "speaker": "Рэй", "text": "Я должен знать. Любой ценой. Я найду ее."}, {"type": "narration", "speaker": null, "text": "Решение принято. Холодная ярость сменила отчаяние. Теперь нужно было выбраться из этого здания."}, {"type": "narration", "speaker": null, "text": "Рэй бесшумно скользнул из своей ниши в противоположном от шагов направлении. Его цель — 'Серые Зоны'. Логово его врага. И его единственная надежда."}], "choices": [], "summary": "Скрываясь от охраны, Рэй обнаруживает в украденных данных магический символ, который видел у вампира Элары. Осознав, что 'Эгида' использует магию и что только Элара может расшифровать код, он оказывается перед выбором: устроить на нее засаду для корпорации или искать с ней союза. Под давлением приближающегося патруля, Рэй выбирает второе, решая бежать и найти Элару в 'Серых Зонах'.", "branch_id": "main", "branch_order": 10}, "scene_011": {"id": "scene_011", "location": "Серые Зоны", "pov_character": "Рэй", "present_characters": ["Рэй", "Посланник Элары", "Чистильщик"], "lines": [{"type": "narration", "speaker": null, "text": "Последний патрульный дрон 'Эгиды' беззвучно пронесся над головой и развернулся, не решаясь пересечь невидимую черту. Рэй остался позади. Здесь заканчивалась юрисдикция корпорации и начинался хаос."}, {"type": "narration", "speaker": null, "text": "Воздух мгновенно изменился. Неоновый озон центра сменился густым коктейлем из запахов сырого бетона, гниющего мусора и чего-то еще... чего-то древнего, как пыль в запечатанной гробнице."}, {"type": "thought", "speaker": "Рэй", "text": "Точка невозврата. Теперь я официально — дезертир на вражеской территории. Ирония в том, что враг здесь повсюду."}, {"type": "narration", "speaker": null, "text": "Он двинулся вглубь лабиринта ржавеющих конструкций и остовов зданий. Его тактический визор, обычно заливающий мир потоками данных, теперь показывал лишь рябь помех и знаки вопроса. Технология пасовала перед этим местом."}, {"type": "thought", "speaker": "Рэй", "text": "Мои глаза, мои уши, все мои 'улучшения' — бесполезный хлам. Я здесь слепец, ведомый отчаянием."}, {"type": "narration", "speaker": null, "text": "Паранойя, верный пес 'Чистильщика', которого он годами держал на коротком поводке, теперь рычала, впиваясь клыками в затылок. Каждая тень казалась фигурой, каждый порыв ветра — шепотом."}, {"type": "thought", "speaker": "Рэй", "text": "Они уже знают, что я здесь. Чувствуют меня. Как хищник чувствует кровь в воде."}, {"type": "narration", "speaker": null, "text": "Он замер. На бетонной плите, расколотой проросшим деревом, виднелись глубокие борозды. Три параллельных, рваных царапины, словно гигантская кошка точила когти."}, {"type": "thought", "speaker": "Рэй", "text": "Классификация: 'Аномалия, тип Гамма'. Протокол: 'Оцепить, вызвать поддержку, приготовиться к ликвидации'."}, {"type": "narration", "speaker": null, "text": "Его кибернетическая рука непроизвольно сжалась в кулак с тихим жужжанием сервоприводов. Инстинкты, вбитые годами тренировок, требовали действия."}, {"type": "thought", "speaker": "Рэй", "text": "Нет. Я должен сломать эту программу. Я здесь не для охоты. Я здесь, чтобы просить."}, {"type": "narration", "speaker": null, "text": "Он заставил себя отвернуться, игнорируя вопли внутреннего 'Чистильщика'. Шаг за шагом, он шел дальше, вглубь тьмы, и ощущение чужого взгляда становилось почти осязаемым давлением на кожу."}, {"type": "thought", "speaker": "Рэй", "text": "Это не патруль 'Эгиды'. Их я бы почуял по запаху озона и стерильности. Это нечто иное. Живое. Древнее."}, {"type": "narration", "speaker": null, "text": "Впервые за всю свою карьеру Рэй в полной мере осознал, что значит быть дичью. Беспомощной, заблудившейся жертвой на чужой охотничьей территории."}, {"type": "thought", "speaker": "Рэй", "text": "Страх — непозволительная роскошь. Вспомни, ради чего ты здесь."}, {"type": "narration", "speaker": null, "text": "Перед его мысленным взором вспыхнул образ Элиаса — бледного, подключенного к аппаратам в карантинном блоке. 'Изучение'... так они это назвали."}, {"type": "thought", "speaker": "Рэй", "text": "И этот файл... Этот проклятый символ, выжигающий изнутри. Тот же, что я видел у нее. Он — ключ ко всему. К предательству 'Эгиды', к сбою моей руки, к судьбе Элиаса."}, {"type": "narration", "speaker": null, "text": "Эта мысль стала его якорем. Холодная ярость вытеснила страх, превратив его в стальную решимость."}, {"type": "thought", "speaker": "Рэй", "text": "Какой же я идиот. Пытаюсь выследить существо ночи с помощью технологий дня. Я не найду ее так. Никогда."}, {"type": "thought", "speaker": "Рэй", "text": "Значит, нужно, чтобы она нашла меня. Я должен не искать, а быть найденным."}, {"type": "narration", "speaker": null, "text": "Он вышел на небольшую, заваленную мусором площадь перед руинами старой насосной станции. Единственный уцелевший фонарь бросал на землю тусклый, больной круг света. Рэй шагнул прямо в него."}, {"type": "thought", "speaker": "Рэй", "text": "Вот сцена. Вот актер. Время для жеста доброй воли. Или безумия."}, {"type": "narration", "speaker": null, "text": "Он закрыл глаза, погружаясь в нейроинтерфейс. Короткая ментальная команда. Его кибернетическая рука отозвалась серией тихих щелчков."}, {"type": "narration", "speaker": null, "text": "Панели на предплечье, обычно горевшие боевым багрянцем, вспыхнули и погасли, сменившись ровным, нейтральным белым светом. Боевые протоколы, системы наведения, силовой каркас — все отключилось."}, {"type": "thought", "speaker": "Рэй", "text": "Теперь это просто дорогой протез. Кусок металла и керамики. Я безоружен. Уязвим."}, {"type": "narration", "speaker": null, "text": "Он вытащил из-за пояса свой стандартный импульсный пистолет и, помедлив секунду, положил его на землю у своих ног. Последний барьер был убран."}, {"type": "narration", "speaker": null, "text": "Рэй стоял неподвижно в круге света, подняв пустые руки. Ждал."}, {"type": "narration", "speaker": null, "text": "Ответ пришел из самой глубокой тени у основания разрушенной стены. Тьма сгустилась, потекла по земле, словно чернильное пятно, и начала подниматься, обретая форму."}, {"type": "narration", "speaker": null, "text": "В нескольких метрах от него замерло призрачное, мерцающее существо, сотканное из дыма и холодного лунного света. Оно напоминало сову с глазами-угольками."}, {"type": "thought", "speaker": "Рэй", "text": "Дух-фамильяр. Посланник. Она все это время наблюдала."}, {"type": "narration", "speaker": null, "text": "Голос
