 возник не в ушах, а прямо в черепной коробке — холодный, бесплотный, как шелест страниц древней книги. Он был соткан не из звуков, а из чистого знания."}, {"type": "dialogue", "speaker": "Посланник Элары", "text": "Хозяйка видит твой жест, 'Чистильщик'. Она удивлена. Она согласна говорить."}, {"type": "narration", "speaker": null, "text": "Существо склонило голову, и Рэй почувствовал, как его сканирует невидимый взгляд, проникая под кожу, оценивая намерения."}, {"type": "dialogue", "speaker": "Посланник Элары", "text": "Но будь предупрежден. Если в твоем сердце или в твоих руках скрыта ловушка... если ты принес с собой войну... это место станет твоей могилой. Быстрой или медленной — решит она."}, {"type": "narration", "speaker": null, "text": "Призрачное крыло, невесомое и нематериальное, указало в сторону зияющего провала арки в глубине площади."}, {"type": "dialogue", "speaker": "Посланник Элары", "text": "Она ждет."}, {"type": "narration", "speaker": null, "text": "С последним словом, прозвучавшим эхом в сознании, существо распалось на сотни крошечных искорок и беззвучно растаяло в ночном воздухе."}, {"type": "narration", "speaker": null, "text": "Рэй остался один на площади. Воздух вокруг казался оглушительно тихим. Он медленно опустил руки, чувствуя, как по спине бежит холодок — не от страха, а от осознания."}, {"type": "thought", "speaker": "Рэй", "text": "Шаг сделан. Обратной дороги больше нет. Только вперед — в логово врага, который, возможно, станет моим единственным союзником."}], "choices": [{"id": "choice_02", "appears_after_line": 38, "options": [{"id": "opt_main", "text": "Идти в 'Серые Зоны' одному и искать встречи.", "leads_to_scene_id": "scene_012", "leads_to_branch_id": "main", "is_fake": false}, {"id": "opt_branch_02", "text": "Доложить Валериусу и запросить отряд для засады.", "leads_to_scene_id": "branch_02_scene_001", "leads_to_branch_id": "branch_02", "is_fake": false}]}], "summary": "Рэй проникает в 'Серые Зоны', где его кибернетические импланты и методы 'Чистильщика' оказываются бесполезны. Осознав, что выследить Элару невозможно, он идет на отчаянный шаг: находит открытое место и демонстративно разоружается, отключая боевые системы руки и оставляя оружие. В ответ на этот жест доброй воли появляется дух-фамильяр, посланник Элары. Он передает Рэю приглашение на встречу, сопровождая его суровым предупреждением о последствиях любого обмана.", "branch_id": "main", "branch_order": 11}, "scene_012": {"id": "scene_012", "location": "Серые Зоны", "pov_character": "Рэй", "present_characters": ["Рэй", "Посланник", "Посланник Элары", "Чистильщик"], "lines": [{"type": "narration", "speaker": null, "text": "Тишина, сменившая предупреждение духа, давила на уши. Рэй стоял неподвижно, вслушиваясь в гул собственной крови."}, {"type": "thought", "speaker": "Рэй", "text": "Шаг сделан. Обратной дороги больше нет. Только вперед — в логово врага, который, возможно, станет моим единственным союзником."}, {"type": "narration", "speaker": null, "text": "Он сделал глубокий вдох, принимая условия. Принимая риск. В тот же миг одна из искорок, не успевшая погаснуть, вспыхнула ярче."}, {"type": "narration", "speaker": null, "text": "Она зависла в воздухе на уровне его глаз — маленький, пульсирующий огонек нездешнего света."}, {"type": "thought", "speaker": "Рэй", "text": "Приглашение все еще в силе. Она ждет."}, {"type": "narration", "speaker": null, "text": "Не дожидаясь ответа, огонек сорвался с места и поплыл вглубь темного переулка, огибая груды мусора."}, {"type": "narration", "speaker": null, "text": "Рэй последовал за ним без колебаний. Путь был его единственным выбором."}, {"type": "narration", "speaker": null, "text": "Проводник двигался странно. Он не облетал препятствия, а проходил сквозь них. Просачивался через ржавую арматуру, торчащую из бетонной плиты, мерцал сквозь разбитое стекло брошенного автомобиля."}, {"type": "narration", "speaker": null, "text": "Рэю же приходилось карабкаться, перепрыгивать и искать обходные пути. Каждый шаг по этой враждебной территории был актом смирения."}, {"type": "thought", "speaker": "Рэй", "text": "Она заставляет меня почувствовать себя чужаком. Почувствовать себя уязвимым. Что ж, я и есть уязвим."}, {"type": "narration", "speaker": null, "text": "Они углублялись в Серые Зоны. Неоновые вывески сменились тусклым светом фосфоресцирующего мха, покрывавшего влажные стены."}, {"type": "narration", "speaker": null, "text": "Воздух стал гуще, запахло озоном, мокрой землей и чем-то еще, чем-то древним и сладковатым."}, {"type": "narration", "speaker": null, "text": "В углу его зрения замерцал индикатор аугментаций. Оптический сенсор пытался проанализировать светящийся мох, но выдавал лишь каскад ошибок."}, {"type": "thought", "speaker": "Рэй", "text": "Бесполезно. Вся моя техника, все, на что я полагался... здесь это просто мусор. Как и предупреждали."}, {"type": "narration", "speaker": null, "text": "Интерфейс, привычно наложенный на реальность, трещал и рассыпался помехами. Мир корпорации «Эгида» здесь заканчивался."}, {"type": "thought", "speaker": "Рэй", "text": "Именно поэтому мне и нужна Элара. Этот файл... он зашифрован не только кодом, но и магией. Только она сможет его прочесть."}, {"type": "narration", "speaker": null, "text": "Внезапно впереди, в густой тени под рухнувшим мостом, что-то мелькнуло. Движение было слишком быстрым, слишком... хищным."}, {"type": "narration", "speaker": null, "text": "Инстинкты Чистильщика, отточенные годами тренировок, взревели. Рэй мгновенно пригнулся, его тело само перешло в боевой режим."}, {"type": "thought", "speaker": "Рэй", "text": "Сектор семь, возможная засада. Оценить угрозу. Найти укрытие. Нейтрализовать."}, {"type": "narration", "speaker": null, "text": "Его правая, кибернетическая рука дернулась, пальцы сложились в привычном жесте, ища рукоять несуществующего пистолета."}, {"type": "narration", "speaker": null, "text": "В тот же миг огонек-проводник замер. Его мягкий свет стал багровым, почти черным."}, {"type": "narration", "speaker": null, "text": "Мир вокруг исказился. Тени поползли, сгущаясь в уродливые фигуры с горящими глазами. Тихий шепот сотен голосов заскреб по черепу."}, {"type": "thought", "speaker": "Рэй", "text": "Ловушка! Я знал!"}, {"type": "narration", "speaker": null, "text": "Но сквозь панику в его сознание ледяным потоком влилось ощущение. Не слова, а чистое, концентрированное знание."}, {"type": "thought", "speaker": "Рэй", "text": "Твои мысли — тоже оружие. Оставь их."}, {"type": "narration", "speaker": null, "text": "Предупреждение. Последнее предупреждение."}, {"type": "narration", "speaker": null, "text": "Рэй замер, тяжело дыша. Он боролся не с тенями снаружи, а с солдатом внутри себя."}, {"type": "thought", "speaker": "Рэй", "text": "Отпусти... Я должен отпустить. Я не Чистильщик. Не здесь. Не сейчас."}, {"type": "narration", "speaker": null, "text": "Он сознательным усилием воли заставил мышцы расслабиться. Разогнул пальцы кибернетической руки, ладонью вверх. Поднял голову, открыто глядя в темноту."}, {"type": "thought", "speaker": "Рэй", "text": "Я пришел за правдой. Не за войной. Я доверяю тебе."}, {"type": "narration", "speaker": null, "text": "Стоило ему принять это решение всем своим существом, как мир вернулся в норму. Тени отступили, став просто тенями. Шепот стих."}, {"type": "narration", "speaker": null, "text": "Огонек-проводник снова стал мягким и светлым. Он качнулся, словно в одобрительном кивке, и продолжил свой путь."}, {"type": "narration", "speaker": null, "text": "Теперь дорога казалась... другой. Менее враждебной. Словно сама территория приняла его, признав гостем."}, {"type": "narration", "speaker": null, "text": "Вскоре они вышли к тупику — стене полуразрушенного коллектора, из которого сочилась черная, маслянистая вода, образуя зловонное озерцо."}, {"type": "thought", "speaker": "Рэй", "text": "И это все? Конец пути?"}, {"type": "narration", "speaker": null, "text": "Огонек подлетел к самой грязной стене, покрытой слоем зеленоватой слизи, и коснулся ее."}, {"type": "narration", "speaker": null, "text": "Поверхность стены пошла рябью, как от брошенного камня. Мох и грязь исчезли, уступая место гладкому, как обсидиан, полотну."}, {"type": "narration", "speaker": null, "text": "Стена изогнулась внутрь, превращаясь в мерцающий, переливающийся всеми цветами ночи портал. Из него пахнуло прохладой, пылью старых книг и чем-то пьянящим, как старое вино."}, {"type": "thought", "speaker": "Рэй", "text": "Вход в убежище. Скрытый не сталью, а магией."}, {"type": "narration", "speaker": null, "text": "Проводник влетел в портал и растворился в его глубине."}, {"type": "narration", "speaker": null, "text": "Рэй постоял мгновение на границе двух миров — мира ржавого железа и мира живой магии."}, {"type": "narration", "speaker": null, "text": "Он сделал последний вдох воздуха Серых Зон, оставляя за спиной свое прошлое, и шагнул в неизвестность."}], "choices": [], "summary": "Следуя за духом-фамильяром Элары, Рэй проходит через сюрреалистичные Серые Зоны. Он вынужден подавить свои инстинкты Чистильщика, доказав мирные намерения не только отсутствием оружия, но и мыслями. Пройдя это испытание, он достигает скрытого магического портала — входа в убежище вампира.", "branch_id": "main", "branch_order": 12}, "scene_013": {"id": "scene_013", "location": "Подземная библиотека (убежище Элары)", "pov_character": "Рэй", "present_characters": ["Рэй", "Элара"], "lines": [{"type": "narration", "speaker": null, "text": "Шаг сквозь незримую завесу ощутился как нырок в ледяную воду. Краткий миг удушающего давления, звенящей тишины, а затем — резкий, судорожный вдох."}, {"type": "narration", "speaker": null, "text": "Воздух здесь был другим. Густой, словно настоянный на веках. Вместо озона и гнили Серых Зон — сладковатый аромат старой бумаги, воска и пыли. И еще что-то, неуловимое, похожее на статическое электричество перед грозой — запах чистой силы."}, {"type": "narration", "speaker": null, "text": "Рэй моргнул, привыкая к мягкому, теплому свету от парящих в воздухе сфер. Он стоял в центре круглого зала. Стены от пола до невидимого во тьме потолка были заставлены книжными стеллажами из темного, почти черного дерева."}, {"type": "thought", "speaker": "Рэй", "text": "Библиотека. Под землей. Ее логово."}, {"type": "narration", "speaker": null, "text": "Среди стеллажей, опершись бедром о массивный стол, стояла она. Элара. Ее силуэт был неподвижен, словно вырезан из тени, но Рэй чувствовал ее внимание каждой клеткой."}, {"type": "dialogue", "speaker": "Элара", "text": "Рэй. Чистильщик, инвентарный номер семьсот тридцать четыре. Прославился зачисткой в Секторе Гамма. Лично «деактивировал» дюжину моих сородичей в Нижнем Гелиосе."}, {"type": "narration", "speaker": null, "text": "Ее голос был спокоен, как поверхность замерзшего озера, но под ним чувствовалась смертельная глубина. Каждое слово — как приговор."}, {"type": "dialogue", "speaker": "Элара", "text": "Назови мне хоть одну причину, почему я не должна оборвать твою жалкую жизнь прямо здесь и сейчас, железный пес корпорации."}, {"type": "thought", "speaker": "Рэй", "text": "Не оправдывайся. Не защищайся. Это старые рефлексы. Ты здесь не солдат. Ты проситель."}, {"type": "narration", "speaker": null, "text": "Рэй медленно поднял руки, показывая пустые ладони. Он не сделал ни шагу, чувствуя себя под прицелом."}, {"type": "dialogue", "speaker": "Рэй", "text": "Потому что «Эгида» предала меня. Они пытались убить меня так же, как и тебя. Я пришел не как враг."}, {"type": "narration", "speaker": null, "text": "Он осторожно достал из кармана маленький дата-чип. В тусклом свете он казался ничтожным."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я пришел как проситель. Внутри — доказательства их лжи. Но они зашифровали их... магией. Символом, который я видел в театре."}, {"type": "narration", "speaker": null, "text": "Элара одарила чип взглядом, полным презрения."}, {"type": "dialogue", "speaker": "Элара", "text": "Игрушки твоих хозяев меня не интересуют. Твои проблемы — это не мои проблемы. Союз между нашими видами невозможен."}, {"type": "narration", "speaker": null, "text": "Она сделала едва заметное движение, и ее голос стал еще холоднее, точнее."}, {"type": "dialogue", "speaker": "Элара", "text": "Ты беспокоишься о своей шкуре, пока твой напарник, Элиас, наверняка уже разобран на запчасти в лабораториях «Эгиды». Они списали его. Как спишут и тебя."}, {"type": "narration", "speaker": null, "text": "Имя Элиаса ударило Рэя под дых. Вина, ярость и отчаяние смешались в тугой узел."}, {"type": "dialogue", "speaker": "Рэй", "text": "Именно поэтому я здесь! Правда в этом файле — единственный шанс. Не только для меня. Для него. Для всех, кого они используют и выбрасывают."}, {"type": "thought", "speaker": "Рэй", "text": "Если я не смогу спасти его... то хотя бы отомщу за него."}, {"type": "narration", "speaker": null, "text": "В его голосе прорвалась неподдельная боль. Элара на мгновение замолчала, изучая его лицо. В ее глазах мелькнуло не сочувствие, но холодный расчет."}, {"type": "thought", "speaker": "Рэй", "text": "Он сломлен. Искренен в своей ненависти. Такой инструмент может быть полезен... если он не врет."}, {"type": "dialogue", "speaker": "Элара", "text": "Дай сюда."}, {"type": "narration", "speaker": null, "text": "Рэй подошел и положил чип на стол. Элара не смотрела на него, ее внимание было приковано к крошечному куску пластика."}, {"type": "dialogue", "speaker": "Элара", "text": "Но если это ловушка, Чистильщик... твоя смерть не будет быстрой. Она будет поучительной."}, {"type": "narration", "speaker": null, "text": "Она провела по своему запястью острым ногтем. На стол упала капля темной крови, окутав чип."}, {"type": "narration", "speaker": null, "text": "Кровь не впиталась. Она поползла по поверхности, собираясь в тонкие, светящиеся нити, которые оплели чип, словно живые."}, {"type": "narration", "speaker": null, "text": "Над столом вспыхнула голографическая проекция. Беспорядочные строки кода. Магический шифр пульсировал в центре, как злое, больное сердце."}, {"type": "narration", "speaker": null, "text": "Кровавые нити Элары впились в шифр, и он треснул, рассыпаясь на тысячи светящихся осколков. Первым проявился знакомый интерфейс."}, {"type": "thought", "speaker": "Рэй", "text": "Логи моего импланта... Вот оно."}, {"type": "narration", "speaker": null, "text": "Одна строка, выделенная красным. `UNIT_734::ARM_SYS_OVERRIDE::FORCE_SHUTDOWN`. Источник: `AEGIS_HQ_COMMAND`. Время — до миллисекунды совпадало с моментом боя в театре."}, {"type": "dialogue", "speaker": "Рэй", "text": "Они... они просто выключили меня. Предатели."}, {"type": "dialogue", "speaker": "Элара", "text": "Это не все. Здесь есть еще один слой. Глубже."}, {"type": "narration", "speaker": null, "text": "Элара коснулась проекции, и та сменилась. На экране появилось название: `ПРОТОКОЛ 'ХИМЕРА'`."}, {"type": "narration", "speaker": null, "text": "Это был не просто протокол отключения. Это был протокол полного перехвата контроля. Не отключить, а управлять. Превратить любого Чистильщика в марионетку, выполняющую любой приказ."}, {"type": "thought", "speaker": "Рэй", "text": "Не просто солдаты... а оружие, которое можно направить на кого угодно. На своих."}, {"type": "narration", "speaker": null, "text": "Затем пошли списки. Цели для «нейтрализации» с помощью протокола. Журналисты. Политики. Ученые, работавшие на конкурентов. Имена магических существ перемежались с именами людей."}, {"type": "narration", "speaker": null, "text": "Рэй отшатнулся от стола, словно от удара. Вот оно. Неопровержимое доказательство. Черным по белому."}, {"type": "thought", "speaker": "Рэй", "text": "Вся моя жизнь. Вся служба. Каждая «зачистка»... всё было ложью. Я был их цепным псом, и даже не знал этого."}, {"type": "narration", "speaker": null, "text": "Он посмотрел на свою кибернетическую руку. Металл и сервоприводы, которыми он так гордился. Теперь они казались ему ошейником раба."}, {"type": "narration", "speaker": null, "text": "Элара молча наблюдала за ним, давая ему утонуть в этом откровении. В ее глазах не было жалости, только пристальное ожидание. Что сделает сломанная игрушка?"}, {"type": "narration", "speaker": null, "text": "Рэй медленно поднял голову. Шок в его глазах сменился чем-то другим. Твердым и холодным, как сталь."}, {"type": "thought", "speaker": "Рэй", "text": "Сомнений больше нет. Только ярость. И цель."}, {"type": "dialogue", "speaker": "Рэй", "text": "Они не остановятся. Эту информацию должны увидеть все."}, {"type": "narration", "speaker": null, "text": "Он встретился взглядом с Эларой. Впервые он смотрел на нее не как на монстра или врага, а как на единственного возможного союзника."}, {"type": "dialogue", "speaker": "Рэй", "text": "Помоги мне. Помоги мне сжечь их империю дотла."}, {"type": "narration", "speaker": null, "text": "На губах Элары появилась слабая, хищная улыбка. Она увидела в нем не сломанную марионетку, а оружие, которое только что обрело собственную волю."}, {"type": "dialogue", "speaker": "Элара", "text": "Они создали оружие, которое теперь направлено на них самих."}, {"type": "narration", "speaker": null, "text": "Она кивнула. Медленно и весомо. Союз был заключен."}, {"type": "dialogue", "speaker": "Элара", "text": "Очень хорошо, Чистильщик. Давай устроим им войну."}], "choices": [], "summary": "Рэй прибывает в убежище Элары и, представив украденные данные, убеждает ее помочь. Вместе они вскрывают зашифрованный файл, раскрывая предательство 'Эгиды' (протокол 'Химера') и причину сбоя импланта. Потрясенный правдой, Рэй окончательно разрывает с прошлым и заключает с Эларой прагматичный союз для борьбы с корпорацией.", "branch_id": "main", "branch_order": 13}, "branch_01_scene_001": {"id": "branch_01_scene_001", "location": "Квартира Каэла", "pov_character": "Рэй", "present_characters": ["Рэй"], "lines": [{"type": "narration", "speaker": null, "text": "С шипением гидравлики двери штаб-квартиры «Эгиды» сомкнулись за спиной, отрезая его от мира стерильной стали и приглушенных приказов."}, {"type": "narration", "speaker": null, "text": "Рэй шагнул в вечную, моросящую ночь Нижнего Гелиоса. Неоновые иероглифы и голографическая реклама расплывались на мокром асфальте, превращая улицу в реку жидкого света и теней."}, {"type": "narration", "speaker": null, "text": "Воздух был густым, пропитанным запахом озона, жареной лапши и влажного бетона. Контраст с отфильтрованным воздухом корпорации был так резок, что казался ударом."}, {"type": "thought", "speaker": "Рэй", "text": "Из центра управления — обратно в муравейник. Всего десять минут пути, а будто другая планета."}, {"type": "narration", "speaker": null, "text": "Он шёл, не замечая толпы, его взгляд был устремлен в никуда. Безликий лифт в его жилом блоке поднял его на семьдесят второй ярус."}, {"type": "narration", "speaker": null, "text": "Щелчок электронного замка. Дверь открылась в спартанскую тишину его квартиры."}, {"type": "narration", "speaker": null, "text": "Здесь не было ничего лишнего: койка, шкаф, стол. Единственным живым пятном был экран терминала, оставленный включенным."}, {"type": "narration", "speaker": null, "text": "На дисплее, словно ядовитая игла, светилась одна-единственная строка лога, которую он вытащил из буфера своей руки."}, {"type": "thought", "speaker": "Рэй", "text": "SYS.ARM.DEACTIVATE_FORCED. Source_ID: Aegis_Internal_Secure_Channel_7."}, {"type": "thought", "speaker": "Рэй", "text": "Внутренний. Защищенный. Канал."}, {"type": "narration", "speaker": null, "text": "Каждое слово — молот, бьющий по основанию его мира. Факт, холодный и неопровержимый, как сталь."}, {"type": "thought", "speaker": "Рэй", "text": "Они отключили меня. В разгар боя."}, {"type": "narration", "speaker": null, "text": "Перед глазами снова всплыло лицо директора Валериуса — ледяная маска безразличия. «Дефектный актив»."}, {"type": "thought", "speaker": "Рэй", "text": "И Элиас... Куда его забрали? «На изучение». Как образец, а не как раненого солдата."}, {"type": "narration", "speaker": null, "text": "Комнату качнуло. Рэй вцепился пальцами в край стола. Его кибернетическая левая рука сжалась с такой силой, что полимер столешницы заскрипел."}, {"type": "thought", "speaker": "Рэй", "text": "Предательство. Это слово пульсировало в висках, вызывая тошноту."}, {"type": "thought", "speaker": "Рэй", "text": "Нет. Стоп. Дышать."}, {"type": "narration", "speaker": null, "text": "Он заставил себя сделать глубокий, прерывистый вдох. Паника — это слабость. Паника — это то, чего ждет враг."}, {"type": "thought", "speaker": "Рэй", "text": "Враг..."}, {"type": "narration", "speaker": null, "text": "В глубинах памяти, за слоями боевых протоколов, всплыли обрывки лекций из академии. Инструктаж 7-Б: «Психологическая целостность оперативника»."}, {"type": "thought", "speaker": "Рэй", "text": "«Враг не всегда использует пули. Самое опасное оружие — информация. Ментальный вирус, способный имитировать внутренние команды, сеять паранойю, разрушать доверие...»"}, {"type": "thought", "speaker": "Рэй", "text": "«...его цель — не система, а люди. Самые верные солдаты. Сломать их — значит сломать весь строй»."}, {"type": "narration", "speaker": null, "text": "Эта мысль была спасательным кругом в ледяном океане отчаяния. Он вцепился в нее обеими руками."}, {"type": "thought", "speaker": "Рэй", "text": "Конечно. Это не предательство. Это атака. Просто более хитрая, более коварная."}, {"type": "thought", "speaker": "Рэй", "text": "Должно быть так. Иначе... иначе всё, во что я верил, вся моя жизнь — пепел."}, {"type": "narration", "speaker": null, "text": "Когнитивный диссонанс, разрывавший его на части, начал утихать, вытесняемый знакомой, спасительной яростью."}, {"type": "thought", "speaker": "Рэй", "text": "Сбой импланта. Шепот вампира. Холодность Валериуса. Это не отдельные события. Это скоординированный удар."}, {"type": "thought", "speaker": "Рэй", "text": "Они хотят, чтобы я поверил, что «Эгида» — враг. Хотят, чтобы я сломался, усомнился, стал предателем."}, {"type": "thought", "speaker": "Рэй", "text": "Я не доставлю им такого удовольствия."}, {"type": "narration", "speaker": null, "text": "Два пути, что стояли перед ним мгновение назад, слились в один. Вернее, один из них оказался ловушкой, иллюзией."}, {"type": "thought", "speaker": "Рэй", "text": "Признать, что вся моя служба — ложь? Или найти невидимого врага и вырвать его с корнем?"}, {"type": "thought", "speaker": "Рэй", "text": "Это не выбор. Это приказ, который я отдаю сам себе."}, {"type": "narration", "speaker": null, "text": "Решение, острое и ясное, как лазерный целеуказатель, кристаллизовалось в его мозгу."}, {"type": "thought", "speaker": "Рэй", "text": "Я найду этот «вирус». Я должен найти доказательства его существования."}, {"type": "thought", "speaker": "Рэй", "text": "Проследить его сигнатуру в системных архивах «Эгиды». Вытащить на свет."}, {"type": "thought", "speaker": "Рэй", "text": "Это будет моя личная, неофициальная миссия. Восстановить порядок. Доказать свою верность — не Валериусу, а идеалам, на которых стоит «Эгида»."}, {"type": "narration", "speaker": null, "text": "И тут же, словно эхо сомнения, по спине пробежал ледяной холодок."}, {"type": "thought", "speaker": "Рэй", "text": "А что, если в архивах ничего нет?"}, {"type": "narration", "speaker": null, "text": "Мысль была быстрой и коварной, как удар стилета."}, {"type": "thought", "speaker": "Рэй", "text": "Или хуже... что, если логи подчищены? Отредактированы, чтобы скрыть... что?"}, {"type": "narration", "speaker": null, "text": "Он с силой тряхнул головой, отгоняя наваждение. Физическое движение, чтобы выбить мысль из головы."}, {"type": "thought", "speaker": "Рэй", "text": "Нет. Это тоже часть атаки. Ментальный вирус уже во мне. Сеет страх, заставляет бояться правды, парализует волю."}, {"type": "thought", "speaker": "Рэй", "text": "Не сработает."}, {"type": "thought", "speaker": "Рэй", "text": "Я солдат. Я действую. Сомнения — это роскошь, которую я не могу себе позволить."}, {"type": "narration", "speaker": null, "text": "В голове уже выстраивался четкий, пошаговый план действий."}, {"type": "thought", "speaker": "Рэй", "text": "Мой допуск к защищенному техническому архиву. Он всё ещё действителен. Они посадили меня под арест, но забыли отозвать права. Или не сочли нужным."}, {"type": "thought", "speaker": "Рэй", "text": "Их ошибка. Мой шанс."}, {"type": "thought", "speaker": "Рэй", "text": "Я получу доступ к центральным логам. Найду временные метки, совпадающие со сбоем. Буду искать аномалии, любые следы внешнего вторжения, даже самые незначительные."}, {"type": "narration", "speaker": null, "text": "Паника отступила окончательно. На её место пришла холодная, звенящая решимость, знакомая и успокаивающая."}, {"type": "thought", "speaker": "Рэй", "text": "Я больше не жертва. Не дефектный актив."}, {"type": "thought", "speaker": "Рэй", "text": "Я охотник."}, {"type": "narration", "speaker": null, "text": "Это чувство возвращало контроль. Давало цель. Превращало хаос в задачу с понятными параметрами."}, {"type": "thought", "speaker": "Рэй", "text": "Я найду тебя, сволочь. Кто бы ты ни был. И вырву из системы с корнем."}, {"type": "narration", "speaker": null, "text": "Рэй выпрямился, отходя от терминала. Его рука сама потянулась к воротнику униформы, машинально одергивая его, словно перед построением."}, {"type": "narration", "speaker": null, "text": "Он не стал включать свет в темной комнате. Его путь и так был ясен."}, {"type": "narration", "speaker": null, "text": "Не оборачиваясь на одиноко светящийся экран, он направился к выходу."}, {"type": "thought", "speaker": "Рэй", "text": "Миссия начинается."}], "choices": [], "summary": "Вернувшись в свою квартиру, Рэй сталкивается с неопровержимым доказательством саботажа — логом отключения его импланта по внутреннему каналу 'Эгиды'. Переживая приступ когнитивного диссонанса, он цепляется за идеологию корпорации, убеждая себя, что это сложная психологическая атака врага, 'ментальный вирус'. Подавив страх и сомнения, он решает использовать свой не отозванный допуск, чтобы проникнуть в архивы и найти доказательства внешней диверсии, тем самым подтвердив свою непоколебимую верность.", "branch_id": "branch_01", "branch_order": 1}, "branch_01_scene_002": {"id": "branch_01_scene_002", "location": "Защищенный технический архив 'Эгиды'", "pov_character": "Рэй", "present_characters": ["Рэй"], "lines": [{"type": "narration", "speaker": null, "text": "Дверь квартиры захлопнулась за его спиной, отрезая темноту и одиноко светящийся монитор."}, {"type": "narration", "speaker": null, "text": "Рэй не спускался на лифте — он двигался по служебным лестницам, тенью скользя по бетонным артериям башни."}, {"type": "narration", "speaker": null, "text": "Неоновые вывески Нижнего Гелиоса остались далеко внизу, когда он пересек стерильный мост в главный корпус штаб-квартиры 'Эгиды'."}, {"type": "narration", "speaker": null, "text": "Здесь воздух был другим. Фильтрованным, холодным, без запаха дождя и отчаяния."}, {"type": "narration", "speaker": null, "text": "Его допуск, еще не отозванный, открыл ему путь в самые недра — к тяжелой титановой двери с лаконичной надписью: 'Защищенный технический архив'."}, {"type": "narration", "speaker": null, "text": "Шипение пневматики, и дверь отъехала в сторону, выпустив облако ледяного воздуха. Внутри монотонно гудели стойки серверов, их светодиоды мигали, как далекие звезды в упорядоченной галактике."}, {"type": "thought", "speaker": "Рэй", "text": "Порядок. Вот чего они хотели меня лишить. Порядка в моей голове."}, {"type": "narration", "speaker": null, "text": "Холодный, стерильный воздух архива был как бальзам. Он пах озоном и безразличной мощью машин."}, {"type": "thought", "speaker": "Рэй", "text": "Здесь нет места магии. Нет места хаосу. Только логика и сталь."}, {"type": "narration", "speaker": null, "text": "Он подошел к единственному терминалу доступа. Его движения были отточенными, экономичными, как у хирурга перед операцией."}, {"type": "narration", "speaker": null, "text": "Рэй подключил интерфейсный кабель из предплечья к порту. В его оптике вспыхнули строки кода."}, {"type": "narration", "speaker": null, "text": "Система мгновенно опознала его допуск высшего уровня, предоставляя прямой доступ к нервной системе 'Эгиды'."}, {"type": "thought", "speaker": "Рэй", "text": "Я не взломщик. Я санитар. Я здесь, чтобы вычистить инфекцию."}, {"type": "narration", "speaker": null, "text": "Он ввел свой идентификатор и временные метки последней миссии. На экране развернулись логи его имплантов — сухая, безжалостная хроника."}, {"type": "thought", "speaker": "Рэй", "text": "Ищи след вторжения. Внешний пакет. Аномальный сигнал. Докажи, что это была она. Докажи, что я прав."}, {"type": "narration", "speaker": null, "text": "И он нашел. Строка, выделенная красным маркером системной тревоги."}, {"type": "narration", "speaker": null, "text": "КОМАНДА: SYS.ARM.DEACTIVATE_FORCED."}, {"type": "narration", "speaker": null, "text": "Сердце, настоящее, живое, пропустило удар. Его здоровая кибернетическая рука непроизвольно сжалась в кулак."}, {"type": "thought", "speaker": "Рэй", "text": "Вот оно. Доказательство."}, {"type": "narration", "speaker": null, "text": "Он заставил себя прокрутить данные дальше, к источнику сигнала."}, {"type": "narration", "speaker": null, "text": "ИСТОЧНИК: AEGIS.INTERNAL.SECURE_CH."}, {"type": "thought", "speaker": "Рэй", "text": "Что?"}, {"type": "narration", "speaker": null, "text": "На мгновение гул серверов показался оглушающим. Стены сомкнулись. Этого не могло быть. Это ломало все."}, {"type": "thought", "speaker": "Рэй", "text": "Внутренний... защищенный канал... Нет. Невозможно."}, {"type": "narration", "speaker": null, "text": "Холодный пот выступил на лбу. Червь сомнения, которого он так старательно давил, снова зашевелился."}, {"type": "thought", "speaker": "Рэй", "text": "Нет. Это слишком просто. Слишком очевидно. Они бы не оставили такой след. Валериус бы не оставил."}, {"type": "thought", "speaker": "Рэй", "text": "Это подделка. Маскировка. Психологическая операция. Нас учили этому. Имитация внутренних сигналов — высший пилотаж вражеского саботажа."}, {"type": "narration", "speaker": null, "text": "Он вцепился в эту мысль, как утопающий в спасательный круг. Ярость, холодная и чистая, начала вытеснять ледяной ужас."}, {"type": "thought", "speaker": "Рэй", "text": "Проверка. Это проверка моей веры. И я ее пройду."}, {"type": "narration", "speaker": null, "text": "Он начал анализировать пакет данных, связанный с командой отключения, ища настоящий вирус, скрытый за этой фальшивкой."}, {"type": "thought", "speaker": "Рэй", "text": "Должен быть след. Метка. Что-то, что выдаст их."}, {"type": "narration", "speaker": null, "text": "И там, в «шуме», в потоке случайных битов, он увидел это."}, {"type": "narration", "speaker": null, "text": "Это не было кодом. Это был образ, едва заметный, мерцающий, вплетенный в саму структуру данных."}, {"type": "narration", "speaker": null, "text": "Изящная, витиеватая вязь, похожая на терновую ветвь, обвивающую сломанный меч."}, {"type": "narration", "speaker": null, "text": "У Рэя перехватило дыхание. Перед глазами вспыхнул образ из театра: запах пыли, отблеск света на серебряной пряжке ее пояса, ее насмешливый взгляд."}, {"type": "narration", "speaker": null, "text": "Это был ее символ. Символ Элары."}, {"type": "thought", "speaker": "Рэй", "text": "Вот он. Вот он, твой яд."}, {"type": "thought", "speaker": "Рэй", "text": "Не просто сбой. Не просто ложь. Ты оставила свой грязный след в моей системе. В моей голове."}, {"type": "narration", "speaker": null, "text": "Все встало на свои места. Неуверенность, сомнения, вопросы к Валериусу — все это было не его. Это были симптомы заражения."}, {"type": "thought", "speaker": "Рэй", "text": "Ментальный вирус. Отрава для разума."}, {"type": "thought", "speaker": "Рэй", "text": "Ты хотела сломать меня изнутри. Сделать таким же, как ты, — сомневающимся, слабым, гнилым."}, {"type": "narration", "speaker": null, "text": "Его миссия стала кристально ясной. Не просто найти доказательства. Очистить. Стереть эту скверну из архивов «Эгиды» и из собственной памяти."}, {"type": "narration", "speaker": null, "text": "Пальцы метнулись по виртуальной клавиатуре, вызывая протокол полного стирания."}, {"type": "narration", "speaker": null, "text": "На экране вспыхнул запрос, написанный кроваво-красным шрифтом."}, {"type": "narration", "speaker": null, "text": "УДАЛИТЬ ЛОГИ [ID: 734-B4-KAELLUS] ЗА УКАЗАННЫЙ ПЕРИОД? ДЕЙСТВИЕ НЕОБРАТИМО."}, {"type": "narration", "speaker": null, "text": "Подтвердить? [ДА/НЕТ]"}, {"type": "thought", "speaker": "Рэй", "text": "Стереть слабость. Стереть сомнение. Стереть *ее*."}, {"type": "narration", "speaker": null, "text": "Он нажал на подтверждение без малейшего колебания."}, {"type": "narration", "speaker": null, "text": "Строки данных, отмеченные красным, исчезли. Символ Элары растворился. Вся история сбоя, предательства и сомнений превратилась в пустоту."}, {"type": "narration", "speaker": null, "text": "По телу Рэя прокатилась волна чистого, холодного облегчения. Словно с плеч свалился невидимый груз."}, {"type": "thought", "speaker": "Рэй", "text": "Я чист."}, {"type": "narration", "speaker": null, "text": "Монотонный гул серверов больше не давил, а успокаивал. Это был гимн порядку, который он только что восстановил."}, {"type": "narration", "speaker": null, "text": "Он отсоединил кабель. Система была в порядке. Солдат был в порядке."}, {"type": "thought", "speaker": "Рэй", "text": "Идеальный солдат."}, {"type": "narration", "speaker": null, "text": "Рэй развернулся. Его шаг был тверд, плечи расправлены."}, {"type": "narration", "speaker": null, "text": "Теперь оставалось только одно — доложить директору Валериусу об успешно устраненной внутренней угрозе."}], "choices": [], "summary": "Проникнув в архив 'Эгиды', Рэй находит лог, подтверждающий внутренний саботаж его импланта. Однако, обнаружив в данных символ, связанный с вампиром Эларой, он трактует это как 'ментальный вирус' и доказательство вражеской диверсии. Убежденный в своей правоте, он стирает компрометирующие файлы, чтобы очиститься от сомнений и доказать свою верность.", "branch_id": "branch_01", "branch_order": 2}, "branch_01_scene_003": {"id": "branch_01_scene_003", "location": "Кабинет директора Валериуса", "pov_character": "Рэй", "present_characters": ["Рэй", "Валериус"], "lines": [{"type": "narration", "speaker": null, "text": "Глухое шипение пневматики — и двери архива сомкнулись за спиной Рэя, отсекая его от совершенного им святотатства. Он не оглянулся. Шаг чеканил ритм по стерильному полимеру коридоров штаб-квартиры."}, {"type": "narration", "speaker": null, "text": "Безмолвный лифт уносил его вверх, сквозь этажи корпоративного улья. В полированных стенах кабины Рэй видел свое отражение — не человека, но безупречный силуэт солдата."}, {"type": "narration", "speaker": null, "text": "Его кибернетический глаз горел ровным синим светом, лишенным сомнений."}, {"type": "thought", "speaker": "Рэй", "text": "Я — не винтик. Я — скальпель. Очищенный и заново заостренный."}, {"type": "narration", "speaker": null, "text": "Мягкий звон возвестил о прибытии на вершину мира. Двери из полированного обсидиана с выгравированным логотипом 'Эгиды' разошлись в стороны. Рэй вошел без стука."}, {"type": "narration", "speaker": null, "text": "Кабинет директора Валериуса был огромен и почти пуст. Панорамная стена от пола до потолка превращала утопающий в дожде и неоне город в живую карту власти, расстеленную у ног владельца."}, {"type": "narration", "speaker": null, "text": "Молнии далекой грозы беззвучно рвали фиолетовое небо, но здесь, наверху, царила абсолютная, стерильная тишина."}, {"type": "narration", "speaker": null, "text": "Валериус стоял у окна, спиной к двери, словно властелин, обозревающий свои владения. Его фигура была темным силуэтом на фоне огней мегаполиса."}, {"type": "narration", "speaker": null, "text": "Рэй замер в десяти шагах, приняв уставную стойку. Тишина в кабинете была тяжелой, давящей, наполненной невысказанным ожиданием."}, {"type": "dialogue", "speaker": "Рэй", "text": "Директор Валериус. Агент Рэй, оперативный номер семь. Прибыл с докладом по инциденту в секторе Гамма-7."}, {"type": "narration", "speaker": null, "text": "Валериус медленно обернулся. Его лицо, как всегда, не выражало ничего, кроме холодной, хищной внимательности. Глаза сканировали Рэя, оценивая."}, {"type": "dialogue", "speaker": "Валериус", "text": "Докладывайте, агент."}, {"type": "thought", "speaker": "Рэй", "text": "Правда — это то, что служит цели. Моя цель — 'Эгида'."}, {"type": "dialogue", "speaker": "Рэй", "text": "В ходе операции зафиксирована попытка несанкционированного ментального воздействия со стороны цели. Классификация: меметический вирус высокого уровня угрозы."}, {"type": "dialogue", "speaker": "Рэй", "text": "Источник атаки — аномалия класса 'Вампир', кодовое имя 'Элара'. Воздействие вызвало временную дестабилизацию моих систем, имитирующую технический сбой импланта."}, {"type": "dialogue", "speaker": "Рэй", "text": "Согласно протоколу информационной гигиены 'Омега', я локализовал и уничтожил зараженные сегменты данных, чтобы предотвратить распространение вируса по сети 'Эгиды'. Целостность системы восстановлена."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я также провел самодиагностику по закрытому контуру. Никаких остаточных следов заражения. Я полностью функционален."}, {"type": "narration", "speaker": null, "text": "Он говорил о стертых логах как о необходимой санитарной мере. О доказательствах предательства 'Эгиды' — как о вражеской химере."}, {"type": "dialogue", "speaker": "Рэй", "text": "Система чиста. Угроза устранена."}, {"type": "narration", "speaker": null, "text": "Валериус молчал несколько долгих секунд, его глаза сканировали Рэя, будто искали трещины в броне. Но трещин не было. Рэй сам заделал их, залив жидкой сталью слепой веры."}, {"type": "dialogue", "speaker": "Валериус", "text": "Меметический вирус... Интересная тактика. Они становятся все изобретательнее в своей агонии."}, {"type": "narration", "speaker": null, "text": "Он обошел свой массивный стол из черного мрамора, приблизившись к Рэю. Его голос стал тише, почти доверительным."}, {"type": "dialogue", "speaker": "Валериус", "text": "Жаль, что агент Грей оказался так восприимчив. К слабости."}, {"type": "thought", "speaker": "Рэй", "text": "Элиас. Вот оно. Проверка. Ловушка для тех, кто еще человек."}, {"type": "dialogue", "speaker": "Рэй", "text": "Слабость — это зараза, директор. Я искоренил ее. В себе."}, {"type": "narration", "speaker": null, "text": "В голосе Рэя не было ни капли сожаления. Только холодная, отточенная сталь убежденности. Он отрекся от напарника так же легко, как удалил файл."}, {"type": "narration", "speaker": null, "text": "По губам Валериуса скользнула едва заметная, хищная улыбка. Удовлетворение хирурга, убедившегося в точности работы своего инструмента."}, {"type": "dialogue", "speaker": "Валериус", "text": "Выдающаяся способность к самокоррекции, Рэй. Именно это делает вас нашим самым ценным активом."}, {"type": "thought", "speaker": "Рэй", "text": "Актив. Да. Я — актив. Целостный. Функциональный."}, {"type": "dialogue", "speaker": "Валериус", "text": "Мы и раньше сталкивались с подобными ментальными атаками. Они бьют по привязанностям, по сомнениям... по всему, что делает солдата человеком, а значит — уязвимым. Вы же действовали по высшему протоколу — инстинктивно."}, {"type": "dialogue", "speaker": "Валериус", "text": "Другой бы запаниковал, запросил бы диагностику, привлек бы ненужное внимание. Посеял бы хаос. Вы же — вы провели хирургическую ампутацию угрозы."}, {"type": "narration", "speaker": null, "text": "Валериус говорил, и ложь становилась истиной. Он строил для Рэя новую реальность на руинах старой, и Рэй с готовностью в ней обживался, находя опору."}, {"type": "dialogue", "speaker": "Валериус", "text": "Вы выдержали, Рэй. Вы доказали свою целостность. Такая стойкость должна быть вознаграждена."}, {"type": "narration", "speaker": null, "text": "Директор вернулся за свой стол и вызвал на голографический дисплей новый файл с грифом 'Абсолют'."}, {"type": "narration", "speaker": null, "text": "Его движения были точны и экономичны, как у хищника, готовящегося к удару."}, {"type": "dialogue", "speaker": "Валериус", "text": "Есть цель. Особо важная. Требует не просто силы, но абсолютной убежденности. Чистоты."}, {"type": "thought", "speaker": "Рэй", "text": "Чистота требует действия. Сила требует применения. Это мой шанс."}, {"type": "dialogue", "speaker": "Рэй", "text": "Готов выполнить приказ, директор."}, {"type": "narration", "speaker": null, "text": "В его голосе звенел фанатичный огонь. Солдат, вернувшийся из ереси сомнений, стал самым верным из воинов."}, {"type": "dialogue", "speaker": "Валериус", "text": "Я в этом не сомневался. Ознакомьтесь с делом. Вы действуете в одиночку. Это награда и знак высшего доверия."}, {"type": "narration", "speaker": null, "text": "Он жестом отпустил Рэя. Рэй четко развернулся, чтобы уйти."}, {"type": "dialogue", "speaker": "Валериус", "text": "И, Рэй..."}, {"type": "narration", "speaker": null, "text": "Рэй замер, не оборачиваясь."}, {"type": "dialogue", "speaker": "Валериус", "text": "Мы — твоя единственная семья. Помни это."}, {"type": "dialogue", "speaker": "Рэй", "text": "Помню, директор."}, {"type": "narration", "speaker": null, "text": "Он вышел, и двери из обсидиана сомкнулись за ним, оставляя Валериуса наедине с панорамой покорённого города."}, {"type": "thought", "speaker": "Рэй", "text": "Семья. Доверие. Долг. Все стало на свои места. Я снова чист."}], "choices": [], "summary": "Рэй прибывает в кабинет директора Валериуса и докладывает, что сбой импланта был результатом вражеской 'ментальной атаки' от вампира Элары, а уничтожение логов — необходимой мерой. Валериус мастерски подыгрывает его заблуждению, хвалит за 'самокоррекцию', проверяет его лояльность упоминанием Элиаса и, убедившись в его полном подчинении, вознаграждает новой одиночной миссией. Рэй уходит, еще глубже погрязнув в самообмане и укрепившись в своей роли идеального солдата корпорации.", "branch_id": "branch_01", "branch_order": 3}, "branch_01_scene_004": {"id": "branch_01_scene_004", "location": "Штаб-квартира корпорации 'Эгида'", "pov_character": "Рэй", "present_characters": ["Рэй", "Валериус"], "lines": [{"type": "narration", "speaker": null, "text": "Рэй стоял неподвижно в центре кабинета директора Валериуса. Бесшумный лифт доставил его на вершину шпиля 'Эгиды', и теперь он ждал, вытянувшись в струну. Идеальный солдат."}, {"type": "narration", "speaker": null, "text": "За огромным столом из полированного обсидиана, спиной к панорамному окну, сидел сам директор. Его силуэт был вырезан на фоне неонового гобелена ночного города. Он не спешил."}, {"type": "thought", "speaker": "Рэй", "text": "Спокойствие. Порядок. Я очистился от скверны. Я снова на своем месте."}, {"type": "narration", "speaker": null, "text": "Тишину нарушил тихий щелчок. Валериус закрыл терминал и медленно повернул кресло. Его глаза, холодные и проницательные, сканировали Рэя, словно оценивая качество заточки инструмента."}, {"type": "dialogue", "speaker": "Валериус", "text": "Рэй. Я прочел твой рапорт. И ознакомился с... корректировками, которые ты внес в системные логи."}, {"type": "narration", "speaker": null, "text": "В голосе директора не было осуждения. Только ледяное, почти научное любопытство."}, {"type": "dialogue", "speaker": "Валериус", "text": "Впечатляющая демонстрация психологической стойкости. Настоящая самокоррекция в полевых условиях. Ты подавил меметическую инфекцию."}, {"type": "thought", "speaker": "Рэй", "text": "Он понял. Он оценил. Я все сделал правильно."}, {"type": "dialogue", "speaker": "Рэй", "text": "Слабость была вычищена, директор. Система была скомпрометирована, но я провел полную санацию. Моя верность корпорации абсолютна."}, {"type": "narration", "speaker": null, "text": "Валериус одобрительно кивнул, его губы тронула едва заметная улыбка."}, {"type": "dialogue", "speaker": "Валериус", "text": "Именно поэтому ты здесь, а другие — нет. Не у всех хватает силы воли, чтобы побороть заразу. Это урок, который мы должны усвоить."}, {"type": "narration", "speaker": null, "text": "Он сделал паузу, давая словам впитаться."}, {"type": "dialogue", "speaker": "Валериус", "text": "Твой бывший напарник, Элиас... он оказался слишком восприимчив. Его система не выдержала. Он поддался вирусу сомнений."}, {"type": "thought", "speaker": "Рэй", "text": "Элиас. Слабость. Зараза. Он позволил сомнениям пустить корни. Закономерный итог."}, {"type": "narration", "speaker": null, "text": "Рэй не дрогнул. Имя Элиаса больше не вызывало в нем ничего, кроме холодного подтверждения своей правоты."}, {"type": "dialogue", "speaker": "Валериус", "text": "Сейчас он в карантинном блоке. На глубоком изучении. Мы должны препарировать слабость, чтобы понять, как защитить от нее сильных. Его жертва не будет напрасной."}, {"type": "thought", "speaker": "Рэй", "text": "Правильно. Его пример послужит общему делу. Укрепит 'Эгиду'."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я понимаю, директор."}, {"type": "dialogue", "speaker": "Валериус", "text": "Я знаю, что понимаешь. Ты доказал свою ценность. И за выдающуюся преданность положена награда."}, {"type": "narration", "speaker": null, "text": "Валериус поднялся и подошел к окну, обводя взглядом город под ними."}, {"type": "dialogue", "speaker": "Валериус", "text": "Новая миссия. Особо важная. Высшая степень доверия."}, {"type": "narration", "speaker": null, "text": "Сердце Рэя забилось чаще, но не от волнения, а от предвкушения. От чувства возвращенной цели."}, {"type": "dialogue", "speaker": "Валериус", "text": "Мы обнаружили очаг аномальной активности. По нашим данным, он может быть напрямую связан с источником того ментального вируса, что тебя поразил."}, {"type": "thought", "speaker": "Рэй", "text": "Элара. Вампирша. Источник скверны."}, {"type": "narration", "speaker": null, "text": "Имя вспыхнуло в его сознании, как мишень в прицеле. Это не просто миссия. Это возмездие."}, {"type": "dialogue", "speaker": "Валериус", "text": "Этот очаг необходимо... стерилизовать. Быстро и окончательно. Поэтому ты пойдешь один."}, {"type": "narration", "speaker": null, "text": "Рэй выпрямился еще сильнее, если это было возможно. В его глазах горел холодный огонь фанатика."}, {"type": "dialogue", "speaker": "Рэй", "text": "Приказ принят, директор."}, {"type": "narration", "speaker": null, "text": "Ни единого вопроса. Ни тени сомнения."}, {"type": "thought", "speaker": "Рэй", "text": "Я выжгу эту заразу. Лично."}, {"type": "narration", "speaker": null, "text": "Валериус обернулся. На его лице играла отеческая, покровительственная улыбка."}, {"type": "dialogue", "speaker": "Валериус", "text": "Я и не сомневался в тебе, Рэй. Ты — наше лучшее творение. Наш щит."}, {"type": "thought", "speaker": "Рэй", "text": "Семья. Доверие. Долг."}, {"type": "dialogue", "speaker": "Валериус", "text": "Иди. Очисти этот мир от скверны."}, {"type": "dialogue", "speaker": "Рэй", "text": "Будет исполнено."}, {"type": "narration", "speaker": null, "text": "Он четко развернулся и пошел к выходу. Его шаг был тверд и уверен. Двери из обсидиана сомкнулись за ним, оставляя Валериуса наедине с панорамой покорённого города."}], "choices": [], "summary": "Рэй докладывает директору Валериусу о своей 'самокоррекции'. Валериус подыгрывает его заблуждению о 'ментальном вирусе', хвалит за стойкость и использует судьбу Элиаса как предостережение. В качестве 'награды' Рэй получает одиночную миссию по уничтожению источника 'вируса', окончательно превращаясь в фанатично преданное оружие корпорации.", "branch_id": "branch_01", "branch_order": 4}, "branch_01_scene_005": {"id": "branch_01_scene_005", "location": "Штаб-квартира корпорации 'Эгида'", "pov_character": "Рэй", "present_characters": ["Рэй"], "lines": [{"type": "narration", "speaker": null, "text": "Двери кабинета Валериуса остались позади. Коридоры штаб-квартиры были тихи и пустынны, словно вымерли, провожая его."}, {"type": "narration", "speaker": null, "text": "Но Рэй не шел в свои апартаменты. Его путь лежал глубже, в самое сердце машины войны 'Эгиды' — в оружейный отсек."}, {"type": "narration", "speaker": null, "text": "Помещение встретило его стерильным холодом и запахом оружейной смазки. Белый свет диодных панелей отражался от полированной стали столов и стоек с оружием."}, {"type": "narration", "speaker": null, "text": "Он был здесь один. Абсолютно один."}, {"type": "thought", "speaker": "Рэй", "text": "Как и должно быть. Лишние элементы лишь вносят погрешность."}, {"type": "narration", "speaker": null, "text": "Рэй двигался с выверенной, почти механической точностью. Ни одного лишнего движения. Он выложил на стол стандартный набор для ликвидатора: импульсную винтовку, плазменный пистолет, несколько гранат."}, {"type": "narration", "speaker": null, "text": "Его взгляд упал на левую руку. Кибернетический протез, что предал его в бою."}, {"type": "narration", "speaker": null, "text": "Он медленно поднял ее, рассматривая в ярком свете. Металлические пластины, сплетение сервоприводов. Раньше он видел в ней лишь инструмент. Потом — предателя."}, {"type": "thought", "speaker": "Рэй", "text": "Теперь я вижу правду. Она была заражена. Инфицирована. Но я выстоял."}, {"type": "narration", "speaker": null, "text": "Он сжал пальцы в кулак. Сервомоторы отозвались ровным, мощным гулом. Никаких сбоев. Никаких отклонений."}, {"type": "thought", "speaker": "Рэй", "text": "Система прошла самокоррекцию. Очистилась. Стала сильнее."}, {"type": "narration", "speaker": null, "text": "Холодная, контролируемая сила наполнила его. Это было не просто ощущение — это было подтверждение. Доказательство его правоты."}, {"type": "narration", "speaker": null, "text": "Он взял со стола свой датапад. На экране светились строки приказа."}, {"type": "narration", "speaker": null, "text": "СТАТУС: ОДИНОЧНАЯ."}, {"type": "narration", "speaker": null, "text": "ЗАДАЧА: ЛИКВИДАЦИЯ ИСТОЧНИКА МЕМЕТИЧЕСКОЙ ИНФЕКЦИИ."}, {"type": "thought", "speaker": "Рэй", "text": "Не человек. Не существо. Источник. Угроза, подлежащая устранению. Как вирус. Как раковая опухоль."}, {"type": "narration", "speaker": null, "text": "Он думал о цели — вампире Эларе — без всяких эмоций. Просто набор данных, координат и вероятностных моделей поведения."}, {"type": "thought", "speaker": "Рэй", "text": "Она пыталась заразить мой разум ложью, посеять сомнения. Слабость — вот её главное оружие."}, {"type": "narration", "speaker": null, "text": "На мгновение в памяти всплыл другой образ — испуганное лицо Элиаса, лежащего на полу театра."}, {"type": "thought", "speaker": "Рэй", "text": "Он поддался. Позволил страху и сомнениям проникнуть в систему. Его судьба — закономерный итог."}, {"type": "thought", "speaker": "Рэй", "text": "Карантин — это не наказание. Это изоляция дефектного элемента. Урок для всех остальных."}, {"type": "narration", "speaker": null, "text": "Ни капли жалости. Лишь холодное, отстраненное презрение к слабости, которую он сам в себе искоренил."}, {"type": "narration", "speaker": null, "text": "Он снова посмотрел на статус миссии. 'Одиночная'."}, {"type": "thought", "speaker": "Рэй", "text": "Это не просто приказ. Это награда. Высшая степень доверия. Директор Валериус верит в меня."}, {"type": "thought", "speaker": "Рэй", "text": "Он увидел мою стойкость и вознаградил меня возможностью завершить очищение."}, {"type": "narration", "speaker": null, "text": "Рэй ощутил почти эйфорическую ясность. Все сомнения, вся боль, вся рефлексия прошлого — всё это было смыто."}, {"type": "narration", "speaker": null, "text": "Осталась только цель. Чистая, абсолютная, непоколебимая."}, {"type": "thought", "speaker": "Рэй", "text": "Я — идеальный солдат. Оружие в руках тех, кто строит будущее."}, {"type": "narration", "speaker": null, "text": "Он закончил проверку снаряжения и начал облачаться в боевую броню."}, {"type": "narration", "speaker": null, "text": "Нагрудник защелкнулся на месте. Затем поножи, наручи."}, {"type": "narration", "speaker": null, "text": "Последним он взял шлем."}, {"type": "narration", "speaker": null, "text": "Мгновение он смотрел на его темную, безликую поверхность."}, {"type": "narration", "speaker": null, "text": "Затем уверенным движением надел его. Раздался глухой щелчок герметизации."}, {"type": "narration", "speaker": null, "text": "Темный визор с тихим шипением опустился, скрывая его лицо."}, {"type": "thought", "speaker": "Рэй", "text": "Прощай, Рэй."}, {"type": "narration", "speaker": null, "text": "Мир превратился в тактический интерфейс: тепловые сигнатуры, векторы движения, данные о цели."}, {"type": "narration", "speaker": null, "text": "Он повернулся к полированной во всю высоту стене, служившей дверью."}, {"type": "narration", "speaker": null, "text": "В ней отразилась высокая, закованная в черную броню фигура."}, {"type": "narration", "speaker": null, "text": "Безликая. Бесстрастная. Совершенная."}, {"type": "narration", "speaker": null, "text": "Идеальное орудие корпорации."}, {"type": "thought", "speaker": "Рэй", "text": "Система в боевой готовности."}, {"type": "narration", "speaker": null, "text": "Он сделал шаг. Затем еще один."}, {"type": "narration", "speaker": null, "text": "Его поступь была твердой и гулкой, как удар молота по наковальне."}, {"type": "narration", "speaker": null, "text": "Стена-дверь бесшумно отъехала в сторону, открывая путь во тьму транспортного дока."}, {"type": "narration", "speaker": null, "text": "Он шагнул за порог без единого колебания."}, {"type": "narration", "speaker": null, "text": "Дверь закрылась за ним, отрезая свет оружейной. В полированной поверхности больше не было ничьего отражения."}, {"type": "narration", "speaker": null, "text": "Путь к правде для него был закрыт. Навсегда."}], "choices": [], "summary": "Рэй в одиночестве готовится к новой миссии, полностью приняв свою роль фанатичного солдата 'Эгиды'. Подавив все сомнения и презрев слабость бывшего напарника, он отправляется на задание, окончательно отрезав себе путь к правде и превратившись в безликое оружие корпорации.", "branch_id": "branch_01", "branch_order": 5}, "branch_02_scene_001": {"id": "branch_02_scene_001", "location": "Кабинет директора Валериуса", "pov_character": "Рэй", "present_characters": ["Рэй", "Сол Вэйн", "Валериус"], "lines": [{"type": "narration", "speaker": null, "text": "Рэй покинул Серые Зоны, оставив позади их приглушенную тишину и невысказанные угрозы. Возвращение в сердце города было сродни выныриванию из глубокой, темной воды."}, {"type": "narration", "speaker": null, "text": "Неоновые реки Нижнего Гелиоса слепили глаза, отражаясь в вечно мокром асфальте. Рекламные голограммы обещали вечную жизнь и идеальное тело, ядовито контрастируя с грязью, от которой Рэй только что сбежал."}, {"type": "thought", "speaker": "Рэй", "text": "Они продают иллюзию контроля, а сами давно его потеряли. Или... никогда и не теряли."}, {"type": "narration", "speaker": null, "text": "Штаб-квартира «Эгиды» — игла из стекла и стали, пронзающая хмурое небо. Скоростной лифт беззвучно вознес его на самый верх, где воздух был разреженным и холодным, как вакуум."}, {"type": "narration", "speaker": null, "text": "Двери в кабинет директора Валериуса разъехались, открывая вид на ночной город, раскинувшийся внизу, словно плата с мигающими диодами."}, {"type": "narration", "speaker": null, "text": "Но за массивным столом из обсидиана сидел не директор. У панорамного окна, спиной к огням мегаполиса, стоял Сол Вэйн."}, {"type": "thought", "speaker": "Рэй", "text": "Черт. Только не он."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Агент Рэй. Директор занят. Чем обязан столь срочному визиту, который не прошел через мой стол?"}, {"type": "narration", "speaker": null, "text": "Голос куратора был таким же холодным и полированным, как поверхность стола между ними."}, {"type": "dialogue", "speaker": "Рэй", "text": "Куратор Вэйн. У меня появились данные, которые требуют немедленных действий."}, {"type": "narration", "speaker": null, "text": "Рэй шагнул вперед, стараясь, чтобы голос звучал уверенно и ровно. Любая дрожь будет воспринята как слабость."}, {"type": "thought", "speaker": "Рэй", "text": "Придется лгать. И лгать убедительно."}, {"type": "dialogue", "speaker": "Рэй", "text": "Мой информатор, 'Призрак', вышел на связь. Он передал сведения о мистическом символе, который напрямую связан с вампиром."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "«Призрак»? Ваш теневой друг, который уже подводил нас? Продолжайте."}, {"type": "narration", "speaker": null, "text": "Сол даже не повернулся, его силуэт чернел на фоне огней города."}, {"type": "dialogue", "speaker": "Рэй", "text": "Символ — это ключ. Его можно использовать как приманку. Организовать трансляцию на определенной частоте в Серых Зонах. Она придет на зов."}, {"type": "thought", "speaker": "Рэй", "text": "Не зов, а угрозу. Она поймет, что у нас есть то, что она скрывает."}, {"type": "dialogue", "speaker": "Рэй", "text": "Мне нужен элитный отряд. Лучшие 'Чистильщики'. Я подготовлю засаду и покончу с этим раз и навсегда."}, {"type": "narration", "speaker": null, "text": "Наконец Сол медленно повернулся. На его лице не дрогнул ни один мускул."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Отказать."}, {"type": "dialogue", "speaker": "Рэй", "text": "Что?"}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Вы предлагаете рискованную авантюру, основанную на данных от сомнительного источника. Вы хотите поставить на кон жизни лучших оперативников ради домыслов? Я не санкционирую эту операцию."}, {"type": "dialogue", "speaker": "Рэй", "text": "Пока мы тут говорим, эта тварь где-то там! Она ранила Элиаса! Возможно, убивает других!"}, {"type": "narration", "speaker": null, "text": "Рэй сделал еще шаг вперед, сжав кибернетическую руку в кулак. Холодный расчет уступал место кипящей ярости."}, {"type": "dialogue", "speaker": "Рэй", "text": "Бездействие — это тоже риск! И он приведет к новым жертвам! Если вы не дадите мне отряд, я пойду один."}, {"type": "thought", "speaker": "Рэй", "text": "Я должен заставить его. Должен. Это единственный шанс вернуть Элиаса и получить ответы."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Довольно!"}, {"type": "narration", "speaker": null, "text": "Резкий окрик заставил Рэя замолчать. Ледяная маска Сола треснула. На мгновение в его глазах промелькнуло что-то похожее на боль."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Я не позволю вам повторить это. Не снова."}, {"type": "narration", "speaker": null, "text": "Он подошел к столу, его пальцы сжали полированную кромку."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Точно такая же самоуверенная авантюра... Точно такие же 'надежные данные'... Так я потерял Маркуса."}, {"type": "thought", "speaker": "Рэй", "text": "Маркуса? Его напарник... из той самой неудачной операции три года назад."}, {"type": "narration", "speaker": null, "text": "Рэй замер. Он читал отчет. 'Провал миссии, потеря оперативника'. Сухие строки протокола вдруг обрели вес человеческой жизни."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Он тоже рвался в бой. Убеждал, что у него есть верный способ выманить цель. Я его отпустил. И потом опознавал то, что от него осталось."}, {"type": "narration", "speaker": null, "text": "Голос Сола стал глуше, потеряв свою металлическую резкость."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Я не буду рисковать своим отрядом ради твоего отчаянного желания свести счеты."}, {"type": "narration", "speaker": null, "text": "Рэй смотрел на куратора, и впервые видел в нем не врага-бюрократа, а человека, раздавленного старой потерей."}, {"type": "thought", "speaker": "Рэй", "text": "Он не просто осторожничает. Он боится. Боится, что я повторю чужую ошибку. И его собственную."}, {"type": "dialogue", "speaker": "Рэй", "text": "Это не та же ситуация."}, {"type": "narration", "speaker": null, "text": "Рэй произнес это тихо, но твердо. Ярость ушла, сменившись чем-то другим. Пониманием."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я не Маркус. И я не прошу вас просто поверить мне. Я прошу дать мне инструмент, чтобы закончить войну. Это не месть. Это необходимость."}, {"type": "narration", "speaker": null, "text": "Сол Вэйн долго смотрел на него. Его взгляд изучал лицо Рэя, словно пытаясь найти там те же роковые черты, что и у погибшего напарника."}, {"type": "narration", "speaker": null, "text": "Наконец он отвернулся и подошел к своему терминалу."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Хорошо. Вы получите свой отряд. 'Стикс-7'. Лучшие из лучших."}, {"type": "thought", "speaker": "Рэй", "text": "Получилось..."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Но не потому, что я вам верю. А потому, что вы — полезный инструмент, который рвется в работу. И я хочу знать, что вы искали в архивах."}, {"type": "narration", "speaker": null, "text": "Рэй застыл. Холод пробежал по спине."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Вы ведь за этим пришли, не так ли? За правдой о вашем импланте."}, {"type": "narration", "speaker": null, "text": "Сол активировал терминал. На стол мягко опустился небольшой инфочип."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Здесь параметры миссии и досье на отряд. А еще — временный ключ доступа к вашим системным логам. Тем самым, что вы так отчаянно пытались взломать."}, {"type": "narration", "speaker": null, "text": "Рэй молча смотрел на чип, не смея пошевелиться."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Приказ на отключение отдал директор Валериус. Лично. Он счел вас эмоционально нестабильным и скомпрометированным. Угрозой для операции."}, {"type": "thought", "speaker": "Рэй", "text": "Валериус... Значит, это правда. Они могут. Они сделали это."}, {"type": "narration", "speaker": null, "text": "Знание, которого он так искал, обрушилось на него не как облегчение, а как удар."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Теперь вы знаете. И теперь у вас нет права на ошибку. Провалите миссию — и этот ключ станет приказом на вашу ликвидацию. Не как агента, а как дефектного актива."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я понял."}, {"type": "narration", "speaker": null, "text": "Рэй взял чип. Холодный металл обжег пальцы."}, {"type": "dialogue", "speaker": "Сол Вэйн", "text": "Добейтесь успеха, Рэй. И, возможно, мы с вами поговорим о том, кто на самом деле дергает за ниточки в этой корпорации. А теперь — вон."}, {"type": "narration", "speaker": null, "text": "Рэй развернулся и вышел, не говоря больше ни слова. За спиной закрылись двери, отрезая его от холодных глаз куратора. В руке он сжимал не просто миссию. Он сжимал собственную жизнь."}], "choices": [], "summary": "Рэй убеждает Сола Вэйна выделить ему отряд, апеллируя к его прошлой травме. Сол соглашается, но раскрывает Рэю шокирующую правду: приказ на отключение его импланта отдал директор Валериус. Сол дает Рэю чип с доступом к логам, превращая миссию в ультиматум: успех или смерть. Рэй получает и ресурсы, и доказательство предательства 'Эгиды'.", "branch_id": "branch_02", "branch_order": 1}, "branch_02_scene_002": {"id": "branch_02_scene_002", "location": "Штаб-квартира корпорации 'Эгида'", "pov_character": "Рэй", "present_characters": ["Рэй", "Техник", "Чистильщик", "Элара", "Валериус"], "lines": [{"type": "narration", "speaker": null, "text": "Тяжелая дверь кабинета Сола Вэйна закрылась за спиной Рэя с глухим щелчком, отрезая его от холодного, всезнающего взгляда куратора. Переход из одной ловушки в другую был сделан."}, {"type": "narration", "speaker": null, "text": "Он шел по стерильным коридорам штаб-квартиры, где полированный пол отражал неоновые вены города за бронестеклом. Воздух пах озоном и холодной сталью."}, {"type": "thought", "speaker": "Рэй", "text": "Сол дал мне не ключ. Он дал мне оружие. И теперь я должен решить, в кого стрелять: в вампира, в 'Эгиду'... или в себя."}, {"type": "narration", "speaker": null, "text": "Путь до Тактического Операционного Центра он проделал на автомате. Перед глазами стояли лица бойцов отряда 'Гамма'. Не просто зеленые точки на карте. Люди, которые ему доверяли."}, {"type": "thought", "speaker": "Рэй", "text": "Я веду их на бойню. Ради чего? Чтобы доказать лояльность тем, кто меня уже списал? Чтобы исполнить чужую месть?"}, {"type": "narration", "speaker": null, "text": "Двери ТОЦ бесшумно разъехались. Внутри царил полумрак — пещера данных, где со сводов свисали кабели, а стены мерцали десятками экранов."}, {"type": "dialogue", "speaker": "Рэй", "text": "Докладывайте."}, {"type": "narration", "speaker": null, "text": "Голос прозвучал как удар хлыста. Один из техников вытянулся по струнке."}, {"type": "dialogue", "speaker": "Техник", "text": "Командир Рэй. Отряд 'Гамма' на позициях. Сектор семь-три, 'Серые Зоны'. Все системы в норме. Ждем цель."}, {"type": "narration", "speaker": null, "text": "Рэй прошел к главному командному креслу, похожему на трон в этом соборе данных. Он опустился в холодные объятия кожи и металла."}, {"type": "dialogue", "speaker": "Рэй", "text": "Выведите тактическую карту и все каналы видео на основной монитор. Полная детализация."}, {"type": "narration", "speaker": null, "text": "Мозаика из нашлемных камер заполнила главный экран. Ржавые остовы зданий, потоки неонового дождя, блики на мокром асфальте."}, {"type": "thought", "speaker": "Рэй", "text": "Точно такое же место, где ранили Элиаса. Где меня отключили, как неисправный дрон. Валериус даже не пытается скрыть почерк. Ему нужно, чтобы я знал, кто здесь хозяин."}, {"type": "narration", "speaker": null, "text": "Внезапно на одной из консолей тревожно пискнул датчик движения. Тишина взорвалась."}, {"type": "dialogue", "speaker": "Техник", "text": "Контакт! Периметр нарушен! Неопознанный одиночный объект, движется быстро!"}, {"type": "narration", "speaker": null, "text": "На главном экране появилась темная фигура. Элара. Она не кралась. Она шла с грацией королевы, осматривающей свои владения."}, {"type": "thought", "speaker": "Рэй", "text": "Она знала. Она пришла не в ловушку. Она пришла на встречу, которую я просил. А я привел с собой палачей."}, {"type": "narration", "speaker": null, "text": "В наушнике раздался напряженный голос командира 'Гаммы': \"Цель в зоне поражения. Жду вашего приказа, командир.\""}, {"type": "thought", "speaker": "Рэй", "text": "Вот он. Момент. Сыграть роль верного пса до конца? Или сжечь все дотла? Если я дам приказ, мои люди умрут. Если не дам — меня ликвидируют. И их тоже. Это и есть ультиматум Валериуса."}, {"type": "narration", "speaker": null, "text": "Он подался вперед, вглядываясь в ее лицо на одном из увеличенных изображений. Спокойное. Скорбное. Разочарованное."}, {"type": "dialogue", "speaker": "Рэй", "text": "...Огонь."}, {"type": "narration", "speaker": null, "text": "Слово вышло сдавленным, чугунным. Экраны взорвались вспышками выстрелов. Огненные трассеры прошили темноту, скрежеща по металлу."}, {"type": "narration", "speaker": null, "text": "Но Элара уже исчезла. Растворилась в движении, превратившись в неуловимую тень, скользящую между укрытиями."}, {"type": "narration", "speaker": null, "text": "В следующую секунду одна из зеленых точек на тактической карте погасла. В эфире раздался короткий, захлебнувшийся крик."}, {"type": "thought", "speaker": "Рэй", "text": "Началось. Моя вина. Мой приказ."}, {"type": "narration", "speaker": null, "text": "Рэй смотрел на это, чувствуя, как ледяной обруч сжимает грудь. Это была не битва. Это была бойня."}, {"type": "narration", "speaker": null, "text": "Еще две точки погасли. В эфире началась паника."}, {"type": "dialogue", "speaker": "Чистильщик", "text": "Она везде! Мы ее не видим! Помогите!"}, {"type": "narration", "speaker": null, "text": "Камера одного из бойцов на мгновение поймала Элару. Она обезоружила его одним движением, но не нанесла смертельного удара. Просто отбросила в сторону и исчезла."}, {"type": "thought", "speaker": "Рэй", "text": "Она не убивает. Она защищается. Выводит из строя. А Валериус знал, что так будет. Ему нужны были потери. Ему нужны были данные для его 'испытаний'."}, {"type": "narration", "speaker": null, "text": "На другом экране, с камеры павшего 'Чистильщика', появилось лицо Элары. Она смотрела прямо в объектив. В ее глазах не было ярости. Только холодная, древняя печаль и презрение."}, {"type": "thought", "speaker": "Рэй", "text": "Она смотрит на меня. Она знает, что я здесь. И судит меня. И она права."}, {"type": "narration", "speaker": null, "text": "Это была последняя капля. Ярость, холодная и острая, как скальпель, пронзила Рэя. Ярость на Валериуса. На Сола. На себя."}, {"type": "thought", "speaker": "Рэй", "text": "Хватит. Хватит быть пешкой в их игре."}, {"type": "narration", "speaker": null, "text": "Он резко поднялся. Техники испуганно отшатнулись от его кресла."}, {"type": "dialogue", "speaker": "Рэй", "text": "Оба — вон отсюда. Немедленно!"}, {"type": "narration", "speaker": null, "text": "Один из них замялся: \"Но, командир, протокол...\""}, {"type": "dialogue", "speaker": "Рэй", "text": "Это приказ. Я беру на себя полную ответственность. Выполнять!"}, {"type": "narration", "speaker": null, "text": "Во взгляде Рэя было что-то, что заставило их подчиниться без вопросов. Они выскочили из ТОЦ, словно за ними гнался огонь."}, {"type": "narration", "speaker": null, "text": "Рэй нажал кнопку на консоли. Дверь заблокировалась с тяжелым гулом магнитных замков."}, {"type": "narration", "speaker": null, "text": "Он остался один в мерцающем полумраке, под аккомпанемент криков своих людей в наушнике."}, {"type": "narration", "speaker": null, "text": "Дрожащими руками он достал чип. Вставил его в главный терминал. На экране всплыло окно запроса авторизации."}, {"type": "thought", "speaker": "Рэй", "text": "Сол не обманул. Доступ уровня 'Омега'. Ключ от всего королевства."}, {"type": "narration", "speaker": null, "text": "Рэй ввел команду. Не взлом, не обход. Прямой приказ. Транслировать файл по всем экстренным каналам 'Эгиды'."}, {"type": "narration", "speaker": null, "text": "На мгновение все экраны в ТОЦ погасли. В комнате воцарилась абсолютная тишина и темнота."}, {"type": "narration", "speaker": null, "text": "А потом они вспыхнули вновь. Одновременно. Но вместо боя в 'Серых Зонах' на них появился сухой текст лог-файла."}, {"type": "narration", "speaker": null, "text": "ID: Директор Валериус. Команда: Принудительное отключение импланта. Цель: Рэй, отряд 'Дельта'. Причина: Полевые испытания магической интерференции."}, {"type": "narration", "speaker": null, "text": "Следом пошла аудиозапись. Холодный, уверенный голос Валериуса, отдающий приказ, эхом разнесся по ТОЦ и, как знал Рэй, по всем динамикам в штаб-квартире."}, {"type": "thought", "speaker": "Рэй", "text": "Слышите? Слышите все? Вот ваше чудовище."}, {"type": "narration", "speaker": null, "text": "В штаб-квартире взвыли сирены. Красные лампы тревоги залили центр управления кровавым светом."}, {"type": "narration", "speaker": null, "text": "Рэй включил общий канал связи, перекрывая все остальные."}, {"type": "dialogue", "speaker": "Рэй", "text": "Отряд 'Гамма', говорит Рэй! Приказ немедленно прекратить огонь и отступать! Ваша цель не в 'Серых Зонах'! Настоящий враг здесь, в этой башне!"}, {"type": "narration", "speaker": null, "text": "Он переключился на зашифрованный канал, который, как он надеялся, Элара или ее технологии смогут перехватить."}, {"type": "dialogue", "speaker": "Рэй", "text": "Элара! Если ты меня слышишь... я создал им другую проблему. Уходи. Мы не враги. Не сегодня."}, {"type": "narration", "speaker": null, "text": "Тяжелые, глухие удары затрясли дверь ТОЦ. Силы безопасности. Они пытались выломать замок."}, {"type": "thought", "speaker": "Рэй", "text": "Игра окончена. И я только что перевернул доску."}, {"type": "narration", "speaker": null, "text": "Рэй откинулся в кресле, глядя на экраны, где разворачивался сотворенный им хаос. На тактической карте зеленые точки его отряда замерли, а затем начали отход."}, {"type": "narration", "speaker": null, "text": "Он не чувствовал страха. Только странное, пустое облегчение. Он сделал свой выбор. Необратимо."}], "choices": [], "summary": "Командуя засадой на Элару из ТОЦ 'Эгиды', Рэй становится свидетелем бойни, понимая, что его отряд — лишь расходный материал. Видя, что Элара щадит его людей, он принимает решение. Рэй предаёт корпорацию: запирается в центре управления и транслирует по всей сети неопровержимые доказательства измены директора Валериуса. Этим он спасает Элару и свой отряд, окончательно разрывая связь с 'Эгидой' и формируя вынужденный союз с бывшим врагом, оставаясь запертым в эпицентре хаоса, который сам и создал.", "branch_id": "branch_02", "branch_order": 2}, "branch_03_scene_001": {"id": "branch_03_scene_001", "location": "Неоновые улицы района 'Нижний Гелиос'", "pov_character": "Рэй", "present_characters": ["Рэй", "Элиас Грей", "Торговец"], "lines": [{"type": "narration", "speaker": null, "text": "Пыльный бархат и тишина театра остались позади. Я вышиб боковую дверь и рухнул в ревущую пасть Нижнего Гелиоса, в объятия холодного кислотного дождя."}, {"type": "narration", "speaker": null, "text": "Неоновые вывески расплывались в мокрых глазах, превращая мир в калейдоскоп ядовитых пятен. Тело Элиаса на моем плече было неподъемным грузом вины, якорем, тянущим меня на дно этого города."}, {"type": "thought", "speaker": "Рэй", "text": "Держись, парень. Просто держись. Я вытащу тебя. Я обещал."}, {"type": "narration", "speaker": null, "text": "Каждый шаг по скользкому асфальту отдавался глухой болью в мышцах. Его кровь, темная и густая, пропитала мою тактическую броню. Она пахла озоном и чем-то еще... чем-то чужим, потусторонним, как воздух после разряда магии."}, {"type": "narration", "speaker": null, "text": "Я свернул в первый же переулок, подальше от широких проспектов, где патрули «Эгиды» были предсказуемы. Здесь, в лабиринте узких проходов, воняло гнилью, перегретой проводкой и дешевой синтетической едой."}, {"type": "dialogue", "speaker": "Элиас Грей", "text": "Рэй... холодно... Оно... жжется изнутри..."}, {"type": "narration", "speaker": null, "text": "Его голос был едва слышным хрипом. Я осторожно опустил его на землю, прислонив к мокрой кирпичной стене. Лицо было бледным, почти серым в мигающем свете неона."}, {"type": "narration", "speaker": null, "text": "Мой тактический визор, работающий на внутренних батареях, вывел на сетчатку его показатели. Пульс — нитевидный. Температура скачет. Биомаркеры кричали о некрозе тканей, несовместимом со стандартными стимуляторами. Критические оповещения заливали экран красным."}, {"type": "thought", "speaker": "Рэй", "text": "Черт, он умирает. Прямо у меня на руках. Риппердок. Мне нужен риппердок. Кто-то, кто не задает вопросов. Кто-то, кто может справиться с... этим."}, {"type": "narration", "speaker": null, "text": "Паника ледяной иглой впилась в затылок, но я заставил себя дышать. Решимость, холодная и твердая, как сталь, вытеснила страх. Не на моей смене, парень. Не из-за меня."}, {"type": "narration", "speaker": null, "text": "Внезапно дальний конец переулка озарился ярким белым светом. Донесся низкий, вибрирующий гул патрульного транспорта «Эгиды»."}, {"type": "thought", "speaker": "Рэй", "text": "Уже ищут. Конечно, ищут. Дезертир с раненым напарником — слишком лакомый кусок. Свидетели сбоя."}, {"type": "narration", "speaker": null, "text": "Я рванулся в ближайшую темную нишу за мусорными контейнерами, втаскивая за собой Элиаса. Прижал его к себе, зажимая ему рот ладонью, чтобы он не застонал. Сердце колотилось о ребра, как пойманная птица."}, {"type": "narration", "speaker": null, "text": "Лучи прожекторов шарили по стенам, выхватывая из темноты мокрый кирпич и граффити. Мою кибернетическую руку внезапно свело судорогой, по ней прошла волна фантомной дрожи. Воспоминание о сбое, о предательстве."}, {"type": "thought", "speaker": "Рэй", "text": "Они не просто бросили нас. Они пытались меня отключить. А теперь зачищают свидетелей. Элиас должен был умереть там, а я — рядом с ним. Удобная пропаганда."}, {"type": "narration", "speaker": null, "text": "Гул транспорта удалился. Я выждал еще минуту, прислушиваясь к биению собственного сердца, и снова взвалил Элиаса на плечо."}, {"type": "narration", "speaker": null, "text": "Выбравшись на чуть более оживленную улочку, я попытался поймать чей-нибудь взгляд. Но моя форма «Чистильщика» действовала как проклятие."}, {"type": "narration", "speaker": null, "text": "Женщина с ребенком шарахнулась от меня, прикрывая дитя рукой. Торговец лапшой поспешно задернул шторку своей лавки. В их взглядах я видел не уважение или страх перед законом, а ненависть и отвращение."}, {"type": "thought", "speaker": "Рэй", "text": "Добро пожаловать в реальный мир, Рэй. Здесь твои знаки отличия — клеймо. Здесь ты враг."}, {"type": "narration", "speaker": null, "text": "Время уходило. В отчаянии я заметил щуплую фигуру, торговавшую какими-то чипами в темном углу. Я подошел и мягко, но настойчиво преградил ему путь."}, {"type": "dialogue", "speaker": "Рэй", "text": "Мне нужна помощь. Мой друг умирает."}, {"type": "narration", "speaker": null, "text": "Торговец затрясся, глядя на мою униформу."}, {"type": "dialogue", "speaker": "Торговец", "text": "Отвали, чистила. Я ничего не знаю. Не мои проблемы."}, {"type": "narration", "speaker": null, "text": "Я убрал руку, показывая пустые ладони. Извлек из подсумка свой последний кредитный чип."}, {"type": "dialogue", "speaker": "Рэй", "text": "Это все, что у меня есть. Его ранили... не по-человечески. Магией. Обычный медик не поможет. Мне нужен риппердок. Лучший. Пожалуйста."}, {"type": "narration", "speaker": null, "text": "Глаза торговца метнулись с чипа на мое отчаянное лицо, потом на безвольно висящее тело Элиаса. Жадность боролась со страхом."}, {"type": "thought", "speaker": "Рэй", "text": "Давай же... сработай."}, {"type": "narration", "speaker": null, "text": "Он выхватил чип."}, {"type": "dialogue", "speaker": "Торговец", "text": "Есть один... его зовут Хирург. Псих, но руки золотые. Говорят, может и мертвого на ноги поставить, если заплатишь. А платить придется. Кровью, если не кредитами."}, {"type": "dialogue", "speaker": "Рэй", "text": "Где он?"}, {"type": "dialogue", "speaker": "Торговец", "text": "Ищи знак. Скальпель, обвитый змеей. Голограмма. Он не светится ярко. И поспеши, чистила. Твой парень уже почти все."}, {"type": "narration", "speaker": null, "text": "Торговец растворился в толпе прежде, чем я успел сказать что-то еще."}, {"type": "thought", "speaker": "Рэй", "text": "Скальпель и змея... Хирург."}, {"type": "narration", "speaker": null, "text": "С новыми силами я ринулся вперед, лихорадочно вглядываясь в вывески, двери, стены. Мой взгляд, усиленный оптикой, сканировал каждый дюйм грязных фасадов."}, {"type": "narration", "speaker": null, "text": "Неоновые драконы, танцующие голографические девушки, реклама лапши... все не то. Я пробежал один квартал, второй. Паника снова начала подступать, холодная и липкая."}, {"type": "narration", "speaker": null, "text": "Дыхание Элиаса стало едва различимым хрипом у моего уха. Время истекало."}, {"type": "thought", "speaker": "Рэй", "text": "Я же мог пробежать мимо! Он сказал, она тусклая... Я не найду. Я не успею."}, {"type": "narration", "speaker": null, "text": "Я остановился, заставив себя успокоиться, и медленно пошел назад, сканируя каждый темный угол. И тогда я увидел его."}, {"type": "narration", "speaker": null, "text": "Над ржавой металлической дверью, ведущей в подвал, едва мерцала выцветшая, подрагивающая голограмма скальпеля, который обвивала змея."}, {"type": "narration", "speaker": null, "text": "Соб
