рав остатки сил, я рванул дверь на себя. Она поддалась со скрежетом. Вниз вела крутая лестница."}, {"type": "narration", "speaker": null, "text": "Воздух ударил в лицо — спертый, тяжелый, с резким запахом антисептиков, озона и застарелой крови. Резкий контраст с уличной сыростью."}, {"type": "narration", "speaker": null, "text": "Я осторожно спустился, стараясь не уронить Элиаса. Внизу было тускло освещенное помещение, похожее на гибрид бойни и операционной."}, {"type": "narration", "speaker": null, "text": "В центре стоял массивный металлический стол под хирургической лампой. Еще один, свободный, был у стены. Я осторожно уложил Элиаса на холодную сталь."}, {"type": "thought", "speaker": "Рэй", "text": "Мы здесь. Мы смогли."}, {"type": "narration", "speaker": null, "text": "Из самой темной части комнаты отделилась тень. Высокая фигура в забрызганном кровью прорезиненном фартуке и с маской на лице шагнула в круг света."}, {"type": "narration", "speaker": null, "text": "Хирург. Он не сказал ни слова. Его глаза за стеклами очков молча осмотрели Элиаса, задержались на неестественного вида ране."}, {"type": "narration", "speaker": null, "text": "Затем он перевел свой холодный, оценивающий взгляд на меня. На мою форму. На мою кибернетическую руку. В его молчании висел один-единственный вопрос: «Готов ли ты платить?»"}], "choices": [], "summary": "Дезертировав из 'Эгиды', Рэй с тяжело раненым Элиасом пробивается через враждебные улицы Нижнего Гелиоса. Избежав патруля и отдав последние кредиты за информацию, он находит подпольную клинику жестокого, но гениального риппердока по кличке 'Хирург', доставив Элиаса на порог спасения.", "branch_id": "branch_03", "branch_order": 1}, "branch_03_scene_002": {"id": "branch_03_scene_002", "location": "Неоновые улицы района 'Нижний Гелиос'", "pov_character": "Рэй", "present_characters": ["Рэй", "Риппердок"], "lines": [{"type": "narration", "speaker": null, "text": "В подпольной клинике, спрятанной в лабиринте Нижнего Гелиоса, пахло озоном, антисептиком и жжёной проводкой. Элиас лежал на операционном столе, его грудь едва заметно вздымалась в такт писку монитора. Он был жив."}, {"type": "thought", "speaker": "Рэй", "text": "Успел. Я дотащил его. Но какой ценой..."}, {"type": "narration", "speaker": null, "text": "Риппердок, сутулый мужчина с уставшими глазами и аугментированными пальцами, сдёрнул окровавленные перчатки."}, {"type": "dialogue", "speaker": "Риппердок", "text": "Стабилен. Магическую дрянь из раны вычистил, внутренности сшил. Но его мозг ушёл в защитную кому. Может, очнётся завтра. Может, никогда. Счёт оплачен. Забирай его и убирайся."}, {"type": "narration", "speaker": null, "text": "Рэй смотрел на нулевой баланс на своем коммлоге. Последние кредиты, всё, что у него было, ушли на спасение новичка."}, {"type": "thought", "speaker": "Рэй", "text": "Теперь я не просто дезертир. Я призрак без прошлого и будущего."}, {"type": "dialogue", "speaker": "Рэй", "text": "Погоди. Ещё одно. Моя рука."}, {"type": "narration", "speaker": null, "text": "Он протянул кибернетический протез. Риппердок раздражённо цыкнул, но подключил свой планшет-сканер к диагностическому порту."}, {"type": "dialogue", "speaker": "Рэй", "text": "Она отключилась в бою. На несколько секунд."}, {"type": "narration", "speaker": null, "text": "На экране побежали строки кода. Раздражение на лице доктора сменилось недоумением, а затем — плохо скрытым ужасом. Он отшатнулся от Рэя, будто его рука была заряженной бомбой."}, {"type": "dialogue", "speaker": "Риппердок", "text": "Святые фильтры... Это не протокол безопасности. Это поводок."}, {"type": "thought", "speaker": "Рэй", "text": "Поводок... Цепи... Слова Элары. 'Твои цепи крепче моих'."}, {"type": "dialogue", "speaker": "Рэй", "text": "Что это значит?"}, {"type": "dialogue", "speaker": "Риппердок", "text": "Это значит, что 'Эгида' вшила в тебя скрытый бэкдор с высшим приоритетом! Они могут не просто вырубить твою руку. Они могут перегрузить реактор в твоём торсе. Поджарить твою нервную систему. Аннулировать. Стереть тебя, парень!"}, {"type": "narration", "speaker": null, "text": "Холод, не имеющий ничего общего с температурой в комнате, прошил Рэя насквозь. Ярость, кипевшая в нём, сменилась ледяным осознанием."}, {"type": "thought", "speaker": "Рэй", "text": "Они не просто бросили меня. Они держали палец на кнопке моего уничтожения всё это время. Я был не солдатом. Я был оружием одноразового использования."}, {"type": "dialogue", "speaker": "Риппердок", "text": "Держись подальше от любой корпоративной сети. От любого терминала. Как только ты появишься онлайн, они нажмут на эту кнопку. Понял?"}, {"type": "dialogue", "speaker": "Рэй", "text": "Понял. Она знала. Вампирша знала... и пыталась предупредить."}, {"type": "thought", "speaker": "Рэй", "text": "Корпорация убьёт меня при первой возможности. Командование предало. Единственный, кто может что-то объяснить... это она."}, {"type": "dialogue", "speaker": "Рэй", "text": "Мне нужно найти вампиров. Конкретно её."}, {"type": "dialogue", "speaker": "Риппердок", "text": "Нет! Ни за что! Я спас твоего напарника, на этом всё. Я не лезу в дела аномалий. И тебе не советую. Убирайся!"}, {"type": "narration", "speaker": null, "text": "Рэй сделал шаг к нему, его голос стал тихим и холодным, как сталь."}, {"type": "dialogue", "speaker": "Рэй", "text": "'Эгида' уже ищет меня. Они знают, что я был в этом районе. Как думаешь, сколько времени у них займёт, чтобы найти единственного риппердока, который способен латать раны от магии? Твоё молчание не купит тебе безопасность. Ты уже в этом по уши."}, {"type": "narration", "speaker": null, "text": "Риппердок замер. Страх перед корпорацией, способной на такое, перевесил его нежелание связываться с неизведанным."}, {"type": "dialogue", "speaker": "Риппердок", "text": "Проклятье... Я ничего не знаю точно. Но есть слухи. Место в Серых Зонах. Старый бар 'Эклипс'. Говорят, это нейтральная территория. Место, где технология встречается с магией. Если они где-то и появляются открыто, то там."}, {"type": "dialogue", "speaker": "Риппердок", "text": "А теперь — вон. И чтобы я тебя больше никогда не видел."}, {"type": "narration", "speaker": null, "text": "Рэй бросил последний взгляд на Элиаса, подключенного к аппаратам."}, {"type": "thought", "speaker": "Рэй", "text": "Я не могу взять его с собой. Не туда, куда я иду. Я вернусь за тобой, парень. Обещаю."}, {"type": "dialogue", "speaker": "Рэй", "text": "Присмотри за ним. Если с ним что-то случится, 'Эгида' будет твоей наименьшей проблемой."}, {"type": "narration", "speaker": null, "text": "Не дожидаясь ответа, Рэй развернулся и вышел из клиники, снова погружаясь в неоновое марево дождливых улиц. У него была новая, отчаянная цель."}], "choices": [], "summary": "В подпольной клинике риппердока Рэй узнает, что Элиас стабилизирован, но в коме. Потратив последние кредиты, он просит доктора осмотреть его кибер-руку. Риппердок в ужасе обнаруживает 'цифровой поводок' — скрытый механизм, позволяющий 'Эгиде' удаленно убить Рэя. Это подтверждает слова вампирши Элары. Понимая, что она — единственный ключ к правде, Рэй под давлением выбивает из доктора наводку на бар 'Эклипс' в Серых Зонах. Он оставляет Элиаса на попечение риппердока и уходит на поиски Элары.", "branch_id": "branch_03", "branch_order": 2}, "branch_03_scene_003": {"id": "branch_03_scene_003", "location": "Серые Зоны", "pov_character": "Рэй", "present_characters": ["Рэй", "Главарь банды", "Чистильщик"], "lines": [{"type": "narration", "speaker": null, "text": "Неоновое зарево Нижнего Гелиоса осталось за спиной, резкой, почти хирургической линией отсекая цивилизацию от хаоса. Здесь, на границе Серых Зон, даже дождь был другим. Он не очищал, а смешивал копоть, грязь и отчаяние в единую вязкую массу на разбитом асфальте."}, {"type": "narration", "speaker": null, "text": "Рэй сделал шаг через невидимую черту. Воздух мгновенно стал плотнее, тяжелее. Он пах озоном от кустарной кибернетики, гнилью из затопленных подвалов и сладковатым дымом благовоний, назначение которых Рэй не мог и не хотел угадывать."}, {"type": "thought", "speaker": "Рэй", "text": "Переход выполнен. Добро пожаловать в ад, Рэй. Билет в один конец оплачен всеми кредитами, что у меня были. И кровью Элиаса."}, {"type": "narration", "speaker": null, "text": "Вина застыла в горле холодным комком. Элиас, в анабиозной капсуле у риппердока... Док обещал, что парень выживет. Но обещания в этом городе стоили дешевле, чем пуля."}, {"type": "thought", "speaker": "Рэй", "text": "Я вытащу тебя, Элиас. Клянусь. Но сначала я должен найти ответы. Найти её."}, {"type": "narration", "speaker": null, "text": "Его цель — бар 'Эклипс'. По словам дока, место, где 'технология встречается с магией'. Нейтральная территория. И, что важнее, место, где можно найти вампира по имени Элара."}, {"type": "thought", "speaker": "Рэй", "text": "'Они лгут тебе, железный человек'. Её слова до сих пор звенели в ушах. Она была права. Доказательство — 'цифровой поводок', тикающая бомба в моей руке. Идеальное оружие 'Эгиды' против меня."}, {"type": "narration", "speaker": null, "text": "Он не прошёл и ста метров, как почувствовал их. Взгляды. Липкие, оценивающие, хищные. Они впивались не в лицо, а в его снаряжение."}, {"type": "narration", "speaker": null, "text": "Тактический жилет 'Чистильщика', армейские ботинки и, конечно, главный приз — блестящая хромированная рука военного образца. В корпоративном секторе это был символ власти. Здесь — приглашение к ограблению и убийству."}, {"type": "thought", "speaker": "Рэй", "text": "Идеально, 'Эгида'. Загнать меня на территорию, где каждый второй мечтает содрать с меня кожу. Чтобы я сам нашёл свою смерть, не марая ваши белые перчатки. Отличный план."}, {"type": "narration", "speaker": null, "text": "Из тёмного проулка, словно выползая из трещины в реальности, появились трое. Дешёвые, но смертоносные импланты были вживлены грубо, без анестезии и эстетики. Гидравлические клешни, провода под кожей, мутные линзы оптики."}, {"type": "narration", "speaker": null, "text": "Они не спешили, растягивая удовольствие. Медленно, лениво, начали брать его в кольцо. Их взгляды были прикованы к его левой руке."}, {"type": "narration", "speaker": null, "text": "Один, с гротескной металлической челюстью, которая скрежетала при каждом движении, сделал шаг вперёд."}, {"type": "dialogue", "speaker": "Главарь банды", "text": "Смотрите-ка, корпоративный пёс сорвался с поводка. Заблудился, чистила?"}, {"type": "dialogue", "speaker": "Рэй", "text": "Просто прохожу мимо. Не ищу проблем."}, {"type": "dialogue", "speaker": "Главарь банды", "text": "А ты уже нашёл. Руку на бочку. И можешь ползти дальше. Без неё."}, {"type": "thought", "speaker": "Рэй", "text": "Драка привлечёт патруль 'Эгиды'. Бегство покажет слабость, и за мной увяжется вся стая. Денег на откуп нет. Значит, остаётся одно."}, {"type": "narration", "speaker": null, "text": "Рэй медленно поднял руки, показывая ладони. Жест примирения, который за долю секунды мог превратиться в боевую стойку. Напряжение стало почти осязаемым."}, {"type": "thought", "speaker": "Рэй", "text": "Быстро. Тихо. Вырубить, не убивая. Главное — не дать руке сорваться. Не показать им, что внутри неё... тикает таймер. Что 'Эгида' может отключить её в любой момент."}, {"type": "narration", "speaker": null, "text": "Но в тот момент, когда столкновение казалось неминуемым, произошло нечто странное. Главарь банды замер."}, {"type": "narration", "speaker": null, "text": "Его мутная оптика метнулась за спину Рэя. На лице, насколько это было возможно с металлической челюстью, отразился не просто страх. Животный, первобытный ужас."}, {"type": "dialogue", "speaker": "Главарь банды", "text": "Т-тень... Валим!"}, {"type": "narration", "speaker": null, "text": "Он не сказал — прохрипел. И все трое, забыв про Рэя и его дорогую руку, бросились назад, в спасительную темноту переулка, спотыкаясь и толкая друг друга."}, {"type": "narration", "speaker": null, "text": "Они исчезли, оставив после себя лишь запах страха и озона."}, {"type": "narration", "speaker": null, "text": "Рэй резко обернулся. Улица была пуста. Лишь колышущиеся тени от огня в бочке и капли дождя, разбивающиеся о металл его плеча."}, {"type": "narration", "speaker": null, "text": "Но на одно мгновение ему показалось, что одна из теней в дверном проёме заброшенного здания была неправильной. Слишком длинной, слишком тёмной. И в её глубине на долю секунды сверкнули два огонька. Не красные диоды оптики. Что-то живое. И древнее."}, {"type": "thought", "speaker": "Рэй", "text": "Что, чёрт возьми, это было? Чего могут бояться до смерти такие отморозки?"}, {"type": "narration", "speaker": null, "text": "Холодок пробежал по его спине, не имеющий ничего общего с ночной прохладой. Слова риппердока обрели новый, зловещий смысл."}, {"type": "thought", "speaker": "Рэй", "text": "'Где технология встречается с магией'. Похоже, я нашёл это место. И в здешней пищевой цепочке я далеко не на вершине."}, {"type": "narration", "speaker": null, "text": "Он поправил воротник куртки и, стараясь не оглядываться на тёмный проём, двинулся глубже в лабиринт Серых Зон. Теперь — ещё быстрее. Его паранойя обрела новое измерение."}], "choices": [], "summary": "Рэй входит в Серые Зоны, враждебную территорию, куда его привела наводка риппердока. Его снаряжение 'Чистильщика' немедленно делает его мишенью для местной банды. В момент, когда столкновение кажется неминуемым, бандитов обращает в бегство нечто невидимое в тенях, открывая Рэю глаза на то, что в Зонах есть угрозы пострашнее людей и корпоративных патрулей.", "branch_id": "branch_03", "branch_order": 3}, "branch_03_scene_004": {"id": "branch_03_scene_004", "location": "Серые Зоны", "pov_character": "Рэй", "present_characters": ["Рэй", "Чистильщик"], "lines": [{"type": "narration", "speaker": null, "text": "Рэй замер в промозглом переулке, вслушиваясь в удаляющиеся панические крики бандитов. Воздух был чист, если не считать запаха гниющего мусора и озона."}, {"type": "thought", "speaker": "Рэй", "text": "Ни выстрелов, ни вспышек энергии. Они убежали от... ничего. От теней."}, {"type": "narration", "speaker": null, "text": "Он двинулся дальше, но уже по-другому. Не как охотник, а как тот, кто случайно забрёл в чужое логово. Каждый шаг отдавался гулким эхом в его аудиосенсорах."}, {"type": "narration", "speaker": null, "text": "Его тактический комбинезон 'Чистильщика', созданный внушать страх, здесь был клеймом. Ходячей мишенью с надписью 'убей и забери трофеи'."}, {"type": "thought", "speaker": "Рэй", "text": "Слишком чистый, слишком целый для этого места. Я здесь чужой."}, {"type": "narration", "speaker": null, "text": "Внезапно по кибернетической руке пробежала ледяная судорога. Интерфейс в углу зрения на миг подернулся красной рябью статической помехи."}, {"type": "thought", "speaker": "Рэй", "text": "Цифровой поводок... Они могут дернуть за него в любой момент. Просто выключить меня."}, {"type": "thought", "speaker": "Рэй", "text": "Мое собственное тело — не мое. Просто еще одна корпоративная собственность."}, {"type": "narration", "speaker": null, "text": "Боль прошла так же быстро, как и появилась, но оставила после себя горький привкус металла во рту и холодную ярость."}, {"type": "thought", "speaker": "Рэй", "text": "Элара знала. Вампирша. Враг. Она единственная, кто предупредил меня."}, {"type": "thought", "speaker": "Рэй", "text": "Я должен найти ее. Найти бар 'Эклипс'. Это единственная нить."}, {"type": "narration", "speaker": null, "text": "Резкий, пронзительный гул заставил его замереть и прижаться к бетонной стене. Над крышами, сканируя улицы красным лучом, проплывал патрульный дрон 'Эгиды'."}, {"type": "thought", "speaker": "Рэй", "text": "Ищут. Ищут меня. Мои бывшие братья по оружию теперь мои тюремщики."}, {"type": "narration", "speaker": null, "text": "Не раздумывая, Рэй соскользнул в широкую сточную канаву, погружаясь по колено в ледяную, маслянистую жижу. Вонь ударила в нос, перебивая все остальные запахи."}, {"type": "thought", "speaker": "Рэй", "text": "Неделю назад я был элитным солдатом корпорации. Теперь я прячусь в канализации, как крыса."}, {"type": "thought", "speaker": "Рэй", "text": "Вот она, цена неподчинения. Цена спасения Элиаса."}, {"type": "narration", "speaker": null, "text": "Красный прожектор прошелся по переулку в паре метров над его головой и двинулся дальше. Гул стих."}, {"type": "narration", "speaker": null, "text": "Рэй выбрался, отряхивая с формы омерзительные ошметки. Он мельком увидел пару местных, сжавшихся в дверном проеме."}, {"type": "narration", "speaker": null, "text": "В их глазах он прочел не только ненависть к его форме 'Чистильщика'."}, {"type": "narration", "speaker": null, "text": "В них был и другой страх. Суеверный. Они смотрели не на него, а мимо, на тени, в которых он только что прятался."}, {"type": "thought", "speaker": "Рэй", "text": "Они боятся не только корпоратов. Они боятся того, что распугало тех бандитов."}, {"type": "narration", "speaker": null, "text": "Он свернул в лабиринт заброшенной промзоны. Ржавые фермы и скелеты цехов уходили в небо, заслоняя неоновый свет."}, {"type": "narration", "speaker": null, "text": "Внезапно его аудиосенсоры уловили странный звук. Не механический гул, не капающая вода. Тихий, протяжный резонанс, похожий на пение стекла."}, {"type": "narration", "speaker": null, "text": "Звук вызывал странное ощущение дежавю, словно он слышал его во сне."}, {"type": "narration", "speaker": null, "text": "Его тактический визор на мгновение замерцал, выдавая предупреждение о 'неклассифицированном волновом возмущении'."}, {"type": "thought", "speaker": "Рэй", "text": "Магия. Она искажает технику. 'Где технология встречается с магией'... Риппердок был прав."}, {"type": "thought", "speaker": "Рэй", "text": "Я должен искать не вывеску. Я должен искать аномалию."}, {"type": "narration", "speaker": null, "text": "Он пошел на звук, игнорируя протоколы, которые кричали об опасности. Впереди, в свете прожекторов заброшенного склада, он увидел группу мародеров, копающихся в мусоре."}, {"type": "narration", "speaker": null, "text": "Один из них заметил Рэя. Он выпрямился, поднимая ржавую трубу. Остальные повернулись к нему, оскалившись."}, {"type": "thought", "speaker": "Рэй", "text": "Только не это. У меня нет ни времени, ни сил на драку."}, {"type": "narration", "speaker": null, "text": "Но в этот момент странный резонанс стал громче, заставив вибрировать воздух. Пыль на земле поднялась в крошечные вихри."}, {"type": "narration", "speaker": null, "text": "Мародеры замерли, испуганно переглядываясь."}, {"type": "narration", "speaker": null, "text": "Их главарь бросил взгляд в темные провалы окон над головой Рэя, выругался и махнул своим, приказывая убираться."}, {"type": "narration", "speaker": null, "text": "Они бросились бежать, оставив свою добычу, словно за ними гнался сам дьявол."}, {"type": "thought", "speaker": "Рэй", "text": "Снова... Оно снова меня 'защитило'. Или просто не любит шумных соседей."}, {"type": "narration", "speaker": null, "text": "Рэй прошел мимо брошенного хлама и остановился. Источник аномалии был прямо перед ним."}, {"type": "narration", "speaker": null, "text": "Сплошная стена из черного, как смоль, композита. Она не отражала ни единого неонового блика, словно была дырой в реальности, поглощающей свет."}, {"type": "narration", "speaker": null, "text": "Ни окон, ни граффити. Ничего. Абсолютная, мертвая пустота."}, {"type": "narration", "speaker": null, "text": "И в центре этой черноты — простая, тяжелая дверь из того же материала."}, {"type": "narration", "speaker": null, "text": "Пока он наблюдал, из-за угла вышел киборг, чье тело было скорее машиной, чем плотью. Он подошел к двери и, не стуча, толкнул ее. Дверь беззвучно открылась и закрылась за ним."}, {"type": "narration", "speaker": null, "text": "Спустя мгновение с другой стороны появилась фигура, закутанная в тяжелый плащ, скрывающий все очертания. Она проделала то же самое, исчезнув в черной стене."}, {"type": "thought", "speaker": "Рэй", "text": "Технология и... магия. Это место."}, {"type": "narration", "speaker": null, "text": "Рэй активировал оптический зум. Его кибернетический глаз сфокусировался на двери, вытягивая детали из абсолютной темноты."}, {"type": "narration", "speaker": null, "text": "Там была резьба. Едва заметная, почти стершаяся. Символ солнца, наполовину скрытого тенью луны."}, {"type": "thought", "speaker": "Рэй", "text": "Эклипс. Затмение."}, {"type": "narration", "speaker": null, "text": "Он подошел ближе. Воздух у двери был холоднее, а странный резонанс почти не слышен, словно дверь его экранировала."}, {"type": "narration", "speaker": null, "text": "Рэй похлопал по пустым карманам. Ни одного кредита. Его единственная валюта — пистолет на боку и отчаянная решимость."}, {"type": "thought", "speaker": "Рэй", "text": "Дезертир. Без денег. Без союзников."}, {"type": "thought", "speaker": "Рэй", "text": "Вхожу в логово монстров, чтобы найти другого монстра, который, возможно, говорит правду."}, {"type": "thought", "speaker": "Рэй", "text": "Звучит как отличный план."}, {"type": "narration", "speaker": null, "text": "Он сделал глубокий вдох, положил ладонь на холодную, не-материальную на ощупь поверхность двери и толкнул."}, {"type": "narration", "speaker": null, "text": "Она поддалась, открывая проход в еще более густую, звукопоглощающую темноту."}, {"type": "narration", "speaker": null, "text": "Рэй шагнул за порог."}], "choices": [], "summary": "Пробираясь через враждебные Серые Зоны, Рэй избегает патруля 'Эгиды' и дважды оказывается невольно спасен невидимой магической сущностью. Фантомная боль от 'цифрового поводка' укрепляет его решимость найти Элару. Следуя за магической аномалией, он находит скрытый вход в бар 'Эклипс' — свою единственную зацепку.", "branch_id": "branch_03", "branch_order": 4}, "branch_03_scene_005": {"id": "branch_03_scene_005", "location": "Серые Зоны", "pov_character": "Рэй", "present_characters": ["Рэй", "Громила", "Чистильщик"], "lines": [{"type": "narration", "speaker": null, "text": "Воздух внутри был густым и тяжелым. Смесь озона от перегруженных схем, пролитого синтетического пива и чего-то пряного, почти растительного — запаха, который не встретишь в стерильных кварталах «Эгиды»."}, {"type": "narration", "speaker": null, "text": "Бар «Эклипс» жил своей жизнью. За столиками сидели существа, которых пропаганда корпорации велела истреблять: тролль с массивной хромированной рукой играл в карты с человеком, чьи глаза светились мягким голубым светом дата-порта."}, {"type": "narration", "speaker": null, "text": "В углу пара пикси, похожих на живые сгустки неона, порхала вокруг тусклой рекламной голограммы."}, {"type": "thought", "speaker": "Рэй", "text": "Они сосуществуют. Киборги, маги, духи... Еще одна ложь в копилку «Эгиды»."}, {"type": "narration", "speaker": null, "text": "В тот момент, когда Рэй сделал шаг внутрь, негромкий гул разговоров оборвался. Резко. Словно кто-то щелкнул выключателем."}, {"type": "narration", "speaker": null, "text": "Тишина была не пустой, а тяжелой, наполненной невысказанной угрозой. Десятки глаз — органических, аугментированных, светящихся в полумраке — впились в него."}, {"type": "thought", "speaker": "Рэй", "text": "Клеймо. Даже без формы, они видят во мне Чистильщика. По выправке, по тому, как я двигаюсь. По самой сути."}, {"type": "narration", "speaker": null, "text": "Он проигнорировал враждебность и медленно двинулся к барной стойке, стараясь, чтобы его движения были плавными и не угрожающими."}, {"type": "narration", "speaker": null, "text": "За стойкой возвышался бармен — киборг с непроницаемым лицом, методично протиравший стакан многосуставчатой металлической рукой."}, {"type": "narration", "speaker": null, "text": "Рэй остановился перед ним, чувствуя себя экспонатом под микроскопом."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я ищу одну... особу. Вампиршу. Недавно у нее была стычка с «Эгидой»."}, {"type": "thought", "speaker": "Рэй", "text": "Элара. Я ищу Элару. Но произнести ее имя здесь — все равно что подписать себе приговор."}, {"type": "narration", "speaker": null, "text": "Бармен даже не поднял головы. Он закончил со стаканом, поставил его с глухим стуком и, демонстративно отвернувшись, пошел принимать заказ на другом конце стойки."}, {"type": "narration", "speaker": null, "text": "Молчание стало осязаемым. Ледяным. Сообщение было предельно ясным."}, {"type": "thought", "speaker": "Рэй", "text": "Стена. Они даже не будут слушать. Для них я враг по определению."}, {"type": "narration", "speaker": null, "text": "Рэй отступил от стойки, чувствуя, как взгляды впиваются ему в спину. Они не просто смотрели — они ждали. Ждали, что он сделает ошибку."}, {"type": "thought", "speaker": "Рэй", "text": "Элиас... он лежит там, в коме, из-за раны, которую нанесла она. Я потащил его к риппердоку, нарушил приказ, стал дезертиром... всё ради этого шанса. Я не могу просто уйти."}, {"type": "thought", "speaker": "Рэй", "text": "И этот поводок... Фантомный спазм прострелил кибер-руку, словно невидимые тиски сжали сервоприводы. «Эгида» может дёрнуть за него в любой момент. Мне нужны ответы. Мне нужна она."}, {"type": "narration", "speaker": null, "text": "Его взгляд выцепил в темном углу стол, за которым сидели трое. Один — громила, чье тело было почти полностью заменено боевыми имплантами. Две другие фигуры кутались в плащи, скрывая лица."}, {"type": "thought", "speaker": "Рэй", "text": "Местные авторитеты. Если кто-то здесь и решает, с кем говорить, то это они."}, {"type": "narration", "speaker": null, "text": "Собрав остатки решимости, Рэй подошел к их столу."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я не из «Эгиды». Я дезертир. Мне нужна помощь."}, {"type": "narration", "speaker": null, "text": "Громила медленно поднял голову. Его оптический имплант вспыхнул красным, сканируя Рэя."}, {"type": "dialogue", "speaker": "Громила", "text": "Запах псины «Эгиды» не выветривается. Проваливай, пока твои железки не пошли на лом."}, {"type": "narration", "speaker": null, "text": "Голос был низким, скрежещущим, как сервопривод без смазки, и не оставлял пространства для переговоров."}, {"type": "thought", "speaker": "Рэй", "text": "Драться бесполезно. Я один против всего бара. Это самоубийство."}, {"type": "narration", "speaker": null, "text": "Рэй молча кивнул и отступил к дальней стене, прислонившись к холодному бетону."}, {"type": "narration", "speaker": null, "text": "Он сделал вид, что просто наблюдает, но его мозг лихорадочно работал, а сердце колотилось в такт басовой линии, доносившейся из динамиков."}, {"type": "narration", "speaker": null, "text": "Он сканировал помещение, отслеживая взгляды, жесты, любые аномалии в поведении."}, {"type": "narration", "speaker": null, "text": "И он заметил. Периодически кто-то из посетителей бросал короткий, почти незаметный взгляд на неприметную дверь в дальнем конце зала."}, {"type": "narration", "speaker": null, "text": "Дверь была из темного металла, без ручки или замка, и рядом с ней неподвижно стояли двое в одинаковых длинных плащах. Они не пили, не разговаривали, просто стояли. Стражи."}, {"type": "thought", "speaker": "Рэй", "text": "Там. Что-то важное находится там. Или кто-то. Но эта дверь — крепость. Мне туда не пробиться. Не силой, а денег на подкуп у меня нет."}, {"type": "narration", "speaker": null, "text": "Прошло еще минут десять. Напряжение в баре не спадало, а наоборот, сгущалось. Рэй услышал низкий гортанный рык от соседнего столика."}, {"type": "thought", "speaker": "Рэй", "text": "Мое присутствие их провоцирует. Еще немного, и кто-нибудь решит проявить себя, вышвырнув отсюда пса «Эгиды»."}, {"type": "thought", "speaker": "Рэй", "text": "Провал. Полный, сокрушительный провал."}, {"type": "narration", "speaker": null, "text": "Волна холодного отчаяния накрыла его. Это был его единственный шанс, его последняя зацепка, и она рассыпалась в прах."}, {"type": "thought", "speaker": "Рэй", "text": "Элиас пожертвовал собой зря? Я стал предателем зря?"}, {"type": "thought", "speaker": "Рэй", "text": "Все было напрасно."}, {"type": "thought", "speaker": "Рэй", "text": "И что теперь? Снова на улицы. Один. Без денег, без союзников, с тикающей бомбой в собственной руке."}, {"type": "narration", "speaker": null, "text": "Сжав зубы до скрипа, Рэй оттолкнулся от стены."}, {"type": "narration", "speaker": null, "text": "Он развернулся и медленно, стараясь не показывать спину самым явным угрозам, пошел к выходу."}, {"type": "narration", "speaker": null, "text": "Каждый шаг отдавался в груди глухим ударом — признанием собственного поражения."}, {"type": "narration", "speaker": null, "text": "Он дошел до двери, через которую вошел в этот враждебный мир."}, {"type": "narration", "speaker": null, "text": "Его рука легла на холодную панель, готовясь снова шагнуть в неоновый дождь и неизвестность."}, {"type": "thought", "speaker": "Рэй", "text": "Ни с чем."}], "choices": [], "summary": "Рэй входит в подпольный бар «Эклипс» в поисках Элары, но его прошлое «Чистильщика» делает его изгоем. Столкнувшись со стеной молчания и враждебности, он не получает никакой информации. Потерпев полную неудачу и осознав, что его присутствие провоцирует конфликт, он в отчаянии направляется к выходу.", "branch_id": "branch_03", "branch_order": 5}, "branch_03_scene_006": {"id": "branch_03_scene_006", "location": "Серые Зоны", "pov_character": "Рэй", "present_characters": ["Рэй", "Посланник", "Элара"], "lines": [{"type": "narration", "speaker": null, "text": "Дверь бара «Эклипс» с шипением отъехала в сторону, выплевывая Рэя обратно в промозглую ночь Серых Зон."}, {"type": "narration", "speaker": null, "text": "Дождь здесь был другим. Не просто вода с неба, а едкая смесь кислотных осадков и грязи, стекающей с верхних уровней города-улья. Он смывал неоновый свет с асфальта, но не мог смыть отчаяние."}, {"type": "thought", "speaker": "Рэй", "text": "Ни с чем. Пустота в карманах, пустота впереди. Загнанный зверь."}, {"type": "narration", "speaker": null, "text": "Поражение было горьким, как застоявшаяся вода в лужах под ногами. Он был дезертиром, мишенью. Без кредитов, без союзников."}, {"type": "thought", "speaker": "Рэй", "text": "Ищейки «Эгиды» уже идут по следу. Каждый патрульный дрон, каждая камера. Я — сбой в системе, который нужно стереть."}, {"type": "narration", "speaker": null, "text": "Он сделал шаг, и в тот же миг из самого густого мрака, где свет неоновых вывесок тонул без остатка, донесся тихий, ровный голос."}, {"type": "dialogue", "speaker": "Посланник", "text": "Слишком рано уходишь, Чистильщик."}, {"type": "narration", "speaker": null, "text": "Тело Рэя отреагировало прежде разума. Мышцы напряглись, боевые импланты взвыли, готовясь к бою. Но он заставил себя замереть. Отчаяние было сильнее инстинктов."}, {"type": "narration", "speaker": null, "text": "Из тени выступила андрогинная фигура, закутанная в темный плащ. Его аугментированный глаз попытался просканировать ее, но интерфейс зашипел статикой. Пустота. Словно смотришь на дыру в самой реальности."}, {"type": "thought", "speaker": "Рэй", "text": "Технология здесь бессильна. Что это?"}, {"type": "dialogue", "speaker": "Посланник", "text": "Госпожа готова тебя видеть."}, {"type": "thought", "speaker": "Рэй", "text": "Госпожа... Элара? Это ловушка? Или единственный шанс?"}, {"type": "narration", "speaker": null, "text": "Надежда, ядовитая и хрупкая, шевельнулась в груди."}, {"type": "dialogue", "speaker": "Рэй", "text": "Кто твоя 'Госпожа'? И зачем я ей понадобился?"}, {"type": "narration", "speaker": null, "text": "Фигура сделала шаг ближе. Взгляд холодных, почти бесцветных глаз, казалось, сканировал его душу."}, {"type": "dialogue", "speaker": "Посланник", "text": "Она не терпит игр. И вопросы здесь задает она. Для тебя лишь одно правило."}, {"type": "narration", "speaker": null, "text": "Голос посланника не повысился, но каждое слово падало, как капля жидкого азота."}, {"type": "dialogue", "speaker": "Посланник", "text": "Любая ложь или попытка агрессии будет стоить тебе жизни. Немедленно."}, {"type": "narration", "speaker": null, "text": "В доказательство этих слов фигура сделала едва заметное движение пальцами. Тень Рэя на мокрой стене исказилась, вытянулась, на мгновение приняв форму припавшего к земле хищника с горящими глазами."}, {"type": "narration", "speaker": null, "text": "Рэя пробил холодный пот. Это была магия. Чистая, первобытная сила."}, {"type": "thought", "speaker": "Рэй", "text": "Против такого мой 'Шторм' — просто кусок железа. Я безоружен."}, {"type": "narration", "speaker": null, "text": "Фантомный спазм в кибернетической руке напомнил о другом поводке, другой угрозе. Той, что уже внутри."}, {"type": "thought", "speaker": "Рэй", "text": "Элиас... он в коме из-за них. Из-за меня. Этот поводок... я должен знать. У меня нет выбора."}, {"type": "narration", "speaker": null, "text": "Он чувствовал себя так, будто стоит на краю пропасти, и единственный мост через нее — паутина."}, {"type": "dialogue", "speaker": "Посланник", "text": "Так зачем сломанной игрушке 'Эгиды' понадобилась моя Госпожа?"}, {"type": "thought", "speaker": "Рэй", "text": "Игрушка... В другой день за такие слова я бы вырвал тебе кадык. Но сегодня... сегодня ты прав. Они сломали меня, когда заставили выбирать между приказом и жизнью товарища."}, {"type": "narration", "speaker": null, "text": "Вопрос был прямым, как удар ножом. Рэй сглотнул ком горечи и солдатской гордости."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я больше не их игрушка."}, {"type": "narration", "speaker": null, "text": "Голос Рэя был хриплым от напряжения и отчаяния."}, {"type": "dialogue", "speaker": "Рэй", "text": "Корпорация предала меня. Они вшили в меня цифровой поводок, чтобы дергать за ниточки. Я ищу не мести. Я ищу правду."}, {"type": "thought", "speaker": "Рэй", "text": "Правду о том, почему они хотели меня убить руками вампира. Правду о том, что они скрывают."}, {"type": "narration", "speaker": null, "text": "Посланник молча смотрел на него несколько долгих секунд, оценивая. Затем на мертвенно-бледном лице появилось нечто похожее на понимание."}, {"type": "dialogue", "speaker": "Посланник", "text": "Госпожа знает о твоих цепях."}, {"type": "narration", "speaker": null, "text": "Слова упали в тишину переулка, заглушая даже шум дождя."}, {"type": "thought", "speaker": "Рэй", "text": "Она знает. Не просто догадывается — знает. Значит, Элара видела больше, чем просто сбой в системе в том переулке. Она видела кукловода."}, {"type": "dialogue", "speaker": "Посланник", "text": "Она единственная, кто может сказать тебе, как их разорвать... или кто держит другой конец."}, {"type": "narration", "speaker": null, "text": "Это было все. Ответ на все его вопросы был там, во тьме, за спиной этой фигуры."}, {"type": "narration", "speaker": null, "text": "Рэй медленно, демонстративно расслабил плечи и убрал правую руку от рукояти пистолета, которую бессознательно сжимал. Это был жест капитуляции. И выбора."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я согласен на ваши условия."}, {"type": "narration", "speaker": null, "text": "Посланник коротко кивнул, словно именно этого ответа и ждал."}, {"type": "dialogue", "speaker": "Посланник", "text": "Следуй за мной. И не пытайся запомнить дорогу."}, {"type": "narration", "speaker": null, "text": "Фигура развернулась и беззвучно скользнула в лабиринт темных, извилистых переулков."}, {"type": "thought", "speaker": "Рэй", "text": "Шаг в неизвестность. Шаг прочь от 'Эгиды'. Шаг к врагу, который обещал правду. Назад дороги нет."}, {"type": "narration", "speaker": null, "text": "Рэй сделал глубокий вдох, впуская в легкие холодный, влажный воздух, и шагнул во тьму следом."}], "choices": [], "summary": "На грани полного отчаяния после провала в баре, Рэй сталкивается с таинственным посланником Элары. Ему предлагают встречу с 'Госпожой' на смертельно опасных условиях: никакой лжи и агрессии. Посланник демонстрирует магическую силу, доказывая тщетность сопротивления. Узнав, что Элара знает о 'цифровом поводке' и может раскрыть, кто за ним стоит, Рэй принимает предложение. Он сознательно отбрасывает свою гордость и прошлое солдата, доверяя свою жизнь бывшему врагу в отчаянной попытке обрести правду и свободу.", "branch_id": "branch_03", "branch_order": 6}, "branch_03_scene_007": {"id": "branch_03_scene_007", "location": "Подземная библиотека (убежище Элары)", "pov_character": "Рэй", "present_characters": ["Рэй", "Элара"], "lines": [{"type": "narration", "speaker": null, "text": "Проводник, которого Элара прислала за ним в 'Эклипс', вел Рэя по путям, которых не было ни на одной карте. Узкий проход за ржавым мусорным баком обернулся крутой лестницей вниз, в темноту, пахнущую вековой пылью и озоном."}, {"type": "narration", "speaker": null, "text": "Они миновали заброшенные тоннели метро, где по стенам вились светящиеся грибы, и наконец остановились у глухой стены, казавшейся монолитной."}, {"type": "narration", "speaker": null, "text": "Фигура в плаще коснулась камня, и тот беззвучно отъехал в сторону, открывая проход в помещение, залитое теплым, мягким светом."}, {"type": "thought", "speaker": "Рэй", "text": "Никаких сканеров. Никаких турелей. Либо она безумна, либо настолько уверена в своей силе."}, {"type": "narration", "speaker": null, "text": "Проводник жестом указал Рэю войти, а затем, когда он переступил порог, панель с таким же безмолвием встала на место, отрезая его от мира."}, {"type": "narration", "speaker": null, "text": "Рэй оказался в круглой комнате, стены которой от пола до потолка занимали книжные полки. Воздух был пропитан запахом старой бумаги, кожи и чего-то неуловимо-пряного, как древние благовония."}, {"type": "narration", "speaker": null, "text": "Тихие шаги по ковру. Из тени между стеллажами вышла Элара. На ней не было боевой брони — лишь длинное темное платье, делавшее ее похожей на аристократку из давно ушедшей эпохи."}, {"type": "dialogue", "speaker": "Элара", "text": "Наконец-то поводок сломался. А я уж думала, он врос в твою жалкую плоть."}, {"type": "narration", "speaker": null, "text": "В ее голосе не было злобы, лишь ленивое, хищное любопытство. Она медленно обошла его, не скрывая оценивающего взгляда."}, {"type": "dialogue", "speaker": "Элара", "text": "Теперь мы можем поговорить, сломанная игрушка 'Эгиды'."}, {"type": "thought", "speaker": "Рэй", "text": "Подави это. Гордость — это роскошь. У тебя ее больше нет."}, {"type": "dialogue", "speaker": "Рэй", "text": "Я пришел за правдой."}, {"type": "dialogue", "speaker": "Элара", "text": "Правда? Какая смелая концепция для солдата, вся жизнь которого построена на лжи."}, {"type": "dialogue", "speaker": "Рэй", "text": "Ты сказала, они лгут мне. Про мою руку. Про 'цифровой поводок'. Я хочу знать всё."}, {"type": "narration", "speaker": null, "text": "Элара подошла к столу из темного дерева, заваленному свитками и странными артефактами. Она провела пальцем по обложке древней книги."}, {"type": "dialogue", "speaker": "Элара", "text": "И почему же я должна делиться знанием с тем, кто еще вчера охотился на меня? Чего тебе стоил этот поход за 'правдой', железный человек?"}, {"type": "narration", "speaker": null, "text": "Образ Элиаса, бледного и без сознания на столе риппердока, вспыхнул в памяти Рэя."}, {"type": "dialogue", "speaker": "Рэй", "text": "Всего. Я дезертир. Мой напарник, Элиас, в коме из-за раны, которую нанесли вы... и из-за того, что моя рука отказала. Я оставил его, чтобы найти тебя. У меня ничего не осталось."}, {"type": "narration", "speaker": null, "text": "На губах Элары появилась тень удовлетворенной улыбки."}, {"type": "dialogue", "speaker": "Элара", "text": "Хорошо. Отчаяние — отличный учитель. Оно отучает лгать."}, {"type": "narration", "speaker": null, "text": "Она подняла с подставки небольшой кристалл, который тускло пульсировал светом. Легким движением она активировала его, и в воздухе между ними возникла голограмма."}, {"type": "dialogue", "speaker": "Элара", "text": "Твой 'сбой' не был сбоем. Это была команда. Функция, заложенная в твой имплант с самого начала."}, {"type": "narration", "speaker": null, "text": "Она указала на строку кода: `UNIT_734_RAI.K_NEURAL_OVERRIDE: WEAPON_SYS_LOCK. TRIGGER: PROXIMITY_ANOMALY_E.CLASS`."}, {"type": "dialogue", "speaker": "Элара", "text": "Они не просто могут тебя отключить. Они сделали это намеренно. В тот самый момент, когда ты мог меня убить."}, {"type": "thought", "speaker": "Рэй", "text": "Они... подставили меня. Пожертвовали Элиасом. Они хотели, чтобы она ушла."}, {"type": "narration", "speaker": null, "text": "Холод, не имеющий ничего общего с температурой комнаты, пробрал Рэя до костей. Это было не просто предательство. Это была постановка."}, {"type": "dialogue", "speaker": "Рэй", "text": "Зачем?"}, {"type": "dialogue", "speaker": "Элара", "text": "Чтобы ты оказался здесь. Отчаявшийся, преданный и готовый слушать. Им был нужен не мой труп. Им нужна была эта встреча, чтобы передать через меня... сообщение."}, {"type": "narration", "speaker": null, "text": "Элара деактивировала голограмму и взяла со стола другой предмет — тонкий чип из черного обсидиана."}, {"type": "dialogue", "speaker": "Элара", "text": "Твой поводок — это лишь верхушка айсберга. Всего лишь инструмент. Здесь — настоящая причина. Истинные цели 'Эгиды'."}, {"type": "narration", "speaker": null, "text": "Она протянула чип Рэю. Он взял его и, помедлив секунду, вставил в интерфейсный порт на затылке."}, {"type": "narration", "speaker": null, "text": "Поток данных хлынул прямо в его мозг. Не отчеты — доказательства. Записи переговоров о 'контролируемых инцидентах'. Схемы поставок оружия бандам в Серых Зонах. Списки пропавших без вести гражданских напротив кодовых названий экспериментов по гибридизации магии и технологий."}, {"type": "narration", "speaker": null, "text": "Вся его жизнь, вся его служба, каждая 'героическая' миссия — всё было частью чудовищной лжи."}, {"type": "thought", "speaker": "Рэй", "text": "Мы были не щитом. Мы были инструментом для эскалации. Для создания хаоса, которым они могли управлять."}, {"type": "narration", "speaker": null, "text": "Рэй пошатнулся, отключая чип. Мир вокруг на мгновение потерял четкость. Его вырвало бы, если бы в желудке было хоть что-то."}, {"type": "dialogue", "speaker": "Элара", "text": "Теперь ты видишь. 'Эгида' — это не спасение от хаоса. Это его источник. Раковая опухоль, пожирающая город изнутри. И я намерена ее вырезать."}, {"type": "narration", "speaker": null, "text": "Она сделала шаг к нему. В ее глазах больше не было насмешки, только холодная, вековая решимость."}, {"type": "dialogue", "speaker": "Элара", "text": "Но мне не хватает скальпеля, который знает анатомию врага. У меня есть разведданные, но нет понимания их внутренних протоколов."}, {"type": "dialogue", "speaker": "Рэй", "text": "Что вы предлагаете?"}, {"type": "dialogue", "speaker": "Элара", "text": "Союз. Ты даешь мне их тактику, слабые места, коды доступа. Все, что может помочь разрушить их изнутри. А я даю тебе цель. И месть."}, {"type": "thought", "speaker": "Рэй", "text": "Союз с монстром, чтобы уничтожить других монстров. Это единственный путь."}, {"type": "narration", "speaker": null, "text": "Рэй сделал глубокий вдох, собирая воедино осколки своей прежней личности."}, {"type": "dialogue", "speaker": "Рэй", "text": "Хорошо."}, {"type": "narration", "speaker": null, "text": "Он шагнул к столу, на котором лежала пустая дата-планшетка."}, {"type": "dialogue", "speaker": "Рэй", "text": "Протокол 'Бастион'. Экстренная эвакуация командного состава с любой базы 'Эгиды'. Есть триггер-фраза, которая запускает его по всем каналам. У вас будет окно в девяносто секунд, чтобы нанести удар по штабу, пока все шлюзы открыты, а системы активной защиты перезагружаются."}, {"type": "narration", "speaker": null, "text": "Он быстро набрал на планшетке информацию — коды, тайминги, уязвимости. Это была информация уровня 'совершенно секретно'. Он отодвинул планшетку в ее сторону. Обмен состоялся. Доверие, купленное предательством."}, {"type": "narration", "speaker": null, "text": "Элара взглянула на данные, и на ее лице впервые отразилось нечто похожее на одобрение."}, {"type": "dialogue", "speaker": "Элара", "text": "Добро пожаловать в войну, Рэй. В настоящую войну."}], "choices": [], "summary": "В убежище Элары Рэй получает неопровержимые доказательства предательства 'Эгиды' и масштаба их заговора. Узнав, что сбой его руки был подстроен, а корпорация провоцирует хаос в городе, он заключает с вампиршей вынужденный союз, скрепляя его обменом ценной тактической информацией.", "branch_id": "branch_03", "branch_order": 7}}, "assets": {"characters": {"Рэй": "assets/characters/001_рэй.png", "Мира Нокт": "assets/characters/002_мира_нокт.png", "Сол Вэйн": "assets/characters/003_сол_вэйн.png", "Доктор Касс Арден": "assets/characters/004_доктор_касс_арден.png", "Элиас Грей": "assets/characters/005_элиас_грей.png", "Лилит Вольт": "assets/characters/006_лилит_вольт.png", "Валериус": "assets/characters/007_валериус.png", "Техник": "assets/characters/008_техник.png", "Чистильщик": "assets/characters/009_чистильщик.png", "Торговец": "assets/characters/010_торговец.png", "Риппердок": "assets/characters/011_риппердок.png", "Главарь банды": "assets/characters/012_главарь_банды.png", "Громила": "assets/characters/013_громила.png", "Посланник": "assets/characters/014_посланник.png", "Элара": "assets/characters/015_элара.png", "Гриз": "assets/characters/016_гриз.png", "Водитель": "assets/characters/017_водитель.png", "Боец Гамма": "assets/characters/018_боец_гамма.png", "Посланник Элары": "assets/characters/019_посланник_элары.png"}, "locations": {"Штаб-квартира корпорации 'Эгида'": "assets/backgrounds/001_штаб-квартира_корпорации_эгида.png", "Технический отсек 'Эгиды'": "assets/backgrounds/002_технический_отсек_эгиды.png", "Кабинет директора Валериуса": "assets/backgrounds/003_кабинет_директора_валериуса.png", "Неоновые улицы района 'Нижний Гелиос'": "assets/backgrounds/004_неоновые_улицы_района_нижний_гелиос.png", "Бронетранспортер 'Чистильщиков'": "assets/backgrounds/005_бронетранспортер_чистильщиков.png", "Заброшенный готический театр": "assets/backgrounds/006_заброшенный_готический_театр.png", "Квартира Каэла": "assets/backgrounds/007_квартира_каэла.png", "Защищенный технический архив 'Эгиды'": "assets/backgrounds/008_защищенный_технический_архив_эгиды.png", "Серые Зоны": "assets/backgrounds/009_серые_зоны.png", "Подземная библиотека (убежище Элары)": "assets/backgrounds/010_подземная_библиотека_убежище_элары.png"}}}</script>
  <script>
    const VN_DATA = JSON.parse(document.getElementById("vn-data").textContent);

    const HINT_CONTINUE = "Клик / Пробел / Enter";
    const HINT_CHOOSE = "Сделайте выбор";
    const HINT_END = "Маршрут завершён";

    const dom = {
      game: document.getElementById("game"),
      bg: document.getElementById("bg"),
      spriteLayer: document.getElementById("sprite-layer"),
      location: document.getElementById("location"),
      namebox: document.getElementById("namebox"),
      text: document.getElementById("text"),
      textScroll: document.getElementById("text-scroll"),
      hint: document.getElementById("hint"),
      choices: document.getElementById("choices"),
      ending: document.getElementById("ending"),
      restart: document.getElementById("restart-btn"),
    };

    const state = {
      sceneId: String(VN_DATA.start_scene_id),
      lineIndex: -1,
      waitingChoice: false,
      ended: false,
    };

    function normalizeName(value) {
      return String(value || "").trim().toLocaleLowerCase();
    }

    function uniqueList(items) {
      const out = [];
      const seen = new Set();

      (Array.isArray(items) ? items : []).forEach((item) => {
        const value = String(item || "").trim();
        const key = value.toLocaleLowerCase();
        if (!value || seen.has(key)) return;
        seen.add(key);
        out.push(value);
      });

      return out;
    }

    function isInteractiveTarget(target) {
      return !!(target && target.closest && target.closest("button, a, input, textarea, select"));
    }

    function sceneById(sceneId) {
      return VN_DATA.scenes[String(sceneId)] || null;
    }

    function positionsFor(count) {
  if (count <= 0) return [];
  if (count === 1) return [50];
  if (count === 2) return [32, 68];
  if (count === 3) return [20, 50, 80];
  if (count === 4) return [12, 38, 62, 88];

  const start = 8;
  const end = 92;
  const step = (end - start) / Math.max(1, count - 1);
  return Array.from({ length: count }, (_, i) => start + i * step);
}

function spriteHeightPercent(count) {
  if (count >= 6) return 56;
  if (count === 5) return 62;
  if (count === 4) return 70;
  if (count === 3) return 78;
  if (count === 2) return 86;
  return 92;
}

function spriteWidthPercent(count) {
  if (count >= 6) return 15;
  if (count === 5) return 17;
  if (count === 4) return 20;
  if (count === 3) return 25;
  if (count === 2) return 31;
  return 36;
}
    function setHint(text) {
      dom.hint.textContent = text || "";
    }

    function setBackground(scene) {
      const location = scene && scene.location ? String(scene.location) : "";
      dom.location.textContent = location ? ("Локация: " + location) : "";
      dom.location.hidden = !location;

      const src = location ? (VN_DATA.assets.locations || {})[location] : null;
      if (src) {
        dom.bg.style.backgroundImage =
          'linear-gradient(to top, rgba(0,0,0,0.20), rgba(0,0,0,0.08)), url("' + encodeURI(src) + '")';
      } else {
        dom.bg.style.backgroundImage =
          "radial-gradient(circle at top, rgba(70,90,130,0.68), rgba(0,0,0,0.96) 72%)";
      }
    }

    function renderSprites(scene, activeSpeaker) {
      dom.spriteLayer.innerHTML = "";
      if (!scene) return;

      const charAssets = VN_DATA.assets.characters || {};
      const present = uniqueList(scene.present_characters).filter((name) => !!charAssets[name]);

      if (activeSpeaker && charAssets[activeSpeaker]) {
        const exists = present.some((name) => normalizeName(name) === normalizeName(activeSpeaker));
        if (!exists) {
          present.push(activeSpeaker);
        }
      }

      const positions = positionsFor(present.length);
      const height = spriteHeightPercent(present.length);
      const width = spriteWidthPercent(present.length);

      present.forEach((name, idx) => {
        const src = charAssets[name];
        if (!src) return;

        const img = document.createElement("img");
        img.className = "sprite";
        img.src = encodeURI(src);
        img.alt = name;
        img.loading = "eager";
        img.decoding = "async";
        img.draggable = false;
        img.style.left = positions[idx] + "%";
        img.style.height = height + "%";
        img.style.maxWidth = width + "%";

        const isActive = activeSpeaker && normalizeName(activeSpeaker) === normalizeName(name);
        img.classList.add(isActive ? "active" : "inactive");
        img.style.zIndex = isActive ? "10" : String(idx + 1);

        dom.spriteLayer.appendChild(img);
      });
    }

    function findChoiceAfterLine(scene, lineIndex) {
      const choices = Array.isArray(scene.choices) ? scene.choices : [];
      return choices.find((choice) => Number(choice.appears_after_line) === Number(lineIndex)) || null;
    }

    function clearChoices() {
      dom.choices.innerHTML = "";
      dom.choices.style.display = "none";
      state.waitingChoice = false;
      setHint(HINT_CONTINUE);
    }

    function showChoices(choice) {
      const options = Array.isArray(choice && choice.options) ? choice.options : [];
      if (!options.length) {
        clearChoices();
        return;
      }

      state.waitingChoice = true;
      dom.choices.innerHTML = "";
      dom.choices.style.display = "grid";
      dom.choices.scrollTop = 0;
      setHint(HINT_CHOOSE);

      options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn" + (opt && opt.is_fake ? " fake" : "");
        btn.textContent = (opt && opt.text) ? opt.text : "Продолжить";
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          chooseOption(opt);
        });
        dom.choices.appendChild(btn);
      });

      const firstButton = dom.choices.querySelector("button");
      if (firstButton) {
        firstButton.focus();
      }
    }

    function renderLine(scene, line) {
      const rawType = String((line && line.type) || "narration").trim().toLocaleLowerCase();
      const speaker = String((line && line.speaker) || (scene && scene.pov_character) || "").trim();
      const narrationTypes = new Set(["narration", "narrative", "description", "scene"]);
      const thoughtTypes = new Set(["thought", "inner_thought", "inner-thought", "inner_monologue", "мысль", "мысли"]);

      dom.text.textContent = String((line && line.text) || "");
      dom.textScroll.scrollTop = 0;

      if (narrationTypes.has(rawType) || !speaker) {
        dom.namebox.style.display = "none";
        dom.namebox.textContent = "";
        renderSprites(scene, null);
        return;
      }

      dom.namebox.style.display = "inline-block";
      if (thoughtTypes.has(rawType)) {
        dom.namebox.textContent = speaker ? (speaker + " (мысли)") : "Мысли";
      } else {
        dom.namebox.textContent = speaker;
      }

      renderSprites(scene, speaker);
    }

    function nextSceneId(scene) {
      return VN_DATA.next_scene_map[String(scene.id)] || null;
    }

    function endGame() {
      state.ended = true;
      state.waitingChoice = true;
      dom.ending.classList.add("show");
      setHint(HINT_END);
    }

    function hideEnding() {
      dom.ending.classList.remove("show");
      state.ended = false;
    }

    function goToScene(sceneId) {
      const scene = sceneById(sceneId);
      if (!scene) {
        endGame();
        return;
      }

      state.sceneId = String(sceneId);
      state.lineIndex = -1;
      clearChoices();
      setBackground(scene);
      renderSprites(scene, null);
      advance();
    }

    function chooseOption(opt) {
      clearChoices();

      const target = opt && opt.leads_to_scene_id ? String(opt.leads_to_scene_id) : null;
      if (target) {
        goToScene(target);
        return;
      }

      const currentScene = sceneById(state.sceneId);
      const fallbackNext = currentScene ? nextSceneId(currentScene) : null;
      if (fallbackNext) {
        goToScene(fallbackNext);
        return;
      }

      endGame();
    }

    function advance() {
      if (state.waitingChoice || state.ended) return;

      const scene = sceneById(state.sceneId);
      if (!scene) {
        endGame();
        return;
      }

      const lines = Array.isArray(scene.lines) ? scene.lines : [];
      if (state.lineIndex + 1 < lines.length) {
        state.lineIndex += 1;
        const line = lines[state.lineIndex];
        renderLine(scene, line);

        const choice = findChoiceAfterLine(scene, state.lineIndex);
        if (choice) {
          showChoices(choice);
        }
        return;
      }

      const nextId = nextSceneId(scene);
      if (nextId) {
        goToScene(nextId);
        return;
      }

      endGame();
    }

    function preloadAssets() {
      const paths = new Set();

      Object.values(VN_DATA.assets.characters || {}).forEach((p) => {
        if (p) paths.add(p);
      });

      Object.values(VN_DATA.assets.locations || {}).forEach((p) => {
        if (p) paths.add(p);
      });

      paths.forEach((src) => {
        const img = new Image();
        img.decoding = "async";
        img.src = encodeURI(src);
      });
    }

    dom.game.addEventListener("click", (ev) => {
      if (isInteractiveTarget(ev.target)) return;
      advance();
    });

    window.addEventListener("keydown", (ev) => {
      if (state.ended) {
        if (ev.code === "Space" || ev.code === "Enter") {
          ev.preventDefault();
          hideEnding();
          goToScene(VN_DATA.start_scene_id);
        }
        return;
      }

      if (state.waitingChoice) return;
      if (isInteractiveTarget(ev.target)) return;

      if (ev.code === "Space" || ev.code === "Enter") {
        ev.preventDefault();
        advance();
      }
    });

    dom.restart.addEventListener("click", (ev) => {
      ev.stopPropagation();
      hideEnding();
      goToScene(VN_DATA.start_scene_id);
    });

    preloadAssets();
    goToScene(VN_DATA.start_scene_id);
  </script>
</body>
</html>
